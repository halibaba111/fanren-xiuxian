      const TUTORIAL_ORDER = Object.keys(TUTORIAL_DEFINITIONS);
      const SYSTEM_TUTORIAL_ORDER = [
        "system_map",
        "system_character",
        "system_summon",
        "system_bag",
        "system_tower",
      ];

      function getTutorialDefinition(step = state.tutorialStep) {
        return TUTORIAL_DEFINITIONS[step] || null;
      }

      function getTutorialStartStep() {
        if (state.tutorialSkipped) return "";
        if (SYSTEM_TUTORIAL_ORDER.includes(state.tutorialStep)) {
          return state.tutorialStep;
        }
        if (!state.rootLocked) {
          return "";
        }
        if (
          state.tutorialStep
          && ["chapter1_tasks", "chapter1_character", "chapter2_bag", "chapter2_forge"]
            .includes(state.tutorialStep)
        ) {
          return state.tutorialStep;
        }
        return "system_map";
      }

      function prepareInitialTutorialOffer() {
        state.tutorialOfferOpen = false;
        if (!state.rootLocked) {
          state.tutorialEnabled = false;
          state.tutorialStep = "";
        } else if (["root_draw", "root_select", "root_lock"].includes(state.tutorialStep)) {
          state.tutorialEnabled = false;
          state.tutorialStep = "";
        }
      }

      function setTutorialSystemContext(step) {
        const tabByStep = {
          system_map: "map",
          system_character: "character",
          system_summon: "summon",
          system_bag: "bag",
          system_tower: "tower",
        };
        const nextTab = tabByStep[step];
        if (nextTab) {
          state.tab = nextTab;
        }
      }

      function getTutorialTarget(definition) {
        if (!definition || !gameFrame) return gameFrame;
        const candidates = (definition.targets || [])
          .map((selector) => {
            try {
              return document.querySelector(selector);
            } catch (error) {
              return null;
            }
          })
          .filter((element) => (
            element
            && gameFrame.contains(element)
            && element.getClientRects().length
            && getComputedStyle(element).display !== "none"
            && getComputedStyle(element).visibility !== "hidden"
          ));
        return candidates[0]
          || content.querySelector("[data-scroll-surface]")
          || gameFrame;
      }

      function setTutorialBlockerBox(element, left, top, width, height) {
        if (!element) return;
        element.style.left = `${Math.max(0, left)}px`;
        element.style.top = `${Math.max(0, top)}px`;
        element.style.width = `${Math.max(0, width)}px`;
        element.style.height = `${Math.max(0, height)}px`;
      }

      function positionTutorialOverlay() {
        const overlay = overlayRoot.querySelector("[data-tutorial-overlay]");
        const definition = getTutorialDefinition();
        if (!overlay || !definition || !gameFrame) return;
        const target = getTutorialTarget(definition);
        const frameRect = gameFrame.getBoundingClientRect();
        const frameWidth = gameFrame.clientWidth;
        const frameHeight = gameFrame.clientHeight;
        const targetRect = target.getBoundingClientRect();
        const padding = 6;
        const focusLeft = clamp(targetRect.left - frameRect.left - padding, 4, Math.max(4, frameWidth - 12));
        const focusTop = clamp(targetRect.top - frameRect.top - padding, 4, Math.max(4, frameHeight - 12));
        const focusRight = clamp(targetRect.right - frameRect.left + padding, focusLeft + 12, frameWidth - 4);
        const focusBottom = clamp(targetRect.bottom - frameRect.top + padding, focusTop + 12, frameHeight - 4);
        const focusWidth = Math.max(12, focusRight - focusLeft);
        const focusHeight = Math.max(12, focusBottom - focusTop);
        const focus = overlay.querySelector("[data-tutorial-focus]");
        if (focus) {
          focus.style.left = `${focusLeft}px`;
          focus.style.top = `${focusTop}px`;
          focus.style.width = `${focusWidth}px`;
          focus.style.height = `${focusHeight}px`;
        }

        setTutorialBlockerBox(
          overlay.querySelector("[data-tutorial-blocker='top']"),
          0,
          0,
          frameWidth,
          focusTop,
        );
        setTutorialBlockerBox(
          overlay.querySelector("[data-tutorial-blocker='left']"),
          0,
          focusTop,
          focusLeft,
          focusHeight,
        );
        setTutorialBlockerBox(
          overlay.querySelector("[data-tutorial-blocker='right']"),
          focusRight,
          focusTop,
          frameWidth - focusRight,
          focusHeight,
        );
        setTutorialBlockerBox(
          overlay.querySelector("[data-tutorial-blocker='bottom']"),
          0,
          focusBottom,
          frameWidth,
          frameHeight - focusBottom,
        );

        const card = overlay.querySelector(".tutorial-card");
        const arrow = overlay.querySelector(".tutorial-arrow");
        if (!card || !arrow) return;
        const cardWidth = Math.min(340, Math.max(240, frameWidth - 28));
        card.style.left = `${Math.max(14, (frameWidth - cardWidth) / 2)}px`;
        card.style.right = "auto";
        card.style.width = `${cardWidth}px`;
        card.style.top = "auto";
        card.style.bottom = "auto";
        if (definition.freeInteraction === true) {
          card.style.top = "12px";
          card.style.bottom = "auto";
        } else if (focusTop > frameHeight * .56) {
          card.style.top = "12px";
          card.style.bottom = "auto";
        } else {
          card.style.bottom = "12px";
          card.style.top = "auto";
        }
        const cardRect = card.getBoundingClientRect();
        const cardAboveTarget = cardRect.bottom <= targetRect.top;
        arrow.style.left = `${clamp(
          targetRect.left - frameRect.left + targetRect.width / 2 - 7,
          14,
          Math.max(14, frameWidth - 28),
        )}px`;
        arrow.style.top = cardAboveTarget
          ? `${clamp(focusTop - 18, 18, frameHeight - 24)}px`
          : `${clamp(focusBottom + 8, 18, frameHeight - 24)}px`;
        arrow.style.transform = cardAboveTarget ? "rotate(180deg)" : "rotate(0deg)";
      }

      function setOverlayMarkup(markup, overlayKey = "") {
        if (!overlayRoot) return;
        const previousKey = overlayRoot.dataset.overlayKey || "";
        const hasPreviousOverlay = Boolean(overlayRoot.firstElementChild);
        const isSameOverlay = Boolean(
          hasPreviousOverlay
          && markup
          && previousKey
          && previousKey === overlayKey,
        );
        overlayRoot.classList.toggle("is-overlay-update", isSameOverlay);
        overlayRoot.dataset.overlayKey = overlayKey;
        overlayRoot.innerHTML = markup;
      }

      function renderTutorialOverlay() {
        if (!state.tutorialEnabled || !getTutorialDefinition()) return;
        setOverlayMarkup(`
          <div class="tutorial-overlay" data-tutorial-overlay>
            <div class="tutorial-blocker" data-tutorial-blocker="top"></div>
            <div class="tutorial-blocker" data-tutorial-blocker="left"></div>
            <div class="tutorial-blocker" data-tutorial-blocker="right"></div>
            <div class="tutorial-blocker" data-tutorial-blocker="bottom"></div>
            <div class="tutorial-focus" data-tutorial-focus aria-hidden="true"></div>
            <div class="tutorial-arrow" aria-hidden="true"></div>
            <section class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
              <div class="tutorial-kicker">新手引导 · ${escapeHtml(getTutorialDefinition().index)}</div>
              <div class="tutorial-title" id="tutorialTitle">${escapeHtml(getTutorialDefinition().title)}</div>
              <p class="tutorial-copy">${escapeHtml(getTutorialDefinition().copy)}</p>
              <div class="tutorial-actions">
                <button class="small-button tutorial-skip" type="button" data-tutorial-skip>跳过引导</button>
                <button class="small-button" type="button" data-tutorial-next>${escapeHtml(getTutorialDefinition().nextLabel || "下一步")}</button>
              </div>
            </section>
          </div>
        `, `tutorial-step:${state.tutorialStep || "unknown"}`);
        if (tutorialPositionFrame) {
          window.cancelAnimationFrame(tutorialPositionFrame);
        }
        tutorialPositionFrame = window.requestAnimationFrame(() => {
          // render() restores the previous scroll position in this frame. Wait one more
          // frame so the tutorial can center its target after that restoration finishes.
          tutorialPositionFrame = window.requestAnimationFrame(() => {
            tutorialPositionFrame = 0;
            const target = getTutorialTarget(getTutorialDefinition());
            const scrollSurface = target?.closest?.("[data-scroll-surface]");
            if (scrollSurface && !target.matches("[data-tab]")) {
              target.scrollIntoView({ behavior: "auto", block: "center", inline: "nearest" });
            }
            positionTutorialOverlay();
          });
        });
      }

      function startTutorial() {
        state.tutorialOfferOpen = false;
        state.tutorialOfferSeen = true;
        state.tutorialEnabled = true;
        state.tutorialComplete = false;
        state.tutorialSkipped = false;
        state.activeGuide = "";
        state.tutorialStep = getTutorialStartStep();
        setTutorialSystemContext(state.tutorialStep);
        persistPreviewState();
        render();
      }

      function skipTutorial() {
        state.tutorialOfferOpen = false;
        state.tutorialOfferSeen = true;
        state.tutorialEnabled = false;
        state.tutorialComplete = false;
        state.tutorialSkipped = true;
        state.tutorialStep = "";
        persistPreviewState();
        render();
        showToast("已跳过新手引导，可在设置中重新查看", "confirm");
      }

      function finishTutorial(message = "") {
        state.tutorialOfferOpen = false;
        state.tutorialOfferSeen = true;
        state.tutorialEnabled = false;
        state.tutorialComplete = true;
        state.tutorialSkipped = false;
        state.tutorialStep = "";
        persistPreviewState();
        render();
        showToast(message || "新手引导已完成，可自由探索", "confirm");
      }

      function finishTutorialPhase(message = "") {
        state.tutorialOfferOpen = false;
        state.tutorialEnabled = false;
        state.tutorialStep = "";
        state.tutorialComplete = Boolean(
          state.tutorialChapter1GuideDone && state.tutorialChapter2GuideDone,
        );
        persistPreviewState();
        render();
        if (message) showToast(message, "confirm");
      }

      function revealRoot() {
        if (state.drawn) return;
        state.drawn = true;
        state.candidates = rollCandidates();
        state.candidate = null;
        if (state.tutorialEnabled && state.tutorialStep === "root_draw") {
          state.tutorialStep = "root_select";
        }
        render();
        showToast("灵根已生成，请选择一项锁定");
      }

      function advanceTutorial() {
        const step = state.tutorialStep;
        if (!step) return;
        const systemIndex = SYSTEM_TUTORIAL_ORDER.indexOf(step);
        if (systemIndex >= 0) {
          const nextStep = SYSTEM_TUTORIAL_ORDER[systemIndex + 1];
          if (!nextStep) {
            finishTutorial("系统说明已完成，可自由探索");
            return;
          }
          setTutorialSystemContext(nextStep);
          state.tutorialStep = nextStep;
          persistPreviewState();
          render();
          return;
        }
        if (step === "root_draw") {
          if (!state.drawn) {
            revealRoot();
            return;
          }
          state.tutorialStep = "root_select";
        } else if (step === "root_select") {
          // This button only confirms the explanation. Selecting and locking
          // the root remain explicit player actions in the next step.
          state.tutorialStep = "root_lock";
        } else if (step === "root_lock") {
          if (!state.rootLocked) {
            if (!state.candidate) {
              showToast("请选择灵根");
              return;
            }
            state.rootLocked = true;
            state.tab = "map";
            state.mapView = "world";
            state.selectedRegionId = "outer";
            state.tutorialStep = "map_task";
            preloadCoreBundles();
            showToast("灵根已锁定，已进入岚川院");
          } else {
            state.tutorialStep = "map_task";
          }
        } else if (step === "map_task") {
          state.taskExpanded = true;
          state.tutorialStep = "map_move";
        } else if (step === "map_move") {
          finishTutorialPhase("基础操作已完成，可进入主线");
          return;
        } else if (step === "chapter1_tasks") {
          state.tab = "tasks";
          state.taskSections.chapter1 = true;
          state.taskSections.chapter2 = true;
          state.tutorialStep = "chapter1_character";
        } else if (step === "chapter1_character") {
          state.tab = "character";
          state.tutorialChapter1GuideDone = true;
          finishTutorialPhase("第一章后的栏目说明已完成");
          return;
        } else if (step === "chapter2_bag") {
          state.tab = "bag";
          state.tutorialStep = "chapter2_forge";
        } else if (step === "chapter2_forge") {
          state.tutorialChapter2GuideDone = true;
          finishTutorialPhase("第二章后的装备说明已完成");
          return;
        } else {
          const index = TUTORIAL_ORDER.indexOf(step);
          const nextStep = TUTORIAL_ORDER[index + 1];
          if (!nextStep) {
            finishTutorial();
            return;
          }
          state.tutorialStep = nextStep;
        }
        persistPreviewState();
        render();
      }

      const CONSUMABLE_USE_DEFINITIONS = {
        homegrown_herb: { type: "restoreEnergy", amount: 8, label: "恢复 8 点灵力" },
        hui_qi_powder: { type: "restoreEnergy", amount: 14, label: "恢复 14 点灵力" },
        hui_qi_powder_bonus: { type: "restoreEnergy", amount: 14, label: "恢复 14 点灵力" },
      };

      function getConsumableDefinition(item) {
        if (!item) return null;
        const definition = CONSUMABLE_USE_DEFINITIONS[item.id];
        if (!definition && !item.useType) return null;
        return {
          ...(definition || {}),
          ...(item.useType ? { type: item.useType } : {}),
          ...(Number.isFinite(Number(item.useAmount)) ? { amount: Number(item.useAmount) } : {}),
        };
      }

      function useConsumable(itemId) {
        const item = getInventoryItem(itemId);
        const definition = getConsumableDefinition(item);
        if (!item || !definition) {
          showToast("当前物品不可使用");
          return;
        }
        if (definition.type === "restoreEnergy") {
          const before = state.energy;
          state.energy = Math.max(0, state.energy + Number(definition.amount || 0));
          applyPassiveEnergyRegen();
          removeInventoryItemCount(itemId);
          state.detailModal = null;
          persistPreviewState();
          render();
          showToast(`使用${item.name}：灵力 +${state.energy - before}`, "confirm");
        }
      }

      function renderDetailModal() {
        const detail = state.detailModal;
        if (!detail) return "";

        if (detail.kind === "clue") {
          const clueText = CLUE_CATALOG[detail.id] || detail.id;
          return `
            <div class="modal-overlay" role="presentation">
              <section class="modal-card detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
                <div class="modal-kicker">调查线索 · 完整记录</div>
                <div class="modal-title" id="detailTitle">${escapeHtml(getClueTitle(detail.id))}</div>
                <p class="detail-copy">${escapeHtml(clueText)}</p>
                <div class="modal-actions">
                  <button class="small-button" type="button" data-detail-close>返回背包</button>
                </div>
              </section>
            </div>
          `;
        }

        const item = getInventoryItem(detail.id);
        if (!item) return "";
        const quality = EQUIPMENT_QUALITIES[item.quality || "white"] || EQUIPMENT_QUALITIES.white;
        const slotMeta = EQUIPMENT_SLOT_META[item.slot] || {};
        const statValues = getItemStatValues(item);
        const statLabels = [
          ["attack", "攻击"],
          ["defense", "防御"],
          ["insight", "洞察"],
          ["spirit", "灵力"],
          ["recovery", "回气"],
          ["maxHp", "气血"],
        ];
        const statMarkup = statLabels
          .filter(([key]) => Number(statValues[key] || 0) !== 0)
          .map(([key, label]) => `
            <div class="detail-stat">
              <span>${label}</span>
              <strong>+${statValues[key]}</strong>
            </div>
          `).join("");
        const affixMarkup = (item.affixes || []).length
          ? `<div class="detail-affix-list">${item.affixes.map((affix) => `<div class="detail-affix affix-value-${getAffixValueTier(affix)}">词条 · ${renderAffixLabel(affix)} ${renderAffixValue(affix)}</div>`).join("")}</div>`
          : "";
        const consumable = getConsumableDefinition(item);
        const actionMarkup = item.slot
          ? `
            <button class="small-button" type="button" ${item.equipped
              ? `data-detail-unequip="${item.slot}"`
              : `data-detail-equip="${escapeHtml(item.id)}"`}>
              ${item.equipped ? "卸下装备" : "装备"}
            </button>
            ${isTaskCompleted("main_chapter2")
              ? `<button class="small-button" type="button" data-detail-forge="${escapeHtml(item.id)}">淬炼</button>`
              : ""}
            ${!item.equipped && (isTaskCompleted("main_chapter2") || state.devAllMaps)
              ? `<button class="small-button" type="button" data-detail-sell-equipment="${escapeHtml(item.id)}">装备回收估价 · 灵石 ${getEquipmentSellPrice(item)}</button>`
              : ""}
          `
          : consumable
            ? `<button class="small-button" type="button" data-detail-use="${escapeHtml(item.id)}">使用 · ${escapeHtml(consumable.label || "消耗")}</button>`
            : "";
        return `
          <div class="modal-overlay" role="presentation">
            <section class="modal-card detail-card equipment-detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle" style="--quality-color:${quality.color}">
              <div class="detail-header">
                ${renderEquipmentImage(item, "detail-art")}
                <div class="detail-header-copy">
                  <div class="modal-kicker">${escapeHtml(item.slot ? (EQUIPMENT_SLOTS[item.slot] || "装备") : "杂物")}${item.slot && slotMeta.focus ? ` · ${escapeHtml(slotMeta.focus)}` : ""} · <span style="color:${quality.color}">${quality.name}</span> · 数量 x${Number(item.count || 1)}</div>
                  <div class="modal-title" id="detailTitle">${escapeHtml(item.name)}</div>
                </div>
              </div>
              <p class="detail-copy">${escapeHtml(item.desc || "暂无物品说明。")}</p>
              ${statMarkup ? `<div class="detail-stat-grid">${statMarkup}</div>` : ""}
              ${affixMarkup}
              <div class="modal-actions">
                ${actionMarkup}
                <button class="small-button" type="button" data-detail-close>返回背包</button>
              </div>
            </section>
          </div>
        `;
      }

      function claimPreviewUpdateReward() {
        if (state.summon.updateRewardClaimed === true) {
          showToast("更新奖励已经领取");
          return;
        }
        state.summon.freeTenDraws = Math.min(
          99,
          Math.max(0, Math.floor(Number(state.summon.freeTenDraws) || 0)) + 1,
        );
        state.summon.updateRewardClaimed = true;
        persistPreviewState();
        showToast("更新奖励已到账：免费十连券 ×1", "reward");
        render();
      }

      function renderAnnouncementOverlay() {
        const rewardClaimed = state.summon.updateRewardClaimed === true;

      function renderRewardSettlement() {
        const settlement = state.lastRewardSettlement;
        if (!settlement) {
          state.rewardSettlementOpen = false;
          content.innerHTML = "";
          return;
        }
        const claimed = Boolean(
          settlement.doubleClaimed || state.adClaims[settlement.id],
        );
        const rewards = Array.isArray(settlement.rewards)
          ? settlement.rewards
          : [];
        const rewardMarkup = rewards.map((reward) => {
          const label = reward.label || reward.name || reward.key || "奖励";
          const count = Number(reward.count || 0);
          const quality = reward.slot
            ? EQUIPMENT_QUALITIES[reward.quality || "white"] || EQUIPMENT_QUALITIES.white
            : null;
          const detail = reward.slot
            ? getItemStatText(reward) || "基础属性"
            : "";

            <div class="settlement-reward ${quality ? "is-equipment" : ""}" ${quality ? `style="--quality-color:${quality.color}"` : ""}>
              <div class="settlement-reward-copy">
                <strong ${quality ? `style="color:${quality.color}"` : ""}>${escapeHtml(label)}</strong>
                ${detail ? `<small>${escapeHtml(detail)}</small>` : ""}
              </div>
              <span>${count > 0 ? "+" : ""}${count}</span>
            </div>
          `;

        const adLabel = claimed
          ? "加成已领取"

                typeof window.LampsPlatform.showRewardedVideo === "function"
              ? "广告准备完成；完整观看后发放加成。"
              : "广告尚未准备完成，请稍后重试。";

            <div class="eyebrow">${settlement.category === "pve" ? "探索挑战 · 掉落确认" : settlement.category === "tower" ? "爬塔通关 · 掉落确认" : "章节完成 · 奖励确认"}</div>

      function completeMainChapter() {

          state.stones += 30;

            state.cultivationNeed,
            state.cultivation + 18,
          );
          state.favor += 1;
          state.unlocked.market = true;
          const rewards = [
            {
              id: "token",
              name: "外院灰牌",
              desc: "交易小集已开放；灰牌可作为宗门身份凭证。",

              count: 1,

              icon: "item_old_iron_sword.png",

              baseStats: EQUIPMENT_CATALOG.sword.baseStats,

            },
            {

        state.storyActive = false;
        if (state.rewardSettlementOpen) {
          render();
          return;
        }
        showToast("西廊的登记簿合上了，交易小集亮起一盏灯");
        render();

      function addReward(item) {
        const catalog = EQUIPMENT_CATALOG[item.id] || {};
        const normalized = {
          ...item,
          slot: item.slot || catalog.slot || null,
          equipped: item.equipped === true,
          baseStats: item.baseStats || catalog.baseStats || {},
          affixes: Array.isArray(item.affixes) ? item.affixes.map(normalizeAffix) : [],
          artPath: item.artPath || EQUIPMENT_ART_PATHS[item.slot || catalog.slot] || "",
          slotFocus: item.slotFocus || EQUIPMENT_SLOT_META[item.slot || catalog.slot]?.focus || "",
        };
        const existing = state.inventory.find((entry) => entry.id === normalized.id);
        if (existing) {
          existing.count += normalized.count;
        } else {
          state.inventory.push(normalized);
        }
        if (!state.newItemIds.includes(normalized.id)) {
          state.newItemIds.push(normalized.id);
        }
      }

      function getInventoryItem(itemId) {
        return state.inventory.find((item) => item.id === itemId) || null;
      }

      function getEquipmentStats() {
        const totals = {
          attack: 0,
          defense: 0,
          insight: 0,
          spirit: 0,
          maxHp: 0,
          recovery: 0,
        };
        Object.keys(EQUIPMENT_SLOTS).forEach((slot) => {
          const item = getInventoryItem(state.equipment[slot]);
          if (!item) return;
          const itemStats = getItemStatValues(item);
          Object.keys(totals).forEach((key) => {
            totals[key] += Number(itemStats[key] || 0);
          });
        });
        return totals;
      }

      function renderEquipmentSummary(stats = getEquipmentStats()) {
        const summary = [
          ["攻击", stats.attack],
          ["防御", stats.defense],
          ["洞察", stats.insight],
          ["灵力", stats.spirit],
          ["回气", stats.recovery],
          ["气血", stats.maxHp],
        ];
        return summary.map(([label, value]) => `
          <div class="equipment-summary-cell">
            <span>${label}</span>
            <strong>+${Number(value || 0)}</strong>
          </div>
        `).join("");
      }

      function getCombatStats() {
        const equipment = getEquipmentStats();
        return {
          ...equipment,
          maxHp: Math.max(1, state.stats.hp + equipment.maxHp),
          attack: 6 + getPreviewRealmRank() * 2 + Math.floor(state.stats.body * .55) + equipment.attack,
          insight: state.stats.insight + equipment.insight,
          spirit: state.energy + equipment.spirit,
          defense: Math.floor(state.stats.body / 4) + equipment.defense,
          maxMana: Math.max(
            8,
            8 + Math.floor(state.stats.control * .6) + Math.max(0, equipment.spirit),
          ),
          manaRecovery: Math.max(
            3,
            4 + Math.max(0, equipment.recovery) + Math.floor(Math.max(0, state.stats.insight) / 12),
          ),
        };
      }

      function getBattleCombatStats() {
        const combat = getCombatStats();
        const support = getCompanionBattleBonuses();
        return {
          ...combat,
          maxHp: combat.maxHp + support.maxHp,
          attack: combat.attack + support.attack,
          defense: combat.defense + support.defense,
          insight: combat.insight + support.insight,
          maxMana: combat.maxMana + support.maxMana,
          manaRecovery: combat.manaRecovery + support.manaRecovery,
        };
      }

      function getCharacterDimensions() {
        const equipmentStats = getEquipmentStats();
        const combatStats = getCombatStats();
        return [
          { label: "攻击", value: combatStats.attack },
          { label: "灵力上限", value: state.stats.control + equipmentStats.spirit },
          { label: "防御", value: combatStats.defense },
          { label: "心境", value: Math.max(1, 10 + state.favor - state.suspicion) },
          { label: "洞察", value: combatStats.insight },
          { label: "气运", value: Math.round(state.candidate.rate * 50) },
        ];
      }

      function isNearRegionLocation(locationId, threshold = 5) {
        const location = getRegionLocations()[locationId];
        if (!location) return false;
        return Math.hypot(location.x - state.playerX, location.y - state.playerY) <= threshold;
      }

      function getPveChallengeForLocation(regionId, locationId) {
        return Object.values(PVE_CHALLENGES).find((challenge) =>
          challenge.regionId === regionId
          && challenge.locationId === locationId,
        ) || null;
      }

      function isPveChallengeUnlocked(challenge) {
        return Boolean(challenge && (state.devAllMaps || challenge.unlocked()));
      }

      function isPveChallengeNear(challenge, threshold = 5) {
        if (!challenge || state.regionId !== challenge.regionId) return false;
        return challenge.regionId === "outer"
          ? isNearLocation(challenge.locationId, threshold)
          : isNearRegionLocation(challenge.locationId, threshold);
      }

      function getNearbyPveChallenge() {
        return getNearbyPveChallenges()[0] || null;
      }

      function getNearbyPveChallenges() {
        return Object.values(PVE_CHALLENGES).filter((challenge) =>
          isPveChallengeUnlocked(challenge) && isPveChallengeNear(challenge),
        );
      }

      function getActiveBattleChallenge() {
        return state.battleMode === "pve"
          ? PVE_CHALLENGES[state.pveChallengeId] || null
          : null;
      }

      function getActiveTowerFloor() {
        if (state.battleMode !== "tower") return null;
        return TOWER_FLOORS.find((floor) =>
          floor.id === state.towerBattleId || floor.id === state.battleNodeId,
        ) || null;
      }

      function getTowerBattleConfig(floor) {
        const battle = floor?.battle;
        if (!battle) return null;
        const difficulty = getTowerDifficulty(floor);
        return {
          ...battle,
          maxHp: Math.max(1, Math.round(battle.maxHp * difficulty.hp)),
          attack: Math.max(1, Math.round(battle.attack * difficulty.attack)),
          defense: Math.max(0, Math.round(battle.defense * difficulty.defense)),
          towerDifficulty: difficulty,
        };
      }

      function getActiveBattleConfig() {
        const config = getTowerBattleConfig(getActiveTowerFloor())
          || getActiveBattleChallenge()?.battle
          || BATTLE_DEFINITIONS[state.battleNodeId]
          || null;
        return getAdaptiveBattleConfig(config, state.battleMode);
      }

      function rollChallengeQuality(weights) {
        const roll = Math.random();
        let cursor = 0;
        for (const [quality, chance] of weights || []) {
          cursor += chance;
          if (roll < cursor) return quality;
        }
        return weights?.[weights.length - 1]?.[0] || "white";
      }

          { name: "药圃护衣", bonus: { maxHp: 3 }, artPath: `${EQUIPMENT_ART_ROOT}equip_clothing_garden_guard.png` },
          { name: "档案守身衣", bonus: { defense: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_clothing_archive_guard.png` },

        ],
        head: [
          { name: "无字云冠", bonus: { insight: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_head_nameless_crown.png` },
          { name: "档案遮面", bonus: { defense: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_head_archive_paper_crown.png` },
          { name: "六灯玄冠", bonus: { spirit: 1, maxHp: 2 }, artPath: `${EQUIPMENT_ART_ROOT}equip_head_lamp_circlet.png` },
        ],
        ring: [
          { name: "药圃青玉戒", bonus: { recovery: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_ring_herb_jade.png` },
          { name: "铜屑回环", bonus: { spirit: 2 }, artPath: `${EQUIPMENT_ART_ROOT}equip_ring_copper_loop.png` },
          { name: "六灯定魄环", bonus: { insight: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_ring_six_lamp_seal.png` },
        ],
        boots: [
          { name: "湿痕行履", bonus: { recovery: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_boots_rain_step.png` },
          { name: "纸灰踏履", bonus: { insight: 1 }, artPath: `${EQUIPMENT_ART_ROOT}equip_boots_paper_ash.png` },
          { name: "山门定步靴", bonus: { defense: 1, maxHp: 2 }, artPath: `${EQUIPMENT_ART_ROOT}equip_boots_sect_gate.png` },
        ],
      };

      function createChallengeEquipment(challenge) {
        const slot = pick(challenge.dropSlots);
        const qualityId = rollChallengeQuality(challenge.qualityWeights);
        const quality = EQUIPMENT_QUALITIES[qualityId] || EQUIPMENT_QUALITIES.white;
        const baseStats = challenge.baseStats[slot] || {};
        const baseRoll = 0.88 + Math.random() * 0.24;
        const scaledStats = Object.fromEntries(
          Object.entries(baseStats).map(([key, value]) => [
            key,
            Number(value || 0) > 0
              ? Math.max(1, Math.round(Number(value) * quality.multiplier * baseRoll))
              : 0,
          ]),
        );
        const variant = pick(EQUIPMENT_DROP_VARIANTS[slot] || [{ name: "试炼装备", bonus: {} }]);
        Object.entries(variant.bonus || {}).forEach(([key, value]) => {
          scaledStats[key] = Math.max(
            0,
            Math.round(Number(scaledStats[key] || 0) + Number(value || 0) * quality.multiplier),
          );
        });
        const affixCount = Math.min(
          quality.maxAffixes,
          Math.max(1, qualityId === "white" ? 1 : qualityId === "green" ? 1 : 2),
        );
        const eligibleAffixes = FORGE_AFFIX_POOL.filter((affix) =>
          isAffixCompatible(affix, slot),
        );
        const affixes = [];
        while (affixes.length < affixCount && eligibleAffixes.length) {
          const pool = eligibleAffixes.filter((affix) =>
            !affixes.some((entry) => entry.id === affix.id),
          );
          if (!pool.length) break;
          const affix = pick(pool);
          const valueTier = rollForgeValueTier();
          const percent = randomForgeValue(affix, quality, valueTier);
          affixes.push({
            id: affix.id,
            label: affix.label,
            stat: affix.stat,
            percent,
            category: affix.category,
            valueTier,
          });
        }
        const slotName = EQUIPMENT_SLOTS[slot] || "装备";
        const artPath = variant.artPath || EQUIPMENT_ART_PATHS[slot] || "";
        return {
          id: `challenge_${challenge.id}_${Date.now()}_${Math.floor(Math.random() * 100000)}`,
          name: `${variant.name} · ${quality.name}`,
          desc: `${challenge.title}留下的${slotName}，可在角色栏装备并直接改变战斗属性。`,
          icon: artPath,
          artPath,
          slotFocus: EQUIPMENT_SLOT_META[slot]?.focus || "",
          slot,
          quality: qualityId,
          equipped: false,
          baseStats: scaledStats,
          baseRoll: Number(baseRoll.toFixed(2)),
          affixes,
          count: 1,
        };
      }

      function startPveChallenge(challengeId) {
        const challenge = PVE_CHALLENGES[challengeId];
        if (!challenge || !isPveChallengeUnlocked(challenge)) {
          showToast("挑战点未开放");
          return;
        }
        applyPassiveEnergyRegen();
        if (!isPveChallengeNear(challenge)) {
          showToast("请抵达挑战地点后进入");
          return;
        }
        if (state.battleActive || state.storyActive || state.rewardSettlementOpen) return;
        if (state.energy < challenge.cost) {
          showToast(`灵力不足，挑战需要 ${challenge.cost} 点灵力`);
          return;
        }
        state.energy -= challenge.cost;
        startBattle(challenge.id, "pve", challenge.id);
      }

      function completePveChallenge() {
        const challenge = getActiveBattleChallenge();
        if (!challenge) return;
        const equipment = createChallengeEquipment(challenge);
        const material = { ...challenge.material };
        const clearCount = Number(state.challengeClears[challenge.id] || 0) + 1;
        state.challengeClears[challenge.id] = clearCount;
        state.stones += challenge.stones;
        addReward(equipment);
        addReward(material);
        openRewardSettlement(
          `挑战结算 · ${challenge.title}`,
          `挑战完成 ${clearCount} 次；掉落已存入背包，可在角色栏装备或进入淬炼台处理。`,
          [
            { kind: "resource", key: "stones", label: "灵石", count: challenge.stones },
            { kind: "item", ...equipment, label: `${equipment.name} · ${EQUIPMENT_QUALITIES[equipment.quality].label}品` },
            { kind: "item", ...material, label: material.name },
          ],
          "pve",
        );
        state.battleNodeId = "";
        state.battleMode = "story";
        state.pveChallengeId = "";
        state.battleResult = "";
        state.battleLog = [];
        persistPreviewState();
        render();
      }

      function isTowerUnlocked() {
        return Boolean(state.devAllMaps || isTaskCompleted("main_chapter2"));
      }

      function getTowerFloor(floorId) {
        return TOWER_FLOORS.find((floor) => floor.id === floorId) || null;
      }

      function getTowerRewardBundle(floor) {
        if (!floor) {
          return {
            stones: 0,
            rewardEnergy: 0,
            material: null,
          };
        }
        return {
          stones: Math.max(0, Number(getTowerDifficulty(floor).stones || floor.stones || 0)),
          rewardEnergy: Math.max(0, Number(getTowerDifficulty(floor).energy || floor.rewardEnergy || 0)),
          material: floor.material
            ? {
              ...floor.material,
              count: Math.max(
                1,
                Number(getTowerDifficulty(floor).materialCount || floor.material.count || 1),
              ),
            }
            : null,
        };
      }

      function startTowerBattle(floorId) {
        if (!isTowerUnlocked()) {
          showToast("完成第二章后开放登塔");
          return;
        }
        applyPassiveEnergyRegen();
        const floor = getTowerFloor(floorId);
        if (!floor) return;
        if (state.battleActive || state.storyActive || state.rewardSettlementOpen) return;
        if (state.activeAdventureId) {
          showToast("当前奇遇未完成");
          return;
        }
        if (floor.floor !== state.towerCurrentFloor) {
          showToast(
            floor.floor < state.towerCurrentFloor
              ? "该层已通关，塔层不重复挑战；装备请前往地图 PVE 挑战点"
              : `前置楼层未完成：第 ${state.towerCurrentFloor} 层`,
          );
          return;
        }
        const cost = Math.max(1, floor.cost - Math.min(3, state.towerBlessing));
        if (state.energy < cost) {
          showToast(`灵力不足，本层需要 ${cost} 点灵力`);
          return;
        }
        state.energy -= cost;
        state.tab = "tower";
        state.towerBattleId = floor.id;
        startBattle(floor.id, "tower", floor.id);
      }

      function completeTowerFloor() {
        const floor = getActiveTowerFloor();
        if (!floor) return;
        if (floor.floor <= state.towerBestFloor || floor.floor !== state.towerCurrentFloor) {
          state.battleActive = false;
          state.storyActive = false;
          state.battleNodeId = "";
          state.battleMode = "story";
          state.towerBattleId = "";
          state.battleResult = "";
          state.battleLog = [];
          state.towerMessage = `第 ${floor.floor} 层已完成；奖励不可重复领取，装备请前往地图 PVE 挑战点。`;
          persistPreviewState();
          render();
          showToast("该层已通关，不可重复领取奖励");
          return;
        }
        const rewardBundle = getTowerRewardBundle(floor);
        const equipment = floor.equipmentReward ? createChallengeEquipment(floor) : null;
        const material = rewardBundle.material ? { ...rewardBundle.material } : null;
        state.towerBestFloor = Math.max(state.towerBestFloor, floor.floor);
        state.towerCurrentFloor = Math.min(TOWER_FLOORS.length + 1, floor.floor + 1);
        state.stones += rewardBundle.stones;
        state.energy = Math.max(0, state.energy + rewardBundle.rewardEnergy);
        applyPassiveEnergyRegen();
        if (equipment) addReward(equipment);
        if (material) addReward(material);
        state.battleActive = false;
        state.storyActive = false;
        state.battleNodeId = "";
        state.battleMode = "story";
        state.pveChallengeId = "";
        state.towerBattleId = "";
        state.battleMana = 0;
        state.battleResult = "";
        state.battleLog = [];
        state.battleGuard = false;
        state.battleGuardRounds = 0;
        state.battleEnemyGuardRounds = 0;
        state.battleGuardStreak = 0;
        state.towerMessage = `第 ${floor.floor} 层首通完成：灵石 +${rewardBundle.stones}，灵力回流 +${rewardBundle.rewardEnergy}${equipment ? `，获得${equipment.name}` : "，本层奖励为资源与记录"}。`;
        if (floor.adventureId && !state.adventureHistory.some((entry) => entry.eventId === floor.adventureId)) {
          state.activeAdventureId = floor.adventureId;
        }
        addBattleLog(`登塔完成：第 ${floor.floor} 层奖励已领取。`);
        state.tab = "tower";
        openRewardSettlement(
          `爬塔结算 · 第 ${floor.floor} 层`,
          `你已完成第 ${floor.floor} 层首通；塔层不会重复开放，确认后可继续挑战下一层。装备刷取请前往地图 PVE 挑战点。`,
          [
            { kind: "resource", key: "stones", label: "灵石", count: rewardBundle.stones },
            { kind: "resource", key: "energy", label: "灵力", count: rewardBundle.rewardEnergy },
            ...(equipment
              ? [{ kind: "item", ...equipment, label: `${equipment.name} · ${EQUIPMENT_QUALITIES[equipment.quality].label}品` }]
              : []),
            ...(material ? [{ kind: "item", ...material, label: material.name }] : []),
          ],
          "tower",
          "tower",
        );
        persistPreviewState();
        render();
      }

      function resolveAdventureChoice(eventId, optionId) {
        const event = ADVENTURE_EVENTS[eventId];
        const option = event?.options?.find((entry) => entry.id === optionId);
        if (!event || !option || state.activeAdventureId !== eventId) return;
        if (state.adventureHistory.some((entry) => entry.eventId === eventId)) {
          state.activeAdventureId = "";
          render();
          return;
        }
        const effects = option.effects || {};
        if (Number(effects.stones)) {
          state.stones = Math.max(0, state.stones + Number(effects.stones));
        }
        if (Number(effects.energy)) {
          state.energy = Math.max(0, state.energy + Number(effects.energy));
        }
        if (Number(effects.favor)) {
          state.favor = Math.max(0, state.favor + Number(effects.favor));
        }
        if (Number(effects.insight)) {
          state.stats.insight += Number(effects.insight);
        }
        if (Number(effects.towerBlessing)) {
          state.towerBlessing = Math.max(
            0,
            Math.min(3, state.towerBlessing + Number(effects.towerBlessing)),
          );
        }
        if (effects.clue) addClue(effects.clue);
        if (effects.reward) addReward(effects.reward);
        state.adventureHistory = [
          ...state.adventureHistory.slice(-29),
          {
            eventId,
            optionId,
            title: event.title,
            at: Date.now(),
          },
        ];
        state.activeAdventureId = "";
        state.towerMessage = option.result;
        persistPreviewState();
        render();
        showToast("奇遇选择已记录", "confirm");
      }

      function getMarketProduct(stallId, mode, productId) {
        const resolvedStallId = resolveMarketStallId(stallId);
        const market = MARKET_PRODUCTS[resolvedStallId];
        if (!market || !["buys", "sells"].includes(mode)) return null;
        return market[mode].find((product) => product.id === productId) || null;
      }

      function resolveMarketStallId(stallId) {
        if (MARKET_PRODUCTS[stallId]) return stallId;
        const location = getRegionLocations("market")[stallId];
        return location && MARKET_PRODUCTS[location.id] ? location.id : "";
      }

      function getMarketProductIcon(productId, product) {
        return getInventoryItem(productId)?.icon
          || product?.icon
          || ITEM_ART_BY_ID[productId]
          || "";
      }

      function removeInventoryItemCount(itemId, count = 1) {
        const item = getInventoryItem(itemId);
        if (!item || Number(item.count || 0) < count || item.equipped) return false;
        item.count -= count;
        if (item.count <= 0) {
          state.inventory = state.inventory.filter((entry) => entry !== item);
          state.newItemIds = state.newItemIds.filter((id) => id !== itemId);
        }
        return true;
      }

      function openMarketInteraction(stallId) {
        const resolvedStallId = resolveMarketStallId(stallId);
        const market = MARKET_PRODUCTS[resolvedStallId];
        if (state.regionId !== "market") {
          showToast("请进入交易小集后操作");
          return;
        }
        if (!REGION_DATA.market.unlocked()) {
          showToast("交易小集未开放：需完成灰牌登记");
          return;
        }
        if (!market) {
          showToast("当前摊位未开放，请更换地点");
          return;
        }
        if (!isNearRegionLocation(resolvedStallId)) {
          showToast("请靠近摊位后操作");
          return;
        }
        state.marketModal = resolvedStallId;
        render();
      }

      function buyMarketProduct(stallId, productId) {
        const resolvedStallId = resolveMarketStallId(stallId);
        const product = getMarketProduct(stallId, "buys", productId);
        if (!product) return;
        if (state.regionId !== "market" || !isNearRegionLocation(resolvedStallId)) {
          state.marketModal = "";
          render();
          showToast("已离开当前摊位");
          return;
        }
        if (state.stones < product.price) {
          showToast("灵石不足");
          return;
        }
        state.stones -= product.price;
        addReward({
          id: product.id,
          name: product.name,
          desc: product.desc || "从坊市购入的物品。",
          icon: product.icon || getMarketProductIcon(product.id, product),
          useType: product.useType,
          useAmount: product.useAmount,
          count: product.count || 1,
        });
        persistPreviewState();
        render();
        showToast(`已买入：${product.name}`, "confirm");
      }

      function sellMarketProduct(stallId, productId) {
        const resolvedStallId = resolveMarketStallId(stallId);
        const product = getMarketProduct(stallId, "sells", productId);
        if (!product) return;
        if (state.regionId !== "market" || !isNearRegionLocation(resolvedStallId)) {
          state.marketModal = "";
          render();
          showToast("已离开当前摊位");
          return;
        }
        if (!removeInventoryItemCount(product.id)) {
          showToast(`库存不足：${product.name}`);
          return;
        }
        state.stones += product.price;
        persistPreviewState();
        render();
        showToast(`已出售：${product.name} · 灵石 +${product.price}`, "confirm");
      }

      function renderMarketProduct(product, mode, stallId) {
        const owned = Number(getInventoryItem(product.id)?.count || 0);
        const isBuy = mode === "buys";
        const disabled = isBuy ? state.stones < product.price : owned < 1;
        const secondary = isBuy
          ? product.desc || "坊市现货"
          : `库存 ${owned} · 出售后获得灵石`;
        const price = isBuy ? `灵石 ${product.price}` : `+${product.price} 灵石`;
        return `
          <div class="market-product">
            <img src="${assetUrl(getMarketProductIcon(product.id, product))}" alt="">
            <div class="market-product-copy">
              <strong>${escapeHtml(product.name)}</strong>
              <span>${escapeHtml(secondary)}</span>
            </div>
            <div class="market-product-action">
              <span class="market-product-price">${price}</span>
              <button class="small-button" type="button" data-market-${isBuy ? "buy" : "sell"}="${escapeHtml(stallId)}" data-market-product="${escapeHtml(product.id)}" ${disabled ? "disabled" : ""}>${isBuy ? "买入" : "出售"}</button>
            </div>
          </div>
        `;
      }

      function renderMarketModal() {
        const resolvedStallId = resolveMarketStallId(state.marketModal);
        const market = MARKET_PRODUCTS[resolvedStallId];
        if (!market) return "";
        const buys = market.buys.length
          ? market.buys.map((product) => renderMarketProduct(product, "buys", resolvedStallId)).join("")
          : `<div class="market-empty">当前无可购买物品。</div>`;
        const sells = market.sells.length
          ? market.sells.map((product) => renderMarketProduct(product, "sells", resolvedStallId)).join("")
          : `<div class="market-empty">当前无可出售物品。</div>`;
        const forgeUnlocked = isTaskCompleted("main_chapter2") || state.devAllMaps;
        const equipmentSaleMarkup = ["forge", "square"].includes(resolvedStallId) && forgeUnlocked
          ? `
            <section class="market-trade-section" aria-label="装备回收">
              <div class="market-trade-heading"><strong>装备回收</strong><span>按品质与词条估价；普通装备低价回收</span></div>
              <div class="equipment-sale-list">${renderEquipmentSaleList()}</div>
            </section>
          `
          : "";
        return `
          <div class="modal-overlay" role="presentation">
            <section class="modal-card market-modal-card" role="dialog" aria-modal="true" aria-labelledby="marketTitle">
              <div class="modal-kicker">${escapeHtml(market.kicker)}</div>
              <div class="modal-title" id="marketTitle">${escapeHtml(market.title)}</div>
              <p class="modal-copy">${escapeHtml(market.description)}</p>
              <div class="market-balance"><span>身上灵石</span><strong>${state.stones}</strong></div>
              <section class="market-trade-section" aria-label="可买入物品">
                <div class="market-trade-heading"><strong>买入</strong><span>确认后立即入库</span></div>
                <div class="market-product-list">${buys}</div>
              </section>
              <section class="market-trade-section" aria-label="可出售物品">
                <div class="market-trade-heading"><strong>出售</strong><span>仅显示有库存物品</span></div>
                <div class="market-product-list">${sells}</div>
              </section>
              ${equipmentSaleMarkup}
              ${market.forgeAction ? `
                <div class="market-trade-section">
                  <button class="small-button" type="button" data-market-forge ${forgeUnlocked ? "" : "disabled"}>${forgeUnlocked ? "进入淬炼台" : "第二章后开放淬炼台"}</button>
                </div>
              ` : ""}
              <div class="modal-actions">
                <button class="small-button" type="button" data-market-close>关闭</button>
              </div>
            </section>
          </div>
        `;
      }

      function openEquipmentPicker(slot) {
        if (!EQUIPMENT_SLOTS[slot]) return;
        state.detailModal = null;
        state.equipmentPickerSlot = slot;
        render();
      }

      function renderEquipmentPickerModal() {
        const slot = state.equipmentPickerSlot;
        const label = EQUIPMENT_SLOTS[slot];
        if (!label) return "";
        const slotMeta = EQUIPMENT_SLOT_META[slot] || {};

        const equippedItem = getInventoryItem(state.equipment[slot]);
        const availableEquipment = state.inventory.filter((item) =>
          item.slot === slot && !item.equipped && item.id !== equippedItem?.id,
        );
        const currentQuality = equippedItem
          ? EQUIPMENT_QUALITIES[equippedItem.quality || "white"] || EQUIPMENT_QUALITIES.white
          : null;
        const currentAffixes = equippedItem
          ? (equippedItem.affixes || []).map(renderAffixChip).join("")
          : "";
        const currentMarkup = equippedItem
          ? `
            <div class="equipment-picker-current-item" style="--quality-color:${currentQuality.color}">
              ${renderEquipmentImage(equippedItem, "", equippedItem.name)}
              <div class="equipment-picker-item-copy">
                <strong>${escapeHtml(equippedItem.name)}</strong>
                <span>${escapeHtml(currentQuality.name)} · ${escapeHtml(getItemStatText(equippedItem) || "暂无属性")}</span>
                ${currentAffixes ? `<div class="equipment-picker-item-affixes">${currentAffixes}</div>` : ""}
              </div>
              <button class="small-button" type="button" data-equipment-picker-unequip="${escapeHtml(slot)}">卸下</button>
            </div>
          `
          : `<div class="equipment-picker-empty">当前${escapeHtml(label)}栏为空；选择装备后可装备。</div>`;
        const availableMarkup = availableEquipment.length
          ? availableEquipment.map((item) => {
            const quality = EQUIPMENT_QUALITIES[item.quality || "white"] || EQUIPMENT_QUALITIES.white;
            const affixes = (item.affixes || []).map(renderAffixChip).join("");
            return `
              <button class="equipment-picker-item" type="button" data-equipment-picker-equip="${escapeHtml(item.id)}" style="--quality-color:${quality.color}">
                ${renderEquipmentImage(item, "", item.name)}
                <span class="equipment-picker-item-copy">
                  <strong>${escapeHtml(item.name)}</strong>
                  <span>${escapeHtml(quality.name)} · ${escapeHtml(getItemStatText(item) || "暂无属性")}</span>
                  ${affixes ? `<span class="equipment-picker-item-affixes">${affixes}</span>` : ""}
                </span>
                <span class="equipment-picker-item-action">装备</span>
              </button>
            `;
          }).join("")
          : `<div class="equipment-picker-empty">暂无可装备的${escapeHtml(label)}。获得对应部位装备后显示。</div>`;

        return `
          <div class="modal-overlay" role="presentation">
            <section class="modal-card equipment-picker-card" role="dialog" aria-modal="true" aria-labelledby="equipmentPickerTitle">
              <div class="modal-kicker">角色装备 · 选择部位</div>
              <div class="modal-title" id="equipmentPickerTitle">选择${escapeHtml(label)}</div>
              <p class="modal-copy">当前部位侧重${escapeHtml(slotMeta.focus || "通用加成")}。只显示能装入${escapeHtml(label)}栏的物品，确认后会立即更新基础属性。</p>
              <section class="equipment-picker-current" aria-label="当前装备">
                <div class="equipment-picker-current-heading">
                  <strong>当前装备</strong>
                  <span>${equippedItem ? "可卸下或更换" : "未装备"}</span>
                </div>
                ${currentMarkup}
              </section>
              <section style="margin-top:12px" aria-label="可装备物品">
                <div class="equipment-picker-list-heading">
                  <strong>可装备的${escapeHtml(label)}</strong>
                  <span>${availableEquipment.length} 件</span>
                </div>
                <div class="equipment-picker-list">${availableMarkup}</div>
              </section>
              <div class="modal-actions">
                <button class="small-button" type="button" data-equipment-picker-close>返回角色</button>
              </div>
            </section>
          </div>
        `;
      }

      function equipItem(itemId) {
        const item = getInventoryItem(itemId);
        if (!item?.slot || !EQUIPMENT_SLOTS[item.slot]) {
          showToast("当前物品不可装备");
          return;
        }
        const oldItemId = state.equipment[item.slot];
        const oldItem = getInventoryItem(oldItemId);
        if (oldItem) oldItem.equipped = false;
        state.equipment[item.slot] = item.id;
        item.equipped = true;
        persistPreviewState();
        showToast("已装备：" + item.name);
        render();
      }

      function unequipItem(slot) {
        const itemId = state.equipment[slot];
        const item = getInventoryItem(itemId);
        if (item) item.equipped = false;
        state.equipment[slot] = null;
        persistPreviewState();
        showToast("已卸下：" + EQUIPMENT_SLOTS[slot]);
        render();
      }

      function openForge(itemId = "") {
        if (!state.completed.chapter2 && !state.devAllMaps) {
          showToast("完成第二章后开放淬炼台");
          return;
        }
        clearForgeAnimationTimers();
        const first = state.inventory.find((item) => item.slot);
        state.forgeSelectedId = itemId || state.forgeSelectedId || first?.id || "";
        state.forgeOpen = true;
        state.forgePhase = "idle";
        state.forgeResult = null;
        const affixCount = Number(state.inventory.find((entry) => entry.id === state.forgeSelectedId)?.affixes?.length || 0);
        state.forgeReplaceIndex = affixCount > 0
          ? Math.min(state.forgeReplaceIndex, affixCount - 1)
          : 0;
        render();
      }

      function forgeItem(itemId) {
        openForge(itemId);
      }

      function getForgeMeltMaterialCount(item) {
        const materialByQuality = {
          white: 1,
          green: 1,
          blue: 2,
          purple: 3,
          gold: 4,
          red: 5,
        };
        return materialByQuality[item?.quality] || 1;
      }

      function requestMeltEquipment(itemId) {
        const item = getInventoryItem(itemId);
        if (!item?.slot) {
          showToast("请选择一件装备");
          return;
        }
        if (item.equipped) {
          showToast("已装备物品不可融化：请先卸下");
          return;
        }
        if (state.forgePhase !== "idle" && state.forgePhase !== "settled") {
          showToast("淬炼正在进行，请等待结果保存");
          return;
        }
        state.forgeMeltConfirmId = item.id;
        render();
      }

      function meltEquipment(itemId) {
        const item = getInventoryItem(itemId);
        if (!item?.slot) {
          state.forgeMeltConfirmId = "";
          render();
          return;
        }
        if (item.equipped) {
          state.forgeMeltConfirmId = "";
          render();
          showToast("已装备物品不可融化：请先卸下");
          return;
        }
        const materialCount = getForgeMeltMaterialCount(item);
        if (!removeInventoryItemCount(item.id)) {
          state.forgeMeltConfirmId = "";
          render();
          showToast("装备不存在于背包");
          return;
        }
        addReward({
          id: "tempering_sand",
          name: "淬炼砂",
          desc: "融化装备后留下的细砂，可用于淬炼。",
          icon: COMMON_ITEM_ART.lamp_copper_shard,
          count: materialCount,
        });
        if (state.forgeSelectedId === item.id) {
          state.forgeSelectedId = state.inventory.find((entry) => entry.slot && !entry.equipped)?.id
            || state.inventory.find((entry) => entry.slot)?.id
            || "";
        }
        state.forgeMeltConfirmId = "";
        state.forgeResult = null;
        state.forgePhase = "idle";
        persistPreviewState();
        render();
        showToast(`已融化：${item.name}；获得淬炼砂 ×${materialCount}`, "confirm");
      }

      function clearForgeAnimationTimers() {
        forgeAnimationTimers.forEach((timer) => {
          window.clearTimeout(timer);
          window.clearInterval(timer);
        });
        forgeAnimationTimers = [];
      }

      function applyForgeResult(accept) {
        const result = state.forgeResult;
        const item = getInventoryItem(result?.itemId);
        if (
          !result
          || !item
          || state.forgePhase !== "settled"
          || result.saved
        ) {
          return;
        }
        const affixes = [...(item.affixes || [])];
        const replaceIndex = Number(result.replaceIndex);
        if (
          accept
          && replaceIndex >= 0
          && replaceIndex < affixes.length
          && result.affix
        ) {
          affixes.splice(replaceIndex, 1, result.affix);
          item.affixes = affixes;
          result.afterValues = result.candidateValues;
          result.accepted = true;
          state.stats.insight += 1;
        } else {
          result.afterValues = result.beforeValues;
          result.accepted = false;
        }
        result.saved = true;
        persistPreviewState();
        render();
        showToast(accept ? "已替换原词条" : "已保留原词条", "confirm");
      }

      function rollForgeValueTier() {
        const roll = Math.random();
        if (roll < .03) return "gold";
        if (roll < .20) return "purple";
        if (roll < .58) return "blue";
        return "green";
      }

      function randomForgeValue(affix, quality, valueTier) {
        const ranges = {
          green: [.32, .56],
          blue: [.56, .76],
          purple: [.76, .93],
          gold: [.93, 1],
        };
        const [minRatio, maxRatio] = ranges[valueTier] || ranges.green;
        const ratio = minRatio + Math.random() * (maxRatio - minRatio);
        const base = affix.min + Math.round((affix.max - affix.min) * ratio);
        return Math.max(1, Math.round(base * quality.multiplier));
      }

      function claimForgeMaterialSupply() {
        if (state.adBusy) {
          showToast("广告准备中，请稍候", "loading");
          return;
        }
        if (
          (state.forgePhase !== "idle" && state.forgePhase !== "settled")
          || (state.forgeResult && !state.forgeResult.saved)
        ) {
          showToast("完成当前淬炼后领取淬炼砂");
          return;
        }
        void AdService.showRewarded({
          placement: "forge_material_supply",
          onReward: () => {
            addReward({
              id: "tempering_sand",
              name: "淬炼砂",
              desc: "观看广告获得的淬炼材料，可用于装备淬炼。",
              icon: COMMON_ITEM_ART.lamp_copper_shard,
              count: FORGE_AD_REWARD_COUNT,
            });
            persistPreviewState();
            render();
          },
        });
      }

      function startForgeRoll() {
        const item = getInventoryItem(state.forgeSelectedId);
        if (!item?.slot) {
          showToast("请选择一件装备");
          return;
        }
        if (state.forgePhase !== "idle" && state.forgePhase !== "settled") {
          showToast("淬炼正在进行，请等待结果保存");
          return;
        }
        if (state.forgeResult?.itemId === item.id && !state.forgeResult.saved) {
          showToast("请选择替换或保留原词条");
          return;
        }
        const quality = EQUIPMENT_QUALITIES[item.quality || "white"] || EQUIPMENT_QUALITIES.white;
        const shard = getInventoryItem("lamp_copper_shard");
        const sand = getInventoryItem("tempering_sand");
        if ((!shard || shard.count < 1) && (!sand || sand.count < 1)) {
          showToast("缺少铜灯碎片或淬炼砂");
          return;
        }
        const compatibleAffixes = FORGE_AFFIX_POOL.filter((entry) =>
          isAffixCompatible(entry, item.slot),
        );
        if (!compatibleAffixes.length) {
          showToast("当前装备无可淬炼词条");
          return;
        }
        if (shard?.count > 0) shard.count -= 1;
        else sand.count -= 1;
        const affix = compatibleAffixes[Math.floor(Math.random() * compatibleAffixes.length)];
        const valueTier = rollForgeValueTier();
        const percent = randomForgeValue(affix, quality, valueTier);
        const rolled = {
          id: affix.id,
          label: affix.label,
          stat: affix.stat,
          percent,
          category: affix.category,
          valueTier,
        };
        const existingAffixes = [...(item.affixes || [])];
        const forgeMode = existingAffixes.length < quality.maxAffixes ? "append" : "replace";
        const replaceIndex = forgeMode === "replace" && existingAffixes.length
          ? clamp(
            Number(state.forgeReplaceIndex) || 0,
            0,
            existingAffixes.length - 1,
          )
          : -1;
        const candidateAffixes = replaceIndex >= 0
          ? existingAffixes.map((entry, index) => (
            index === replaceIndex ? rolled : entry
          ))
          : [...existingAffixes, rolled];
        const beforeValues = getItemStatValues(item);
        const candidateValues = getItemStatValues({
          ...item,
          affixes: candidateAffixes,
        });
        const afterValues = getItemStatValues({
          ...item,
          affixes: candidateAffixes,
        });
        state.forgeResult = {
          affix: rolled,
          quality: item.quality || "white",
          itemId: item.id,
          replaceIndex,
          mode: forgeMode,
          previousAffix: replaceIndex >= 0 ? existingAffixes[replaceIndex] : null,
          beforeCount: existingAffixes.length,
          beforeValues,
          candidateValues,
          afterValues,
          displayValue: 0,
          accepted: replaceIndex < 0,
          saved: false,
        };
        state.forgePhase = "immersing";
        clearForgeAnimationTimers();
        const revealTimer = window.setTimeout(() => {
          state.forgePhase = "reveal";
          render();
        }, 850);
        const countingTimer = window.setTimeout(() => {
          state.forgePhase = "counting";
          state.forgeResult.displayValue = 0;
          render();
          const countInterval = window.setInterval(() => {
            if (!state.forgeResult || state.forgeResult.itemId !== item.id) return;
            const targetValue = getAffixNumericValue(state.forgeResult.affix);
            const currentValue = Number(state.forgeResult.displayValue || 0);
            state.forgeResult.displayValue = Math.min(targetValue, currentValue + Math.max(1, Math.ceil(targetValue / 9)));
            render();
            if (state.forgeResult.displayValue >= targetValue) {
              window.clearInterval(countInterval);
            }
          }, 110);
          forgeAnimationTimers.push(countInterval);
        }, 1550);
        const settleTimer = window.setTimeout(() => {
          clearForgeAnimationTimers();
          if (!state.forgeResult || state.forgeResult.itemId !== item.id) return;
          if (!state.forgeResult.saved && replaceIndex < 0) {
            item.affixes = candidateAffixes;
            state.forgeResult.saved = true;
            state.forgeResult.accepted = true;
            state.forgeResult.displayValue = percent;
            state.stats.insight += 1;
          }
          state.forgePhase = "settled";
          persistPreviewState();
          render();
          const resultMode = state.forgeResult.mode
            || (Number(state.forgeResult.replaceIndex) >= 0 ? "replace" : "append");
          showToast(
            state.forgeResult.saved
              ? resultMode === "append"
                ? state.forgeResult.beforeCount > 0 ? "新词条已追加" : "首条词条已追加"
                : "新词条已揭示，请选择替换或保留"
              : "新词条已揭示，请选择替换或保留",
            "confirm",
          );
        }, 3100);
        forgeAnimationTimers = [revealTimer, countingTimer, settleTimer];
        persistPreviewState();
        render();
      }

      function renderForge() {
        const item = getInventoryItem(state.forgeSelectedId) || state.inventory.find((entry) => entry.slot);
        if (!item) {
          content.innerHTML = `<section class="page-shell"><div class="empty-state">暂无可淬炼装备</div></section>`;
          return;
        }
        const quality = EQUIPMENT_QUALITIES[item.quality || "white"] || EQUIPMENT_QUALITIES.white;
        const result = state.forgeResult?.itemId === item.id ? state.forgeResult : null;
        const awaitingDecision = Boolean(
          result
          && state.forgePhase === "settled"
          && !result.saved,
        );
        const canAddAffix = (item.affixes || []).length < quality.maxAffixes;
        const resultMode = result?.mode
          || (Number(result?.replaceIndex) >= 0 ? "replace" : "append");
        const meltMaterialCount = getForgeMeltMaterialCount(item);
        const phaseIndex = { idle: 0, immersing: 1, reveal: 2, counting: 3, settled: 4 }[state.forgePhase] || 0;
        const phaseMeta = {
          idle: ["淬炼台待命", "选择装备开始淬炼"],
          immersing: ["1/4 入池淬炼", "淬炼进行中"],
          reveal: ["2/4 新词条揭示", "新词条已出现"],
          counting: ["3/4 数值显现", "属性数值确认中"],
          settled: awaitingDecision
            ? ["4/4 选择结果", "新词条已生成，请选择是否替换原词条"]
            : ["4/4 结果已保存", "词条已写入装备"],
        }[state.forgePhase] || ["淬炼台待命", "选择装备开始淬炼"];
        const forgeAdDisabled = state.adBusy
          || (state.forgePhase !== "idle" && state.forgePhase !== "settled")
          || awaitingDecision;
        const stageMarkup = [
          ["入池", 1],
          ["揭示", 2],
          ["定格", 3],
          ["保存", 4],
        ].map(([label, index]) => `<span class="forge-stage ${phaseIndex >= index ? "is-complete" : ""} ${phaseIndex === index ? "is-current" : ""}"><b>${index}</b>${label}</span>`).join("");
        const affixRows = (item.affixes || []).map((affix, index) => `
          <button
            class="forge-existing-affix ${index === Number(state.forgeReplaceIndex) ? "selected" : ""}"
            type="button"
            data-forge-replace-index="${index}"
            ${canAddAffix || state.forgePhase !== "idle" && state.forgePhase !== "settled" || awaitingDecision ? "disabled" : ""}
          >
            <span>${renderAffixLabel(affix)}${!canAddAffix && index === Number(state.forgeReplaceIndex) ? " · 将替换" : ""}</span>
            <strong>${renderAffixValue(affix)}</strong>
          </button>
        `).join("");
        const itemButtons = state.inventory.filter((entry) => entry.slot).map((entry) => {
          const entryQuality = EQUIPMENT_QUALITIES[entry.quality || "white"] || EQUIPMENT_QUALITIES.white;
          return `<button class="forge-item-select ${entry.id === item.id ? "active" : ""}" type="button" data-forge-select="${escapeHtml(entry.id)}" data-no-scroll-drag ${state.forgePhase !== "idle" && state.forgePhase !== "settled" ? "disabled" : ""}><span class="quality-dot" style="--quality:${entryQuality.color}"></span><span>${escapeHtml(entry.name)}</span><small>${entryQuality.label}</small></button>`;
        }).join("");
        const statKey = result?.affix?.stat || "";
        const statLabels = { attack: "攻击", defense: "防御", insight: "洞察", spirit: "灵力", recovery: "回气", maxHp: "气血" };
        const statLabel = statLabels[statKey] || "属性";
        const targetValue = getAffixNumericValue(result?.affix);
        const displayValue = Number(result?.displayValue || 0);
        const resultMarkup = result && state.forgePhase !== "immersing"
          ? `<div class="forge-result ${state.forgePhase === "settled" ? "settled" : `is-${state.forgePhase}`}">
              <div><span class="forge-result-stage">${phaseMeta[0]}</span><span>新词条 · ${renderAffixLabel(result.affix)}</span></div>
              <strong class="forge-stat-roll ${state.forgePhase === "reveal" ? "" : `affix-value-${getAffixValueTier(result.affix)}`}">${state.forgePhase === "reveal" ? "待定" : renderAffixValue({ ...result.affix, percent: state.forgePhase === "counting" ? displayValue : targetValue })}</strong>
              <small>${
                state.forgePhase === "reveal"
                  ? "词条已生成；数值确认中"
                  : state.forgePhase === "counting"
                    ? "词条将按装备基础属性生效 · 数值确认中"
                    : result.saved
                      ? resultMode === "append"
                        ? result.beforeCount > 0 ? "新词条已追加" : "首条词条已追加"
                        : result.accepted
                          ? "原词条已替换"
                          : "已保留原词条"
                      : resultMode === "append"
                        ? "未达到品质上限；新词条将自动追加"
                        : `将替换：${result.previousAffix ? renderAffixLabel(result.previousAffix) : "原词条"}`
              }</small>
              ${state.forgePhase === "settled" ? `<span class="forge-result-delta">${statLabel} ${Number(result.beforeValues?.[statKey] || 0)} → ${Number((result.saved ? result.afterValues : result.candidateValues)?.[statKey] || 0)}</span>` : ""}
            </div>`
          : state.forgePhase === "immersing"
            ? `<div class="forge-pending">装备已投入淬炼池；等待新词条生成。</div>`
            : "";
        const decisionMarkup = awaitingDecision
          ? `
            <div class="forge-decision-actions forge-decision-actions-fixed" role="group" aria-label="词条结果选择">
              <button class="forge-decision-button accept" type="button" data-forge-accept>替换原词条</button>
              <button class="forge-decision-button reject" type="button" data-forge-reject>保留原词条</button>
            </div>
          `
          : "";
        content.innerHTML = `
          <section class="forge-screen" data-scroll-surface="forge">
            <button class="story-exit" type="button" data-forge-close aria-label="关闭淬炼台">返回背包</button>
            <div class="forge-kicker">装备 · 淬炼台</div>
            <h1 class="forge-title">装备词条淬炼</h1>
            <div class="forge-layout">
              <aside class="forge-item-list" data-scroll-drag-surface="forge-items">${itemButtons}</aside>
              <main class="forge-main phase-${escapeHtml(state.forgePhase)}">
                <div class="forge-stage-strip" aria-label="淬炼步骤">${stageMarkup}</div>
                <div class="forge-phase-copy"><strong>${phaseMeta[0]}</strong><span>${phaseMeta[1]}</span></div>
                <div class="forge-vessel">
                  <div class="forge-ripple"></div>
                  ${renderEquipmentImage(item, "forge-item-image", item.name)}
                  <span class="forge-quality" style="--quality:${quality.color}">${quality.label} · ${quality.name}</span>
                </div>
                <div class="forge-item-heading"><strong>${escapeHtml(item.name)}</strong><span>词条 ${(item.affixes || []).length}/${quality.maxAffixes}</span></div>
                <div class="forge-affix-list">${affixRows || `<span class="forge-empty">暂无词条</span>`}</div>
                ${resultMarkup}
                ${decisionMarkup}
                ${awaitingDecision ? "" : `<div class="forge-actions">
                  <div class="forge-primary-actions">
                    <button class="forge-start-button" type="button" data-forge-start ${state.forgePhase !== "idle" && state.forgePhase !== "settled" || awaitingDecision ? "disabled" : ""}>${awaitingDecision ? "等待选择" : state.forgePhase === "settled" ? "再次淬炼" : "开始淬炼"}</button>
                    <span class="forge-cost">淬炼消耗：铜灯碎片 / 淬炼砂 ×1</span>
                    <button class="forge-ad-supply-button" type="button" data-forge-ad-supply aria-label="观看广告领取三份淬炼砂" ${forgeAdDisabled ? "disabled" : ""}>${state.adBusy && state.adPlacement === "forge_material_supply" ? "广告加载中" : `观看广告领取淬炼砂 ×${FORGE_AD_REWARD_COUNT}`}</button>
                  </div>
                  <div class="forge-melt-actions">
                    <span class="forge-melt-return">融化返还：淬炼砂 ×${meltMaterialCount}</span>
                    <button class="forge-melt-button" type="button" data-forge-melt="${escapeHtml(item.id)}" ${item.equipped ? "disabled title=\"请先卸下装备\"" : ""}>融化</button>
                  </div>
                </div>`}
              </main>
            </div>
            <div class="forge-note">可重复淬炼装备。未达到品质上限时自动追加词条；达到上限后可选择替换或保留。装备基础属性与词条数值存在浮动。融化装备可回收淬炼砂。</div>
          </section>
        `;
      }

      function startBattle(nodeId, mode = "story", challengeId = "") {
        const baseConfig = mode === "pve"
          ? PVE_CHALLENGES[challengeId]?.battle
          : mode === "tower"
            ? getTowerBattleConfig(TOWER_FLOORS.find((floor) => floor.id === (challengeId || nodeId)))
            : BATTLE_DEFINITIONS[nodeId];
        if (!baseConfig) {
          showToast("战斗配置未就绪，请稍后重试");
          return;
        }
        const tutorialBattle = mode === "story" && nodeId === "battle_001";
        const showBattleBrief = tutorialBattle && !state.tutorialBattleBriefSeen;
        state.storyActive = mode === "story";
        state.battleActive = true;
        state.battleNodeId = nodeId;
        state.battleMode = mode;
        state.pveChallengeId = mode === "pve" ? challengeId : "";
        state.towerBattleId = mode === "tower" ? (challengeId || nodeId) : "";
        const config = getAdaptiveBattleConfig(baseConfig, mode);
        const combat = getBattleCombatStats();
        state.battleEnemyHp = config.maxHp;
        state.battlePlayerHp = combat.maxHp;
        state.battleMana = combat.maxMana;
        state.battleTurn = 1;
        state.battleIntent = "strike";
        state.battleFocus = 0;
        state.battleExposed = false;
        state.battleGuard = false;
        state.battleGuardRounds = 0;
        state.battleEnemyGuardRounds = 0;
        state.battleGuardStreak = 0;
        state.battleResult = "";
        state.battleFeedback = {
          kind: "success",
          label: "战斗开始",
          detail: tutorialBattle
            ? "蓄力纹亮起时使用护体；护阵状态下使用洞察。法力不足时使用回气。"
            : getBattleAdaptationLabel(config)
              ? `${getBattleAdaptationLabel(config)}。请先确认${config.weaknessLabel}，再选择行动。`
              : `请先确认${config.weaknessLabel}，再选择行动。`,
        };
        state.battleStatus = getBattleAdaptationLabel(config)
          ? `目标：${config.enemyName} · ${getBattleAdaptationLabel(config)}`
          : tutorialBattle
            ? `教学战：${config.enemyName} · 请根据行动提示操作`
            : `目标：${config.enemyName} · 弱点已确认`;
        state.battleReviveUsed = false;
        state.battleBriefOpen = showBattleBrief;
        if (showBattleBrief) state.tutorialBattleBriefSeen = true;
        state.battleLog = ["战斗开始：目标为 " + config.enemyName + "。"];

      function finishBattle(result) {
        state.battleResult = result;
        state.battleGuard = false;
        state.battleGuardRounds = 0;
        state.battleEnemyGuardRounds = 0;
        state.battleGuardStreak = 0;
        if (result === "win") {
          const config = getActiveBattleConfig();
          state.battleStatus = `战斗结束：${config?.enemyName || "敌人"}已被压制`;
          state.battleFeedback = {
            kind: "success",
            label: "胜利",
            detail: config?.victoryText || "战斗节点已完成。",
          };
          if (state.battleMode === "pve") {
            addBattleLog("挑战完成，正在结算掉落。");
            AudioService.play("confirm");
            completePveChallenge();
            return;
          }
          if (state.battleMode === "tower") {
            addBattleLog("本层挑战完成，正在结算奖励。");
            AudioService.play("confirm");
            completeTowerFloor();
            return;
          }
          state.energy = Math.max(0, state.energy - 2);
          addBattleLog("战斗胜利，消耗灵力 2 点。");
          AudioService.play("confirm");
        } else {
          state.battleStatus = "战斗失败：可重新挑战或观看广告复起";
          state.battleFeedback = {
            kind: "damage",
            label: "倒地",
            detail: state.battleReviveUsed
              ? "本场复起次数已用尽。"
              : "气血耗尽，战斗结束。",
          };
          addBattleLog("角色失去行动能力，可重新挑战。");
          AudioService.play("error");
        }
        persistPreviewState();
        render();
      }

      function claimBattleRevive() {
        if (
          !state.battleActive
          || state.battleResult !== "lose"
          || state.battleReviveUsed
        ) {
          return;
        }
        const combat = getBattleCombatStats();
        void AdService.showRewarded({
          placement: `battle_revive_${state.battleMode}_${state.battleNodeId || state.pveChallengeId}`,
          onReward: () => {
            if (state.battleReviveUsed) return;
            const restored = Math.max(1, Math.ceil(combat.maxHp * .45));
            state.battleReviveUsed = true;
            state.battleResult = "";
            state.battlePlayerHp = restored;
            state.battleGuard = false;
            state.battleGuardRounds = 0;
            state.battleEnemyGuardRounds = 0;
            state.battleGuardStreak = 0;
            state.battleTurn += 1;
            state.battleStatus = `广告复起：恢复 ${restored} 点气血`;
            state.battleFeedback = {
              kind: "reward",
              label: "复起",
              detail: "本场只可复起一次，继续观察弱点完成战斗。",
