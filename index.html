      function performBattleAction(actionId) {
        if (!state.battleActive || state.battleResult) return;
        state.battleBriefOpen = false;
        state.tutorialBattleBriefSeen = true;
        const config = getActiveBattleConfig();
        if (!config) return;
        const combat = getBattleCombatStats();
        const activeCompanionIds = getActiveCompanionIds();
        const intent = getBattleIntent(state.battleIntent);
        const tier = getBattleDifficultyTier();
        const phaseBefore = getBattlePhase(config);
        const enemyGuardActive = state.battleEnemyGuardRounds > 0 || intent.id === "guard";
        let playerText = "";
        let damage = 0;
        let feedback = null;
        let brokeEnemyGuard = false;
        let interruptedBreak = false;
        const tutorialBattle = state.battleMode === "story" && state.battleNodeId === "battle_001";

        if (actionId === "attack") {
          const baseDamage = Math.max(1, combat.attack - config.defense);
          const exposedBonus = state.battleExposed ? 6 + (tier >= 3 ? 2 : 0) : 0;
          const guardPenalty = enemyGuardActive
            ? Math.max(1, Math.ceil(baseDamage * .45))
            : 0;
          damage = Math.max(1, baseDamage + exposedBonus - guardPenalty);
          const usedExposure = state.battleExposed;
          state.battleExposed = false;
          state.battleGuardStreak = 0;
          playerText = `你以装备正面压制${config.enemyName}，造成 ${damage} 点伤害。`;
          feedback = {
            kind: "success",
            label: `造成 ${damage} 伤害`,
            detail: usedExposure
              ? "破绽已被抓住，进攻伤害得到放大。"
              : enemyGuardActive
                ? "敌方正在护阵，正面进攻的伤害被压低。"
                : "攻击命中敌方。",
          };
        } else if (actionId === "insight") {
          if (state.battleMana < 4) {
            showToast("法力不足，请使用回气。");
            return;
          }
          state.battleMana -= 4;
          damage = Math.max(1, Math.round((combat.insight * .75 + 8) * config.insightWeakness) - config.defense);
          state.battleGuardStreak = 0;
          if (enemyGuardActive) {
            damage += Math.max(2, Math.ceil(combat.insight * .18));
            state.battleEnemyGuardRounds = 0;
            brokeEnemyGuard = true;
          }
          if (intent.id === "break_guard") interruptedBreak = true;
          const focusGain = activeCompanionIds.has("guan_yan_qiu") ? 2 : 1;
          state.battleFocus += focusGain;
          if (state.battleFocus >= 2) {
            state.battleFocus = 0;
            state.battleExposed = true;
          }
          playerText = `你捕捉到${config.weaknessLabel}，洞察一击造成 ${damage} 点伤害。`;
          feedback = {
            kind: "success",
            label: `弱点命中 · ${damage} 伤害`,
            detail: [
              brokeEnemyGuard ? "洞察同时撕开了敌方护阵。" : "",
              interruptedBreak ? "破护蓄力被提前打断。" : "",
              focusGain > 1 ? "关砚秋拆解阵纹，破阵进度额外推进。" : "",
            ].filter(Boolean).join(" ") || "敌方状态出现变化。",
          };
        } else if (actionId === "guard") {
          state.battleGuardStreak = Math.min(2, state.battleGuardStreak + 1);
          const guardAlreadyActive = state.battleGuardRounds > 0;
          if (!guardAlreadyActive) state.battleGuardRounds = 2;
          state.battleGuard = true;
          playerText = guardAlreadyActive
            ? "你维持护体，没有重复叠加防护。"
            : "你收剑护住灰牌，接下来两轮受到的伤害降低。";
          feedback = {
            kind: "guard",
            label: guardAlreadyActive ? "护体未刷新" : "护体生效",
            detail: guardAlreadyActive
              ? `护体未结束，重复施放不会延长；连续护体 ${state.battleGuardStreak}/2，下一回合可能触发破护。`
              : "接下来两轮反击伤害降低 65%。",
          };
        } else if (actionId === "recover") {
          if (state.battleMana >= combat.maxMana) {
            showToast("法力已满。");
            return;
          }
          state.battleGuardStreak = 0;
          const recovery = combat.manaRecovery;
          const oldMana = state.battleMana;
          state.battleMana = Math.min(combat.maxMana, state.battleMana + recovery);
          playerText = "你引导灵气回流，恢复 " + (state.battleMana - oldMana) + " 点法力。";
          feedback = {
            kind: "reward",
            label: `恢复 ${state.battleMana - oldMana} 法力`,
            detail: "法力恢复完成。",
          };
        } else {
          return;
        }

        state.battleEnemyHp = Math.max(0, state.battleEnemyHp - damage);
        state.battleFeedback = feedback;
        state.battleStatus = `你已行动：${config.enemyName}剩余 ${state.battleEnemyHp} 点气血`;
        addBattleLog(playerText);
        if (state.battleEnemyHp <= 0) {
          finishBattle("win");
          return;
        }

        const phaseAfterPlayer = getBattlePhase(config);
        const phaseChanged = phaseAfterPlayer > phaseBefore;
        const guardActive = state.battleGuardRounds > 0;
        const enemyWasGuarding = state.battleEnemyGuardRounds > 0;
        const pressureBonus = state.battleMode === "pve"
          ? Math.max(0, tier - 1) * .035
          : 0;
        const phaseBonus = phaseAfterPlayer >= 2 ? .1 : 0;
        const scaledAttack = Math.max(
          1,
          Math.ceil(config.attack * (1 + pressureBonus + phaseBonus)),
        );
        const enemyAttack = intent.id === "guard"
          ? Math.max(1, Math.ceil(scaledAttack * .65))
          : scaledAttack;
        let guardReduction = guardActive ? Math.ceil(scaledAttack * .65) : 0;
        if (intent.id === "charge" && guardActive) {
          guardReduction = Math.ceil(scaledAttack * .42);
        }
        if (intent.id === "break_guard" && guardActive && !interruptedBreak) {
          guardReduction = Math.ceil(scaledAttack * .2);
        }
        const intentBonus = intent.id === "charge"
          ? Math.ceil(scaledAttack * .45)
          : intent.id === "break_guard" && !interruptedBreak
            ? Math.ceil(scaledAttack * .65)
            : 0;
        const enemyDamage = Math.max(1, enemyAttack + intentBonus - combat.defense - guardReduction);
        const appliedEnemyDamage = tutorialBattle && state.battleTurn <= 3
          ? Math.min(enemyDamage, 4)
          : enemyDamage;
        state.battlePlayerHp = Math.max(0, state.battlePlayerHp - appliedEnemyDamage);
        if (guardActive) {
          state.battleGuardRounds = intent.id === "break_guard" && !interruptedBreak
            ? 0
            : Math.max(0, state.battleGuardRounds - 1);
        }
        state.battleGuard = state.battleGuardRounds > 0;
        if (intent.id === "guard" && !brokeEnemyGuard) {
          state.battleEnemyGuardRounds = 2;
        } else if (enemyWasGuarding) {
          state.battleEnemyGuardRounds = Math.max(0, state.battleEnemyGuardRounds - 1);
        }
        const enemyActionText = interruptedBreak
          ? "的破护蓄力被洞察打断"
          : intent.id === "break_guard" && guardActive
            ? "击碎了你的护体"
            : "反击";
        addBattleLog(`${config.enemyName}${enemyActionText}，造成 ${appliedEnemyDamage} 点伤害。`);
        state.battleStatus = `${config.enemyName}${enemyActionText}：你受到 ${appliedEnemyDamage} 点伤害${phaseAfterPlayer >= 2 ? " · 第二阶段" : ""}`;
        const responseDetails = [
          feedback?.detail || "敌方行动已结算。",
          intent.id === "break_guard" && guardActive && !interruptedBreak
            ? "破护蓄力穿透了大部分减伤。"
            : "",
          phaseChanged ? `${config.enemyName}进入第二阶段，攻击压力提升。` : "",
          tutorialBattle && state.battleTurn <= 3
            ? "前三回合敌方行动速度不变。"
            : "",
        ].filter(Boolean).join(" ");
        state.battleFeedback = {
          kind: "damage",
          label: `受击 -${appliedEnemyDamage}`,
          detail: responseDetails,
        };
        AudioService.play("battle");
        state.battleTurn += 1;
        state.battleIntent = getNextBattleIntent();
        if (state.battlePlayerHp <= 0) {
          finishBattle("lose");
          return;
        }
        persistPreviewState();
        render();
      }

      function finishStoryTyping() {
        if (storyTypeTimer) {
          window.clearInterval(storyTypeTimer);
          storyTypeTimer = 0;
        }
        const target = content.querySelector("[data-story-typewriter]");
        if (target) {
          target.textContent = storyTypingText;
          target.classList.remove("is-typing");
        }
        storyTypingDone = true;
        window.requestAnimationFrame(() => {
          positionTutorialOverlay();
        });
      }

      function startStoryTyping(text) {
        finishStoryTyping();
        storyTypingText = text;
        storyTypingDone = false;
        const target = content.querySelector("[data-story-typewriter]");
        if (!target) {
          storyTypingDone = true;
          return;
        }
        let index = 0;
        target.textContent = "";
        target.classList.add("is-typing");
        storyTypeTimer = window.setInterval(() => {
          index += 1;
          target.textContent = storyTypingText.slice(0, index);
          if (index >= storyTypingText.length) finishStoryTyping();
        }, 24);

      function captureContentScroll() {
        const surface = content.querySelector("[data-scroll-surface]");
        const dragSurfaces = Array.from(
          content.querySelectorAll("[data-scroll-drag-surface]"),
        ).map((dragSurface) => ({
          key: dragSurface.dataset.scrollDragSurface || "",
          top: dragSurface.scrollTop,
          left: dragSurface.scrollLeft,
        }));
        if (!surface && !dragSurfaces.length) return null;
        return {
          key: surface?.dataset.scrollSurface || "",
          top: surface?.scrollTop || 0,
          left: surface?.scrollLeft || 0,
          dragSurfaces,
        };
      }

      function restoreContentScroll(snapshot) {
        if (!snapshot || !snapshot.key || ["battle", "story"].includes(snapshot.key)) {
          return;
        }
        if (contentScrollRestoreFrame) {
          window.cancelAnimationFrame(contentScrollRestoreFrame);
        }
        contentScrollRestoreFrame = window.requestAnimationFrame(() => {
          contentScrollRestoreFrame = 0;
          const surface = content.querySelector("[data-scroll-surface]");
          if (!surface || surface.dataset.scrollSurface !== snapshot.key) return;
          const maxScrollTop = Math.max(0, surface.scrollHeight - surface.clientHeight);
          const maxScrollLeft = Math.max(0, surface.scrollWidth - surface.clientWidth);
          surface.scrollTop = Math.min(
            maxScrollTop,
            Math.max(0, Number(snapshot.top) || 0),
          );
          surface.scrollLeft = Math.min(
            maxScrollLeft,
            Math.max(0, Number(snapshot.left) || 0),
          );
          const dragSurfaceSnapshots = Array.isArray(snapshot.dragSurfaces)
            ? snapshot.dragSurfaces
            : [];
          dragSurfaceSnapshots.forEach((dragSnapshot) => {
            if (!dragSnapshot.key) return;
            const dragSurface = Array.from(
              content.querySelectorAll("[data-scroll-drag-surface]"),
            ).find((candidate) => (
              candidate.dataset.scrollDragSurface === dragSnapshot.key
            ));
            if (!dragSurface) return;
            const dragMaxScrollTop = Math.max(
              0,
              dragSurface.scrollHeight - dragSurface.clientHeight,
            );
            const dragMaxScrollLeft = Math.max(
              0,
              dragSurface.scrollWidth - dragSurface.clientWidth,
            );
            dragSurface.scrollTop = Math.min(
              dragMaxScrollTop,
              Math.max(0, Number(dragSnapshot.top) || 0),
            );
            dragSurface.scrollLeft = Math.min(
              dragMaxScrollLeft,
              Math.max(0, Number(dragSnapshot.left) || 0),
            );
          });
        });
      }

      function scheduleNavigationRender() {
        if (navigationRenderFrame) return;
        navigationRenderFrame = window.requestAnimationFrame(() => {
          navigationRenderFrame = 0;
          render();
        });

      function render() {
        applyPassiveEnergyRegen();
        const scrollSnapshot = captureContentScroll();
        try {
          schedulePreviewSave();
          AudioService.syncMusic();
          renderOverlayRoot();
          if (state.storyActive || state.battleActive || state.tab !== "map" || !state.rootLocked) {
            resetJoystick(content.querySelector("[data-joystick]"));
          }
          if (!state.rootLocked) {
            appHeader.hidden = true;
            bottomNav.hidden = true;
            renderRoot();
            return;
          }

          if (state.rewardSettlementOpen) {
            appHeader.hidden = true;
            bottomNav.hidden = true;
            renderRewardSettlement();
            return;
          }

          if (state.battleActive) {
            appHeader.hidden = true;
            bottomNav.hidden = true;
            renderBattleScene();
            focusBattleActions();
            return;
          }

          if (state.storyActive) {
            appHeader.hidden = true;
            bottomNav.hidden = true;
            renderStoryScene();
            return;
          }

          if (state.forgeOpen) {
            appHeader.hidden = true;
            bottomNav.hidden = true;
            renderForge();
            return;
          }

          appHeader.hidden = false;
          bottomNav.hidden = false;
          updateHeader();
          updateNav();

          if (state.settingsOpen) {
            renderEventSettings();
            return;
          }

          if (state.tab === "character") {
            renderCharacter();
            return;
          }
          if (state.tab === "tasks") {
            renderTasks();
            return;
          }
          if (state.tab === "summon") {
            renderSummon();
            return;
          }
          if (state.tab === "tower") {
            renderTower();
            return;
          }
          if (state.tab === "bag") {
            renderBag();
            return;
          }
          if (state.mapView === "world") {
            renderWorldMap();
            return;
          }
          renderMap();
        } finally {
          restoreContentScroll(scrollSnapshot);
        }

      function drawRadarChart() {
        const canvas = content.querySelector("[data-radar-chart]");
        if (!canvas) return;
        const context = canvas.getContext("2d");
        if (!context) return;
        const dimensions = getCharacterDimensions();
        const values = dimensions.map(({ value }) => Number(value) || 0);
        const labels = dimensions.map(({ label }) => label);
        const centerX = 280;
        const centerY = 220;
        const radius = 150;
        const visualScale = (value) => Math.min(100, Math.max(0, value)) / 100;
        const point = (index, scale) => {
          const angle = -Math.PI / 2 + index * Math.PI * 2 / values.length;
          return [
            centerX + Math.cos(angle) * radius * scale,
            centerY + Math.sin(angle) * radius * scale,
          ];
        };
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.lineWidth = 2;
        context.strokeStyle = "rgba(243,237,220,.32)";
        context.fillStyle = "rgba(101,200,162,.24)";
        for (let ring = 1; ring <= 4; ring += 1) {
          context.beginPath();
          context.arc(centerX, centerY, radius * ring / 4, 0, Math.PI * 2);
          context.stroke();
        }
        values.forEach((_, index) => {
          const [x, y] = point(index, 1);
          context.beginPath();
          context.moveTo(centerX, centerY);
          context.lineTo(x, y);
          context.stroke();
        });
        context.beginPath();
        values.forEach((value, index) => {
          const [x, y] = point(index, visualScale(value));
          index === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
        });
        context.closePath();
        context.fill();
        context.strokeStyle = "rgba(229,161,93,.95)";
        context.stroke();
        context.fillStyle = "#f3eddc";
        context.font = '20px "Microsoft YaHei", sans-serif';
        context.textAlign = "center";
        context.textBaseline = "middle";
        labels.forEach((label, index) => {
          const [x, y] = point(index, 1.18);
          context.fillText(`${label} ${Math.round(values[index])}`, x, y);
        });
      }

                      <div class="task-row-footer">
                        <span class="task-row-reward">剧情更新后开放</span>
                        <span class="task-row-actions">暂不可进入</span>
                      </div>
                    </article>
                  </div>
                ` : ""}
              </section>
            `;
          }
          const tasks = section.taskIds
            .map((taskId) => TASKS[taskId])
            .filter(Boolean);
          const completedCount = tasks.filter((task) => isTaskCompleted(task.id)).length;
          const open = state.taskSections?.[section.id] === true;
          const sectionStatus = completedCount === tasks.length
            ? "本章已完成"
            : completedCount > 0
              ? `已完成 ${completedCount} 项`
              : section.side
                ? "支线可接取"
                : "尚未调查";
          return `
            <section class="task-section ${section.side ? "side" : ""} ${open ? "is-open" : ""}">

              </button>
              ${open ? `<div class="task-section-body">${tasks.map((task) => renderTaskCard(task.id)).join("")}</div>` : ""}
            </section>
          `;
        }).join("");

        content.innerHTML = `
          <div class="panel-view" data-scroll-surface="tasks">

      function renderSummonRitual(activeBanner, latestResults) {
        const animationActive = summonAnimation.active;
        const phase = animationActive
          ? summonAnimation.phase
          : latestResults.length
            ? "settled"
            : "idle";
        const drawCount = animationActive
          ? summonAnimation.count
          : latestResults.length
            ? latestResults.length
            : 3;
        const slotCount = Math.min(10, Math.max(1, Number(drawCount) || 1));
        const revealIndex = animationActive && phase === "reveal"
          ? Math.max(0, Math.min(latestResults.length - 1, summonAnimation.revealIndex))
          : -1;
        const gridClass = [
          slotCount === 1 ? "is-single" : slotCount === 2 ? "is-double" : "",
          animationActive ? "is-sequential" : "",
        ].filter(Boolean).join(" ");
        const phaseCopy = {
          idle: "等待招募操作。",
          charging: "灵力聚合中。",
          reveal: revealIndex >= latestResults.length - 1
            ? "点击当前卡牌，收下这次结果。"
            : "点击当前卡牌，翻开下一张。",
          settled: "结果已归档。",
        }[phase] || "招募处理中。";
        const coreText = {
          idle: "缘",
          charging: "应",
          reveal: "开",
          settled: "定",
        }[phase] || "缘";
        const renderHiddenCard = (index) => `
          <span class="summon-pull-card is-hidden ${phase === "charging" ? "is-charging" : ""}" style="--card-delay:${index * 48}ms" aria-hidden="true">
            <span class="summon-pull-card-mark">缘</span>
          </span>
        `;
        const renderResultCard = (result, index, active = false) => {
          const isCurrent = active && index === revealIndex;
          const isSeen = active && index < revealIndex;
          const cardClasses = [
            "summon-pull-card",
            "is-result",
            isCurrent ? "is-current" : "",
            isSeen ? "is-seen" : "",
          ];
          if (result.type === "companion") {
            const companion = getCompanionById(result.id);
            const rarityClass = companion?.rarity === "传承" ? "is-heritage" : "is-rare";
            cardClasses.push(rarityClass, "is-character");
            const tag = isCurrent ? "button" : "span";
            const interaction = isCurrent
              ? ` type="button" data-summon-next aria-label="查看第 ${index + 1} 张招募结果"`
              : "";
            return `
              <${tag} class="${cardClasses.filter(Boolean).join(" ")}" style="--card-delay:${index * 44}ms"${interaction}>
                ${companion ? getCompanionPortraitMarkup(companion) : `<span class="summon-pull-card-mark">缘</span>`}
                <span class="summon-pull-card-name">${escapeHtml(companion?.name || "伙伴")}</span>
                ${result.isNew ? `<span class="summon-pull-card-new">新相遇</span>` : ""}
              </${tag}>
            `;
          }
          const reward = SUMMON_MEMORY_REWARDS.find((item) => item.id === result.rewardId);
          const tag = isCurrent ? "button" : "span";
          const interaction = isCurrent
            ? ` type="button" data-summon-next aria-label="查看第 ${index + 1} 张招募结果"`
            : "";
          cardClasses.push("is-memory");
          return `
            <${tag} class="${cardClasses.filter(Boolean).join(" ")}" style="--card-delay:${index * 44}ms"${interaction}>
              <span class="summon-pull-card-memory-mark">契</span>
              <span class="summon-pull-card-memory">${escapeHtml(reward?.name || "同契记忆")}</span>
              <span class="summon-pull-card-memory-count">+${result.amount || reward?.amount || 1}</span>
            </${tag}>
          `;
        };
        const cardMarkup = phase === "reveal" && animationActive
          ? Array.from({ length: slotCount }, (_, index) =>
            latestResults[index] && index <= revealIndex
              ? renderResultCard(latestResults[index], index, true)
              : renderHiddenCard(index)
          ).join("")
          : phase === "settled"
            ? latestResults.map((result, index) => renderResultCard(result, index)).join("")
            : Array.from({ length: slotCount }, (_, index) => renderHiddenCard(index)).join("");
        return `
          <section class="summon-ritual is-${phase}" data-summon-ritual aria-live="polite" aria-label="${escapeHtml(activeBanner.name)}抽卡结果">
            <div class="summon-ritual-header">
              <strong>${phase === "settled" ? "最近一次契约" : "契约台"}</strong>
              <span>${
                phase === "charging"
                  ? "处理中"
                  : phase === "reveal"
                    ? `第 ${revealIndex + 1} / ${latestResults.length} 张`
                    : phase === "settled"
                      ? `${latestResults.length} 项已确认`
                      : "待显示结果"
              }</span>
            </div>
            <div class="summon-ritual-stage">
              <div class="summon-ritual-core">${coreText}</div>
              <div class="summon-pull-grid ${gridClass}">${cardMarkup}</div>
            </div>
            <div class="summon-ritual-caption">${phaseCopy}</div>
          </section>
        `;
      }

      function getItemStatValues(item) {
        const catalog = EQUIPMENT_CATALOG[item?.id] || {};
        const baseStats = {
          ...(catalog.baseStats || {}),
          ...(item?.baseStats || {}),
        };
        const values = {
          ...baseStats,
        };
        (item?.affixes || []).forEach((affix) => {
          const stat = getAffixStatKey(affix);
          if (Number.isFinite(Number(affix?.percent)) && stat) {
            const baseValue = Number(baseStats[stat] || 0);
            values[stat] = Number(values[stat] || 0)
              + Math.round(baseValue * Number(affix.percent) / 100);
            return;
          }
          const stats = affix.stats || (stat ? { [stat]: affix.value } : {});
          Object.entries(stats).forEach(([key, value]) => {
            values[key] = Number(values[key] || 0) + Number(value || 0);
          });
        });
        return values;
      }

      function getItemStatText(item) {
        const statLabels = [
          ["attack", "攻击"],
          ["defense", "防御"],
          ["insight", "洞察"],
          ["spirit", "灵力"],
          ["recovery", "回气"],
          ["maxHp", "气血"],
        ];
        const values = getItemStatValues(item);
        return statLabels
          .filter(([key]) => Number(values[key] || 0) !== 0)
          .map(([key, label]) => `${label} +${values[key]}`)
          .join(" · ");
      }

      const EQUIPMENT_RESALE_RULES = Object.freeze({
        white: { base: 2, cap: 8 },
        green: { base: 4, cap: 14 },
        blue: { base: 7, cap: 24 },
        purple: { base: 12, cap: 42 },
        gold: { base: 28, cap: 96 },
        red: { base: 70, cap: 260 },
      });

      function getEquipmentSellPrice(item) {
        if (!item?.slot || item.equipped) return 0;
        const qualityId = item.quality || "white";
        const rule = EQUIPMENT_RESALE_RULES[qualityId] || EQUIPMENT_RESALE_RULES.white;
        const values = getItemStatValues(item);
        const statWeights = {
          attack: 1.1,
          defense: 1,
          insight: 1.25,
          spirit: .65,
          recovery: 3,
          maxHp: .12,
        };
        const statScore = Object.entries(statWeights).reduce((sum, [key, weight]) =>
          sum + Math.max(0, Number(values[key] || 0)) * weight, 0);
        const affixScore = (item.affixes || []).reduce((sum, affix) => {
          const tier = getAffixValueTier(affix);
          const tierBonus = { green: 1, blue: 2, purple: 4, gold: 8 }[tier] || 1;
          return sum + tierBonus + Math.max(0, Number(getAffixNumericValue(affix) || 0)) * .12;
        }, 0);
        const hasRareAffix = (item.affixes || []).some((affix) =>
          getAffixValueTier(affix) === "gold");
        const isRare = ["gold", "red"].includes(qualityId) || hasRareAffix;
        const raw = rule.base + Math.round(statScore * .32 + affixScore * .85);
        return Math.max(
          rule.base,
          isRare ? raw : Math.min(rule.cap, raw),
        );
      }

      function getSellableEquipment() {
        return state.inventory
          .filter((item) => item.slot && !item.equipped && Number(item.count || 0) > 0)
          .sort((left, right) => getEquipmentSellPrice(right) - getEquipmentSellPrice(left));
      }

      function getEquipmentStackCount(item) {
        return Math.max(1, Number(item.count || 1));
      }

      function getSelectedRecycleEquipment() {
        const selectedQualities = new Set(
          Array.isArray(state.recycleQualityFilters)
            ? state.recycleQualityFilters.filter((qualityId) => Object.hasOwn(EQUIPMENT_QUALITIES, qualityId))
            : [],
        );
        if (!selectedQualities.size) return [];
        return getSellableEquipment().filter((item) =>
          selectedQualities.has(item.quality || "white"));
      }

      function getEquipmentSaleStallId() {
        const nearbySaleStallId = ["forge", "square"].includes(state.nearbyRegionLocationId)
          ? state.nearbyRegionLocationId
          : "";
        return ["forge", "square"].includes(state.marketModal)
          ? state.marketModal
          : nearbySaleStallId || "forge";
      }

      function canSellEquipmentAtStall() {
        const saleStallId = getEquipmentSaleStallId();
        const forgeUnlocked = isTaskCompleted("main_chapter2") || state.devAllMaps;
        if (!forgeUnlocked) {
          showToast("完成第二章后开放装备回收");
          return "";
        }
        if (state.regionId !== "market" || !isNearRegionLocation(saleStallId)) {
          showToast(`请抵达${saleStallId === "square" ? "交易广场" : "淬炼铺"}后出售装备`);
          return "";
        }
        return saleStallId;
      }

      function sellEquipmentToForge(itemId) {
        if (!canSellEquipmentAtStall()) return;
        const item = getInventoryItem(itemId);
        if (!item?.slot) return;
        if (item.equipped) {
          showToast("已装备物品不可出售：请先卸下");
          return;
        }
        const price = getEquipmentSellPrice(item);
        if (!price || !removeInventoryItemCount(item.id)) {
          showToast("装备无法出售");
          return;
        }
        state.stones += price;
        const keepMarketOpen = ["forge", "square"].includes(state.marketModal);
        if (!keepMarketOpen) state.marketModal = "";
        state.detailModal = null;
        persistPreviewState();
        render();
        showToast(`已回收：${item.name} · 灵石 +${price}`, "confirm");
      }

      function sellAllEquipmentToForge() {
        if (!canSellEquipmentAtStall()) return;
        if (!Array.isArray(state.recycleQualityFilters) || !state.recycleQualityFilters.length) {
          state.recycleFilterOpen = true;
          render();
          showToast("回收条件未设置：请选择品质");
          return;
        }
        const items = getSelectedRecycleEquipment().map((item) => ({
          id: item.id,
          name: item.name,
          count: getEquipmentStackCount(item),
          price: getEquipmentSellPrice(item),
        }));
        if (!items.length) {
          showToast("当前品质无可回收的未装备物品");
          return;
        }
        let soldCount = 0;
        let totalPrice = 0;
        items.forEach((item) => {
          if (!item.price || !removeInventoryItemCount(item.id, item.count)) return;
          soldCount += item.count;
          totalPrice += item.price * item.count;
        });
        if (!soldCount) {
          showToast("暂无可回收装备");
          return;
        }
        state.stones += totalPrice;
        state.recycleFilterOpen = false;
        state.detailModal = null;
        persistPreviewState();
        render();
        showToast(`已一键回收 ${soldCount} 件装备 · 灵石 +${totalPrice}`, "confirm");
      }

      function getPrimaryTask() {

      function cancelPlayerMovement() {
        const wasMoving = Boolean(
          state.moving
          || state.pendingLocation
          || state.moveAnimationId,
        );
        if (state.moveAnimationId) {
          window.cancelAnimationFrame(state.moveAnimationId);
        }
        state.moveAnimationId = 0;
        state.moveAnimationToken += 1;
        state.moving = false;
        state.pendingLocation = null;
        const marker = content.querySelector(".player-marker");
        if (marker) {
          marker.classList.remove("walking");
        }
        if (wasMoving) {
          persistPreviewState();
        }
        return wasMoving;
      }

      function moveToLocation(locationId) {
        const location = LOCATION_DATA[locationId];
        if (!location) return;
        if (state.moving) {
          showToast("正在前往目标地点，请稍候");
          return;
        }
        const locked = !isOuterLocationUnlocked(locationId);
        if (locked) {
          showToast(`地点未开放：${location.name}；${getOuterLocationLockReason(locationId)}`);
          return;
        }
        if (locationId === state.location) {
          state.playerX = location.x;
          state.playerY = location.y;
          state.pendingLocation = null;
          state.nearbyOuterLocationId = locationId;
          state.nearbyGarden = locationId === "garden";
          if (!state.nearbyGarden) {
            state.herbGardenOpen = false;
          }
          render();
          showToast("你已在" + location.name);
          return;
        }

        // Task actions can be triggered from the task screen. Switch to the
        // action map before starting movement so the player always gets
        // visible feedback and the animation has a marker to update.
        if (state.tab !== "map" || state.mapView !== "local") {
          state.tab = "map";
          state.mapView = "local";
          state.taskExpanded = true;
          render();
        }

        const origin = {
          x: state.playerX,
          y: state.playerY,
        };
        const distance = Math.hypot(location.x - origin.x, location.y - origin.y);
        const duration = Math.max(850, Math.min(2100, Math.round(distance * 30)));
        const horizontalDistance = Math.abs(location.x - origin.x);
        const verticalDistance = Math.abs(location.y - origin.y);
        const horizontal = horizontalDistance >= verticalDistance;
          const row = horizontal ? 1 : (location.y < origin.y ? 3 : 0);
        const facingRight = horizontal && location.x > origin.x;

        state.moving = true;
        state.mapPanUserAdjusted = false;
        state.pendingLocation = locationId;
        const moveToken = state.moveAnimationToken + 1;
        state.moveAnimationToken = moveToken;
        render();

        const marker = content.querySelector(".player-marker");
        if (!marker) {
          state.moving = false;
          state.pendingLocation = null;
          render();
          showToast("地图资源尚未就绪，请重试", "error");
          return;
        }

        const startTime = performance.now();
        const setFrame = (frame, walking) => {
          marker.style.backgroundImage = `url("${ART}${walking ? "player_walk_4dir.png" : "player_idle_4dir.png"}")`;
          marker.style.backgroundPosition = `${(frame / 3) * 100}% ${(row / 3) * 100}%`;
          marker.style.transform = `translate(-50%, -50%) scaleX(${facingRight ? -1 : 1})`;
          marker.classList.toggle("walking", walking);
        };
        setFrame(0, true);

        const animate = (now) => {
          if (state.moveAnimationToken !== moveToken || !state.moving) {
            return;
          }
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = progress * progress * (3 - 2 * progress);
          const x = origin.x + (location.x - origin.x) * eased;
          const y = origin.y + (location.y - origin.y) * eased;
          const frame = Math.floor((now - startTime) / 110) % 4;
          state.playerX = x;
          state.playerY = y;
          marker.style.left = x + "%";
          marker.style.top = y + "%";
          setFrame(frame, progress < 1);
          const stage = content.querySelector(".map-stage");
          if (stage) {
            centerMapOnPlayer(stage, true);
          }

          if (progress < 1) {
            state.moveAnimationId = window.requestAnimationFrame(animate);
            return;
          }

          state.moveAnimationId = 0;
          state.moving = false;
          state.pendingLocation = null;
          state.location = locationId;
          if (queueLocationEvent(locationId)) {
            return;
          }
          render();
          showToast("已抵达：" + location.name);
        };

        state.moveAnimationId = window.requestAnimationFrame(animate);
      }

      function completeTask(taskId) {
        const task = TASKS[taskId];
        if (!task) return;
        const progress = getTaskProgress(taskId);
        if (progress.done) {
          showToast("该任务已完成");
          return;
        }
        if (!progress.unlocked) {
          showToast(`未解锁：需满足${getTaskMissingRequirementText(taskId)}`);
          return;
        }
        if (state.pendingEvent && getEventTaskId(state.pendingEvent) === taskId) {
          enterPendingEvent();
          return;
        }

        if (taskId === "main_intro") {
          if (state.location !== TASKS.main_intro.target) {
            moveToLocation(TASKS.main_intro.target);
            return;
          }
          startMainStory();
          return;
        }

        if (taskId === "side_herb") {
          if (state.location !== TASKS.side_herb.target) {
            moveToLocation(TASKS.side_herb.target);
            return;
          }
          startSideStory();
          return;
        }

        if (taskId === "favor_su") {
          if (!isTaskCompleted("side_herb") || state.favor < 2) {
            showToast("未满足：完成药圃失物且苏晚潮好感度达到 2");
            return;
          }
          if (state.location !== TASKS.favor_su.target) {
            moveToLocation(TASKS.favor_su.target);
            return;
          }
          startFavorSuStory();
          return;
        }

        if (taskId === "main_chapter2") {
          if (state.location !== TASKS.main_chapter2.target) {
            moveToLocation(TASKS.main_chapter2.target);
            return;
          }
          startChapterTwo();
          return;
        }

        if (taskId === "main_chapter3") {
          if (state.regionId !== TASKS.main_chapter3.target) {
            void enterRegion(TASKS.main_chapter3.target);
            return;
          }
          startChapterThree();
          return;
        }

        if (taskId === "main_chapter4") {
          if (state.location !== TASKS.main_chapter4.target) {
            moveToLocation(TASKS.main_chapter4.target);
            return;
          }
          startChapterFour();
          return;
        }

        if (taskId === "main_chapter5") {
          if (state.location !== TASKS.main_chapter5.target) {
            moveToLocation(TASKS.main_chapter5.target);
            return;
          }
          startChapterFive();
          return;
        }

        if (taskId === "main_chapter6") {
          if (state.regionId !== TASKS.main_chapter6.target) {
            void enterRegion(TASKS.main_chapter6.target);
            return;
          }
          if (state.mapView !== "local") {
            state.mapView = "local";
            render();
            return;
          }
          if (state.regionLocationId !== "archive") {
            activateRegionLocation("archive");
            return;
          }
          startChapterSix();
          return;
        }

        if (taskId === "side_chapter2") {
          startChapterSideStory("side2", taskId);
          return;
        }
        if (taskId === "side_chapter3") {
          startChapterSideStory("side3", taskId);
          return;
        }
        if (taskId === "side_chapter4") {
          startChapterSideStory("side4", taskId);
          return;
        }
        if (taskId === "side_chapter5") {
          startChapterSideStory("side5", taskId);
        }
      }

      function cultivate() {
        if (state.cultivation >= state.cultivationNeed) {
          showToast("修为已达当前上限，请先查看突破目标。", "reward");
          render();
          return false;
        }
        if (state.energy < 6) {
          showToast("灵力不足，请通过任务或休整恢复");
          return false;
        }
        const before = state.cultivation;
        state.energy -= 6;
        const gained = Math.min(
          Math.round(12 * state.candidate.rate),
          state.cultivationNeed - before,
        );
        state.cultivation = before + gained;
        state.stats.insight += 1;
        showToast(
          state.cultivation >= state.cultivationNeed
            ? "闭关完成：修为已达上限，请查看突破目标。"
            : "闭关完成：修为与洞察提升",
          state.cultivation >= state.cultivationNeed ? "reward" : "tap",
        );
        render();
        return true;
      }

      function tendHerbPlot(action) {
        if (!isNearLocation("garden", 5)) {
          showToast("请返回后山药圃进行照料");
          return;
        }
        const plot = state.herbPlot;
        const now = Date.now();
        if (action === "sow" && plot.stage === 0) {
          if (state.stones < 4) { showToast("灵石不足，无法准备药田"); return; }
          state.stones -= 4;
          plot.stage = 1;
          plot.plantedAt = now;
          plot.nextActionAt = now + HERB_GROWTH_INTERVALS.sprout;
          showToast("已播下回气草种子");
        } else if (action === "tend" && plot.stage > 0 && plot.stage < 3) {
          if (plot.nextActionAt && now < plot.nextActionAt) {
            showToast(`药草生长中，约 ${Math.max(1, Math.ceil((plot.nextActionAt - now) / 1000))} 秒后可再次操作`);
            return;
          }
          if (state.energy < 3) { showToast("灵力不足，无法照料药田"); return; }
          state.energy -= 3;
          plot.stage += 1;
          plot.tended += 1;
          plot.nextActionAt = plot.stage < 3 ? now + HERB_GROWTH_INTERVALS.mature : 0;
          state.cultivation = Math.min(state.cultivationNeed, state.cultivation + 5);
          showToast(plot.stage >= 3 ? "药草已成熟，可收获" : "照料完成，进入下一生长阶段");
        } else if (action === "harvest" && plot.stage >= 3) {
          plot.stage = 0;
          plot.tended = 0;
          plot.plantedAt = 0;
          plot.nextActionAt = 0;
          state.energy = Math.max(0, state.energy + 10);
          addReward({
            id: "homegrown_herb",
            name: "自种回气草",
            desc: "亲手照料的药草，能恢复少量灵力。",
            icon: COMMON_ITEM_ART.hui_qi_powder,
            useType: "restoreEnergy",
            useAmount: 8,
            count: 1,
          });
          showToast("收获完成：灵力已恢复，物品已存入背包");
        }
        persistPreviewState();
        render();
      }

      function getDailyEnergyAdClaims() {
        const dayKey = getAdDayKey();
        const legacyClaimed = Boolean(state.adClaims[`daily_cultivation_${dayKey}`]);
        return Array.from({ length: DAILY_ENERGY_AD_LIMIT }, (_, index) =>
          Boolean(state.adClaims[`daily_energy_${dayKey}_${index + 1}`])
            || (index === 0 && legacyClaimed));
      }

      function claimDailyCultivation() {
        const dayKey = getAdDayKey();
        const claims = getDailyEnergyAdClaims();
        const slotIndex = claims.findIndex((claimed) => !claimed);
        if (slotIndex < 0) {
          showToast("今日广告恢复次数已用尽");
          return;
        }
        const claimId = `daily_energy_${dayKey}_${slotIndex + 1}`;
        void AdService.showRewarded({
          placement: `daily_energy_${slotIndex + 1}`,
          onReward: () => {
            if (getDailyEnergyAdClaims()[slotIndex]) return;
            const oldEnergy = state.energy;
            state.energy = Math.max(0, state.energy + DAILY_ENERGY_AD_REWARD);
            state.adClaims[claimId] = true;
            state.battleFeedback = {
              kind: "reward",
              label: "静心完成",
              detail: `灵力恢复 ${state.energy - oldEnergy} 点`,
            };
            persistPreviewState();
            render();
          },
        });
      }

      function breakthrough() {
        if (state.cultivation < state.cultivationNeed) {
          showToast("修为未达到突破要求");
          return false;
        }
        const currentRealm = getPreviewRealmDefinition();
        const currentStage = state.realmStage;
        const nextRealm = currentStage < currentRealm.maxStage
          ? currentRealm
          : getPreviewNextRealm();
        if (!nextRealm) {
          showToast("飞升后的世界与终局剧情尚未接入，敬请期待", "loading");
          return false;
        }
        const crossedRealm = currentRealm.id !== nextRealm.id;
        state.cultivation = 0;
        if (crossedRealm) {
          state.realmId = nextRealm.id;
          state.realmStage = 1;
        } else {
          state.realmStage += 1;
        }
        const nextRank = getPreviewRealmRank();
        const capGrowth = crossedRealm ? nextRealm.realmGrowth : nextRealm.stageGrowth;
        state.cultivationNeed = Math.max(
          state.cultivationNeed + (crossedRealm ? 80 : 50),
          Math.round(state.cultivationNeed * capGrowth),
          Math.round(100 * Math.pow(1.115, nextRank - 1)),
        );
        state.stats.body += nextRealm.body;
        state.stats.insight += nextRealm.insight;
        state.stats.control += nextRealm.control;
        state.stats.hp += nextRealm.hp;
        state.energy = Math.max(0, state.energy + nextRealm.energy);
        syncPreviewRealmState();
        const enteredRealm = getPreviewRealmDefinition();
        const storyHook = enteredRealm.storyHook
          ? ` ${enteredRealm.storyHook}`
          : "";
        showToast(`突破成功：进入${getPreviewRealmText()}。${storyHook}`, "reward");
        render();
        return true;
      }

          "button, a, input, select, textarea, [contenteditable='true'], [data-no-scroll-drag], .map-stage, .movement-joystick",
        )

      content.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        const target = event.target instanceof Element ? event.target : null;
        const dragSurface = target?.closest?.("[data-scroll-drag-surface]");
        const surface = dragSurface || target?.closest?.("[data-scroll-surface]");
        if (
          !surface
          || surface.classList.contains("map-hub-view")
          || surface.classList.contains("world-map-view")
          || isScrollDragExcluded(target)
          || (surface.scrollHeight <= surface.clientHeight && surface.scrollWidth <= surface.clientWidth)
        ) {
          return;
        }

        scrollDrag = {
          pointerId: event.pointerId,
          surface,
          startX: event.clientX,
          startY: event.clientY,
          originLeft: surface.scrollLeft,
          originTop: surface.scrollTop,
          moved: false,
        };
        try {
          surface.setPointerCapture(event.pointerId);
        } catch (error) {
          // Native scrolling remains available when pointer capture is unsupported.
        }

        if (!scrollDrag || scrollDrag.pointerId !== event.pointerId) return;

        const dy = event.clientY - scrollDrag.startY;
        if (!scrollDrag.moved && Math.hypot(dx, dy) < 5) return;
        scrollDrag.moved = true;
        scrollDrag.surface.classList.add("is-pointer-scrolling");
        scrollDrag.surface.scrollLeft = scrollDrag.originLeft - dx;
        scrollDrag.surface.scrollTop = scrollDrag.originTop - dy;
        event.preventDefault();

          suppressScrollClickUntil = performance.now() + 350;

          && nextTab === "bag"
          && state.tutorialStep === "chapter2_bag"
        ) {
          state.tutorialStep = "chapter2_forge";
        }
        scheduleNavigationRender();
      });

      appHeader.addEventListener("click", (event) => {
        const target = event.target.closest("[data-event-settings]");
        if (!target || !state.rootLocked || state.storyActive) return;
        state.settingsOpen = true;
        render();
      });

      resetButton.addEventListener("click", requestResetPreview);
      window.addEventListener("pointerdown", () => AudioService.unlock(), { passive: true });
      window.addEventListener("keydown", () => AudioService.unlock(), { passive: true });
      window.setInterval(() => {
        const energyChanged = applyPassiveEnergyRegen();
        if (energyChanged) {
          persistPreviewState();
          if (!state.storyActive && !state.battleActive && !state.rewardSettlementOpen) {
            render();
          } else {
            updateHeader();
          }
        }
        if (
          state.tab === "map"
          && state.regionId === "outer"
          && isNearLocation("garden", 5)
          && state.herbPlot.stage > 0
          && state.herbPlot.stage < 3
          && state.herbPlot.nextActionAt
        ) {
          syncNearbyInteractionUi();
        }
      }, 1000);
      window.addEventListener("beforeunload", () => {
        persistPreviewState();
        void flushPreviewCloudSave();
      });
      let wasHidden = false;
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          wasHidden = true;
          cancelPlayerMovement();
          resetJoystick(content.querySelector("[data-joystick]"));
          persistPreviewState();
          void flushPreviewCloudSave();
          return;
        }
        if (wasHidden && !state.adBusy) {
          wasHidden = false;
          restorePreviewState();
          applyPassiveEnergyRegen();
          prepareInitialTutorialOffer();
          render();
        }
      });
      window.addEventListener("storage", (event) => {
        if (event.key === PREVIEW_META_KEY && !state.adBusy) {
          render();
          return;
        }
        if (
          !event.key
          || !event.key.startsWith(PREVIEW_SAVE_KEY_PREFIX)
          || state.adBusy
        ) return;
        const changedSlot = normalizePreviewSlot(
          Number(event.key.slice(PREVIEW_SAVE_KEY_PREFIX.length)),
        );
        if (changedSlot === state.activeSaveSlot) {
          restorePreviewState(changedSlot);
          prepareInitialTutorialOffer();
        }
        render();
      });
      migratePreviewSave();
      state.activeSaveSlot = getStoredPreviewSlot();
      restorePreviewState(state.activeSaveSlot);
      applyPreviewQaOverrides();
      prepareInitialTutorialOffer();
      void syncPreviewCloudState();
      void bootPreview();
    })();
  </script>
</body>
</html>
