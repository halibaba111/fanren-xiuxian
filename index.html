<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>岚川院 · 修仙主循环预览</title>
  <link rel="icon" href="./game_icon.png">
  <link rel="preload" as="image" href="assets/release/resources/art/bg_outer_courtyard_move.jpg" fetchpriority="high">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3eddc;
      --muted: #a9b3ae;
      --dim: #73817c;
      --jade: #65c8a2;
      --jade-deep: #1d5b4a;
      --amber: #e5a15d;
      --plum: #a9798f;
      --sky: #82b8c2;
      --danger: #c76d60;
      --line: rgba(243, 237, 220, .16);
      --line-strong: rgba(243, 237, 220, .28);
      --panel: rgba(7, 17, 24, .74);
      --panel-strong: rgba(7, 17, 24, .92);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #091017;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 20px;
      overscroll-behavior: none;
    }

    body.is-booting {
      overflow: hidden;
    }

    .boot-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      background: #091017;
      opacity: 1;
      transition: opacity .22s ease, visibility .22s ease;
    }

    .boot-loader.is-ready {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .boot-loader-card {
      width: min(100%, 310px);
      padding: 22px 20px 18px;
      background: rgba(7, 17, 24, .96);
      border: 1px solid rgba(101, 200, 162, .34);
      border-top: 2px solid var(--jade);
      border-radius: 5px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .32);
      text-align: center;
    }

    .boot-loader-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin: 0 auto 12px;
      color: var(--amber);
      border: 1px solid rgba(229, 161, 93, .62);
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(229, 161, 93, .14);
      font-size: 22px;
      font-weight: 700;
    }

    .boot-loader-title {
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    .boot-loader-copy {
      min-height: 18px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .boot-loader-progress {
      height: 5px;
      margin-top: 16px;
      overflow: hidden;
      background: rgba(243, 237, 220, .1);
      border-radius: 999px;
    }

    .boot-loader-progress span {
      display: block;
      width: 4%;
      height: 100%;
      background: linear-gradient(90deg, var(--jade), var(--amber));
      border-radius: inherit;
      transition: width .2s ease;
    }

    .boot-loader-meta {
      margin-top: 8px;
      color: var(--dim);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-loader,
      .boot-loader-progress span {
        transition: none;
      }
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:not(:disabled):active {
      filter: brightness(.92);
      transform: translateY(1px);
    }

    .preview-shell {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .preview-caption {
      display: none;
      width: min(100%, 520px);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .game-frame {
      position: relative;
      width: 390px;
      height: min(844px, calc(100vh - 40px));
      min-height: 0;
      max-height: 100dvh;
      overflow: hidden;
      background: #0d1720;
      border: 1px solid rgba(243, 237, 220, .14);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      isolation: isolate;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: center / cover no-repeat url("assets/release/resources/art/bg_outer_courtyard_move.jpg");
      filter: saturate(.88) brightness(.72);
      z-index: -4;
    }

    .world-tint {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(5, 12, 18, .82) 0%, rgba(5, 12, 18, .14) 22%, rgba(5, 12, 18, .12) 53%, rgba(5, 12, 18, .9) 100%),
        linear-gradient(90deg, rgba(5, 13, 18, .4), transparent 50%, rgba(5, 13, 18, .25));
      z-index: -3;
      pointer-events: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    [hidden] {
      display: none !important;
    }

    .app-header {
      flex: 0 0 auto;
      padding: max(13px, env(safe-area-inset-top)) 14px 11px;
      background: linear-gradient(180deg, rgba(5, 13, 18, .93), rgba(5, 13, 18, .7));
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .identity {
      min-width: 0;
    }

    .identity-kicker {
      color: var(--jade);
      font-size: 10px;
      letter-spacing: .14em;
      line-height: 1.3;
    }

    .identity-title {
      margin-top: 2px;
      overflow: hidden;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .header-tag {
      padding: 5px 7px;
      color: var(--amber);
      background: rgba(229, 161, 93, .1);
      border: 1px solid rgba(229, 161, 93, .28);
      border-radius: 3px;
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--muted);
      background: rgba(7, 17, 24, .58);
      border: 1px solid var(--line);
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      color: var(--ink);
      border-color: var(--jade);
    }

    .settings-view {
      height: 100%;
      overflow: auto;
      padding: 16px 14px 20px;
      background:
        linear-gradient(180deg, rgba(5, 13, 18, .14), rgba(5, 13, 18, .54)),
        url("assets/release/resources/art/bg_outer_courtyard_move.jpg") center / cover no-repeat;
    }

    .settings-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .settings-heading .screen-title {
      margin-top: 3px;
    }

    .settings-panel {
      margin-top: 14px;
      padding: 13px;
      background: rgba(8, 20, 27, .84);
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .settings-panel-title {
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .settings-panel-copy {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .settings-options {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .settings-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 48px;
      padding: 9px 10px;
      color: var(--ink);
      background: rgba(243, 237, 220, .04);
      border: 1px solid rgba(243, 237, 220, .16);
      border-radius: 3px;
      text-align: left;
      cursor: pointer;
    }

    .settings-option:hover,
    .settings-option:focus-visible,
    .settings-option.selected {
      background: rgba(29, 91, 74, .36);
      border-color: var(--jade);
    }

    .settings-option strong {
      display: block;
      font-size: 12px;
      line-height: 1.35;
    }

    .settings-option span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .settings-option-mark {
      color: var(--amber);
      font-size: 10px;
      white-space: nowrap;
    }

    .settings-hero {
      position: relative;
      margin-top: 14px;
      padding: 14px 13px 13px;
      overflow: hidden;
      background:
        linear-gradient(125deg, rgba(29, 91, 74, .52), rgba(8, 20, 27, .92) 62%),
        url("assets/release/resources/art/bg_outer_courtyard_move.jpg") center / cover no-repeat;
      border: 1px solid rgba(101, 200, 162, .38);
      border-left: 3px solid var(--jade);
      border-radius: 4px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .18);
    }

    .settings-hero::after {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 42px;
      height: 42px;
      content: "↯";
      color: rgba(229, 161, 93, .62);
      border: 1px solid rgba(229, 161, 93, .34);
      border-radius: 50%;
      font-size: 24px;
      line-height: 40px;
      text-align: center;
      transform: rotate(-12deg);
    }

    .settings-hero-kicker {
      color: var(--amber);
      font-size: 9px;
      letter-spacing: .13em;
      line-height: 1.2;
    }

    .settings-hero-title {
      margin-top: 7px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .settings-hero p {
      max-width: 82%;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .settings-hero-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px solid rgba(243, 237, 220, .14);
      color: var(--dim);
      font-size: 9px;
      line-height: 1.35;
    }

    .settings-hero-meta span {
      min-width: 0;
    }

    .settings-hero-meta strong {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .settings-section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .settings-section-heading > div {
      min-width: 0;
    }

    .settings-section-mark {
      flex: 0 0 auto;
      padding: 4px 6px;
      color: var(--amber);
      background: rgba(229, 161, 93, .09);
      border: 1px solid rgba(229, 161, 93, .24);
      border-radius: 3px;
      font-size: 8px;
      letter-spacing: .08em;
      line-height: 1.2;
    }

    .save-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 12px;
    }

    .save-card {
      display: flex;
      min-width: 0;
      min-height: 208px;
      flex-direction: column;
      padding: 9px 7px 7px;
      background: rgba(243, 237, 220, .045);
      border: 1px solid rgba(243, 237, 220, .14);
      border-top: 2px solid rgba(243, 237, 220, .2);
      border-radius: 3px;
    }

    .save-card.is-active {
      background: rgba(29, 91, 74, .26);
      border-color: rgba(101, 200, 162, .52);
      border-top-color: var(--jade);
    }

    .save-card.is-empty {
      background: rgba(7, 17, 24, .3);
      border-style: dashed;
    }

    .save-card.is-locked {
      background: rgba(7, 17, 24, .42);
      border-color: rgba(229, 161, 93, .28);
      border-top-color: rgba(229, 161, 93, .72);
    }

    .save-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .save-card-number {
      color: var(--amber);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .1em;
    }

    .save-card-badge {
      padding: 2px 4px;
      color: #071117;
      background: var(--jade);
      border-radius: 2px;
      font-size: 8px;
      font-weight: 700;
      line-height: 1.2;
    }

    .save-card-lock-badge {
      padding: 2px 4px;
      color: #071117;
      background: var(--amber);
      border-radius: 2px;
      font-size: 8px;
      font-weight: 700;
      line-height: 1.2;
    }

    .save-card-title {
      display: block;
      min-height: 29px;
      margin-top: 10px;
      overflow: hidden;
      color: var(--ink);
      font-size: 10px;
      line-height: 1.45;
      text-overflow: ellipsis;
    }

    .save-card-progress,
    .save-card-time {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .save-card-progress {
      margin-top: 5px;
    }

    .save-card-time {
      margin-top: 2px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    .save-card-actions {
      display: grid;
      gap: 4px;
      margin-top: auto;
      padding-top: 10px;
    }

    .save-card-button {
      min-width: 0;
      min-height: 27px;
      padding: 4px 3px;
      overflow: hidden;
      color: var(--muted);
      background: rgba(243, 237, 220, .04);
      border: 1px solid rgba(243, 237, 220, .16);
      border-radius: 2px;
      cursor: pointer;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .save-card-button:hover,
    .save-card-button:focus-visible {
      color: var(--ink);
      border-color: var(--jade);
    }

    .save-card-button.primary {
      color: #071117;
      background: var(--jade);
      border-color: rgba(101, 200, 162, .75);
    }

    .save-card-button.subtle {
      color: var(--amber);
      background: rgba(229, 161, 93, .06);
      border-color: rgba(229, 161, 93, .2);
    }

    .save-card-button.unlock {
      color: #071117;
      background: var(--amber);
      border-color: rgba(229, 161, 93, .78);
      white-space: normal;
    }

    .save-card-button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .settings-rule-note {
      margin-top: 10px;
      padding: 8px 9px;
      color: var(--dim);
      background: rgba(243, 237, 220, .025);
      border-left: 2px solid rgba(229, 161, 93, .56);
      font-size: 10px;
      line-height: 1.5;
    }

    .event-prompt {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      align-items: end;
      padding: 15px;
      background: rgba(4, 11, 16, .38);
      pointer-events: none;
    }

    .event-prompt-card {
      padding: 13px;
      background: rgba(8, 20, 27, .96);
      border: 1px solid rgba(229, 161, 93, .52);
      border-left: 2px solid var(--amber);
      border-radius: 4px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .3);
      pointer-events: auto;
      animation: story-dialog-in 180ms ease-out both;
    }

    .event-prompt-kicker {
      color: var(--jade);
      font-size: 9px;
      letter-spacing: .1em;
    }

    .event-prompt-title {
      margin-top: 4px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .event-prompt-copy {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .event-prompt-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .event-prompt-actions button {
      min-height: 38px;
      padding: 7px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    .event-enter-button {
      color: #071118;
      background: var(--jade);
      border: 1px solid transparent;
      font-weight: 700;
    }

    .event-later-button {
      color: var(--ink);
      background: rgba(243, 237, 220, .06);
      border: 1px solid var(--line);
    }

    .overlay-root {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }

    .tutorial-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      pointer-events: none;
    }

    .tutorial-overlay.is-offer {
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4, 11, 16, .72);
      backdrop-filter: blur(5px);
      pointer-events: auto;
    }

    .tutorial-card {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      z-index: 4;
      padding: 14px;
      background: rgba(8, 20, 27, .98);
      border: 1px solid rgba(101, 200, 162, .5);
      border-top: 2px solid var(--jade);
      border-radius: 4px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .46);
      animation: story-dialog-in 160ms ease-out both;
    }

    .tutorial-overlay.is-offer .tutorial-card {
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      width: min(100%, 326px);
    }

    .tutorial-kicker {
      color: var(--jade);
      font-size: 9px;
      letter-spacing: .1em;
      line-height: 1.4;
    }

    .tutorial-title {
      margin-top: 4px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .tutorial-copy {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .tutorial-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
    }

    .tutorial-actions .small-button {
      flex: 1 1 0;
      min-width: 0;
    }

    .tutorial-actions .tutorial-skip {
      color: var(--muted);
      background: rgba(243, 237, 220, .06);
      border-color: var(--line);
    }

    .tutorial-focus {
      position: absolute;
      z-index: 2;
      border: 2px solid var(--amber);
      border-radius: 6px;
      box-shadow: 0 0 0 4px rgba(229, 161, 93, .18), 0 0 24px rgba(229, 161, 93, .42);
      pointer-events: none;
      animation: tutorial-focus-pulse 1.25s ease-in-out infinite;
    }

    .tutorial-focus::after {
      position: absolute;
      inset: -7px;
      content: "";
      border: 1px solid rgba(243, 237, 220, .32);
      border-radius: 9px;
    }

    .tutorial-card,
    .tutorial-blocker {
      pointer-events: auto;
    }

    .tutorial-blocker {
      position: absolute;
      z-index: 3;
      background: rgba(4, 11, 16, .38);
    }

    .tutorial-arrow {
      position: absolute;
      z-index: 3;
      width: 0;
      height: 0;
      border-right: 7px solid transparent;
      border-bottom: 10px solid var(--amber);
      border-left: 7px solid transparent;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .42));
      transform: rotate(180deg);
      pointer-events: none;
      animation: tutorial-arrow-bob 900ms ease-in-out infinite;
    }

    @keyframes tutorial-focus-pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(229, 161, 93, .16), 0 0 18px rgba(229, 161, 93, .28); }
      50% { box-shadow: 0 0 0 7px rgba(229, 161, 93, .24), 0 0 28px rgba(229, 161, 93, .5); }
    }

    @keyframes tutorial-arrow-bob {
      0%, 100% { margin-top: 0; }
      50% { margin-top: 5px; }
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4, 11, 16, .68);
      backdrop-filter: blur(5px);
      pointer-events: auto;
    }

    .modal-card {
      width: min(100%, 326px);
      padding: 16px;
      background: rgba(8, 20, 27, .98);
      border: 1px solid var(--line-strong);
      border-top: 2px solid var(--amber);
      border-radius: 4px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .38);
      animation: story-dialog-in 160ms ease-out both;
    }

    .announcement-overlay {
      padding: 12px;
      background: rgba(2, 8, 13, .82);
    }

    .announcement-card {
      display: flex;
      flex-direction: column;
      width: min(100%, 400px);
      max-height: min(760px, calc(100dvh - 24px));
      padding: 18px;
      border-top-color: var(--jade);
    }

    .announcement-date {
      margin-top: 5px;
      color: var(--dim);
      font-size: 10px;
      line-height: 1.4;
    }

    .announcement-copy {
      min-height: 0;
      margin-top: 12px;

      function resolveAssetReference(value) {
        const source = String(value || "");
        if (!source) return "";
        if (/[\/\\]/.test(source)) return source;
        const basename = source.split("/").pop();
        const key = basename?.replace(/\.png$/g, "") || "";
        return COMMON_ITEM_ART[key.replace(/^item_/, "")] || GENERATED_PORTRAITS[key] || source;
      }

      function releaseArtUrl(value) {
        const source = String(value || "");
        if (!source) return "";
        const basename = source.split(/[\/\\]/).pop() || "";
        const key = basename.replace(/\.[^.]+$/, "");
        if (RELEASE_STORY_ART[key]) return RELEASE_STORY_ART[key];
        if (key.startsWith("portrait_")) return releasePortraitAsset(key);
        return source;
      }

      function assetUrl(value) {
        const source = releaseArtUrl(resolveAssetReference(value));
        if (!source) return "";
        return /^(?:https?:|data:|\/|assets\/|\.\.?\/)/.test(source) ? source : ART + source;
      }

      function releaseBackgroundUrl(value, options = {}) {
        const source = String(value || "");
        const story = Boolean(options.story);
        if (source.includes("bg_outer_courtyard_move")) {
          return story ? STORY_BACKGROUNDS.default : MAP_BACKGROUNDS.outer;
        }
        if (source.includes("bg_lanchuan_gate_dawn")) return RELEASE_BACKGROUNDS.gate;
        if (source.includes("bg_world_lanchuan_region_map")) return MAP_BACKGROUNDS.world;
        if (source.includes("bg_library_action_map_v2")) {
          return story ? STORY_BACKGROUNDS.library : MAP_BACKGROUNDS.library;
        }
        if (source.includes("bg_market_square")) return GENERATED_ART.marketBackground;
        if (source.includes("bg_market_action_map_v2")) {
          return story ? STORY_BACKGROUNDS.market : MAP_BACKGROUNDS.market;
        }
        if (source.includes("bg_rear_mountain_rift")) return GENERATED_ART.rearMountainBackground;
        if (source.includes("bg_rear_mountain_action_map_v2")) {
          return story ? STORY_BACKGROUNDS.rear_mountain : MAP_BACKGROUNDS.rear_mountain;
        }
        if (source.includes("bg_inner_sect_gate")) return GENERATED_ART.innerGateBackground;
        if (source.includes("bg_inner_sect_archive")) return GENERATED_ART.innerArchiveBackground;
        if (source.includes("bg_inner_sect_action_map_v2")) {
          return story ? STORY_BACKGROUNDS.inner_gate : MAP_BACKGROUNDS.inner_sect;
        }
        return value;
      }

      const MapBundleManager = {
        loaded: new Set(),
        loading: new Map(),
        errors: new Map(),
        timeoutMs: 4500,
        loadImage(url) {
          return new Promise((resolve) => {
            const image = new Image();
            let settled = false;
            const finish = (ok, error = "") => {
              if (settled) return;
              settled = true;
              window.clearTimeout(timer);
              resolve({ ok, url, error });
            };
            const timer = window.setTimeout(() => {
              finish(false, "timeout");
            }, this.timeoutMs);
            image.onload = () => finish(true);
            image.onerror = () => finish(false, "error");
            image.src = url;
          });
        },
        async load(bundleId, onProgress) {
          const assets = BUNDLE_MANIFESTS[bundleId] || [];
          if (this.loaded.has(bundleId)) {
            onProgress?.(assets.length, assets.length);
            return { bundleId, loaded: true, cached: true };
          }
          if (this.loading.has(bundleId)) {
            return this.loading.get(bundleId);
          }
          let completed = 0;
          const task = Promise.all(assets.map((url) => this.loadImage(url).then((result) => {
            completed += 1;
            onProgress?.(completed, assets.length, result);
            return result;
          })))
            .then((results) => {
              const failed = results.filter((result) => !result.ok);
              if (failed.length > 0) {
                const error = new Error(
                  `区域资源加载失败：${bundleId}（${failed.length} 项）`,
                );
                error.failedAssets = failed.map((result) => result.url);
                throw error;
              }
              this.loaded.add(bundleId);
              this.errors.delete(bundleId);
              return {
                bundleId,
                loaded: true,
                cached: false,
                optionalMissing: 0,
              };
            })
            .catch((error) => {
              this.loaded.delete(bundleId);
              this.errors.set(bundleId, error);
              throw error;
            })
            .finally(() => {
              this.loading.delete(bundleId);
            });
          this.loading.set(bundleId, task);
          return task;
        },
        retry(bundleId) {
          this.loaded.delete(bundleId);
          this.errors.delete(bundleId);
          return this.load(bundleId);
        },
        release(bundleId) {
          if (!bundleId || bundleId === "world_map" || bundleId === "common_items") {
            return;
          }
          this.loaded.delete(bundleId);
          this.errors.delete(bundleId);
        },
      };

      function getCompanionPortraitUrl(companion) {
        return assetUrl(
          companion?.portrait
            || COMPANION_PORTRAIT_FALLBACKS[companion?.id]
            || "portrait_player_neutral.png",
        );
      }

      function getCompanionPortraitFallbackUrl(companion) {
        return assetUrl(
          COMPANION_PORTRAIT_FALLBACKS[companion?.id]
            || "portrait_player_neutral.png",
        );
      }

      function getCompanionPortraitMarkup(companion, className = "") {
        const source = getCompanionPortraitUrl(companion);
        const fallback = getCompanionPortraitFallbackUrl(companion);
        const emergency = assetUrl("portrait_player_neutral.png");
        const classAttribute = className
          ? ` class="${escapeHtml(className)}"`
          : "";
        return `<img${classAttribute} src="${escapeHtml(source)}" alt="${escapeHtml(companion?.name || "伙伴")}" data-companion-portrait="${escapeHtml(companion?.id || "")}" onerror="if(this.dataset.fallbackApplied){this.src='${emergency}';this.removeAttribute('onerror');}else{this.dataset.fallbackApplied='true';this.src='${fallback}';}">`;
      }

      function getAffixStatKey(affix) {
        if (affix?.stat && AFFIX_STAT_LABELS[affix.stat]) {
          return affix.stat;
        }
        const poolEntry = FORGE_AFFIX_POOL.find((entry) =>
          entry.id === affix?.id
            || (entry.label && entry.label === affix?.label),
        );
        if (poolEntry?.stat) return poolEntry.stat;
        const legacyStat = Object.keys(AFFIX_STAT_LABELS).find((key) =>
          Number.isFinite(Number(affix?.stats?.[key])),
        );
        return legacyStat || LEGACY_AFFIX_STAT_BY_LABEL[affix?.label] || "";
      }

      function isAffixCompatible(affix, slot) {
        return Boolean(affix && slot && EQUIPMENT_SLOTS[slot]);
      }

      function getAffixNumericValue(affix) {
        if (!affix) return 0;
        if (Number.isFinite(Number(affix.percent))) return Number(affix.percent);
        if (Number.isFinite(Number(affix.value))) return Number(affix.value);
        if (affix.stat && Number.isFinite(Number(affix.stats?.[affix.stat]))) {
          return Number(affix.stats[affix.stat]);
        }
        const firstValue = Object.values(affix.stats || {})[0];
        return Number.isFinite(Number(firstValue)) ? Number(firstValue) : 0;
      }

      function getAffixValueTier(affix) {
        if (["green", "blue", "purple", "gold"].includes(affix?.valueTier)) {
          return affix.valueTier;
        }
        const value = getAffixNumericValue(affix);
        const pool = FORGE_AFFIX_POOL.find((entry) =>
          entry.id === affix?.id
          || (entry.stat === affix?.stat && entry.label === affix?.label),
        );
        if (!pool || pool.max <= pool.min) return "blue";
        const ratio = clamp((value - pool.min) / (pool.max - pool.min), 0, 1);
        return ratio >= .97 ? "gold" : ratio >= .72 ? "purple" : ratio >= .42 ? "blue" : "green";
      }

      function renderAffixValue(affix, prefix = "+") {
        const value = getAffixNumericValue(affix);
        const tier = getAffixValueTier(affix);
        const suffix = Number.isFinite(Number(affix?.percent)) ? "%" : "";
        return `<span class="affix-value affix-value-${tier}">${prefix}${value}${suffix}</span>`;
      }

      function getAffixStatLabel(affix) {
        return AFFIX_STAT_LABELS[getAffixStatKey(affix)] || "属性";
      }

      function renderAffixLabel(affix) {
        return `${escapeHtml(affix?.label || "词条")} · ${escapeHtml(getAffixStatLabel(affix))}`;
      }

        return `<span class="affix-chip"><span>${renderAffixLabel(affix)}</span>${renderAffixValue(affix)}</span>`;

        if (!affix || typeof affix !== "object") return affix;
        const normalized = { ...affix };
        const stat = getAffixStatKey(normalized);
        if (stat) normalized.stat = stat;
        if (!Number.isFinite(Number(normalized.percent))) {
          const legacyValue = getAffixNumericValue({ ...normalized, stat });
          if (stat && legacyValue > 0) normalized.percent = legacyValue;
        }
        return normalized;
      }

        const initialIndex = Math.max(
          0,
          PREVIEW_REALMS.findIndex((realm) => realm.id === realmId),
        );
        let currentIndex = initialIndex;
        let currentStage = Math.max(1, Math.floor(Number(stage) || 1));
        while (
          currentStage > PREVIEW_REALMS[currentIndex].maxStage
          && currentIndex < PREVIEW_REALMS.length - 1
        ) {
          currentStage -= PREVIEW_REALMS[currentIndex].maxStage;
          currentIndex += 1;
        }
        const realm = PREVIEW_REALMS[currentIndex];
        return {
          realmId: realm.id,
          realmStage: Math.min(currentStage, realm.maxStage),
        };
      }

        );
        return PREVIEW_REALMS
          .slice(0, index)
          .reduce((total, realm) => total + realm.maxStage, 0)
          + Math.max(
            1,
            Math.min(
              getPreviewRealmDefinition(realmId).maxStage,
              Math.floor(Number(stage) || 1),
            ),
          );

      function normalizePreviewSlot(value) {
        const slotIndex = Math.floor(Number(value));

          && slotIndex < PREVIEW_SAVE_SLOT_COUNT
          ? slotIndex

      function getPreviewProgressPlatform() {
        const platform = window.LampsPlatform;
        return platform
          && typeof platform.saveGameProgress === "function"
          && typeof platform.getGameProgress === "function"
          ? platform
          : null;
      }

      function queuePreviewCloudSave(snapshot) {
        const platform = getPreviewProgressPlatform();
        if (!platform || !snapshot) return;
        previewCloudSavePending = {
          format: "xiuxian-preview-save-v1",
          slotIndex: normalizePreviewSlot(snapshot.slotIndex) ?? 0,
          savedAt: Number(snapshot.savedAt) || Date.now(),
          revision: Number(snapshot.revision) || Number(snapshot.savedAt) || Date.now(),
          snapshot,
        };
        if (previewCloudSaveTimer) return;
        previewCloudSaveTimer = window.setTimeout(() => {
          previewCloudSaveTimer = 0;
          void flushPreviewCloudSave();
        }, 260);
      }

      function flushPreviewCloudSave() {
        if (previewCloudSaveInFlight) return previewCloudSaveInFlight;
        const pending = previewCloudSavePending;
        if (!pending) return Promise.resolve(true);
        previewCloudSavePending = null;
        const platform = getPreviewProgressPlatform();
        if (!platform) return Promise.resolve(false);
        previewCloudSaveInFlight = platform.saveGameProgress(pending)
          .then((result) => result?.ok === true)
          .catch(() => false)
          .finally(() => {
            previewCloudSaveInFlight = null;
            if (previewCloudSavePending) void flushPreviewCloudSave();
          });
        return previewCloudSaveInFlight;
      }

      async function syncPreviewCloudState() {
        if (previewCloudSyncStarted) return;
        previewCloudSyncStarted = true;
        if (PREVIEW_QA_STONES !== null) return;
        const platform = getPreviewProgressPlatform();
        if (!platform) return;
        let result;
        try {
          result = await platform.getGameProgress();
        } catch (error) {
          return;
        }
        if (!result?.ok) return;
        const record = result.data?.record;
        let remote = record?.gamePayload ?? result.data?.gamePayload;
        if (remote?.game_payload) remote = remote.game_payload;
        if (
          !remote
          || remote.format !== "xiuxian-preview-save-v1"
          || !remote.snapshot
          || remote.snapshot.version !== 2
        ) return;
        const remoteSlot = normalizePreviewSlot(remote.slotIndex);
        if (remoteSlot === null) return;
        const previousActiveSlot = state.activeSaveSlot;
        if (remoteSlot === 2 && !isPreviewSlotUnlocked(remoteSlot)) {
          unlockPreviewThirdSlot();
        }
        if (!isPreviewSlotUnlocked(remoteSlot)) return;
        state.activeSaveSlot = remoteSlot;
        try {
          window.localStorage.setItem(
            PREVIEW_ACTIVE_SLOT_KEY,
            String(remoteSlot),
          );
        } catch (error) {
          return;
        }
        const remoteSavedAt = Number(remote.savedAt)
          || Date.parse(record?.updatedAt || "")
          || 0;
        const remoteRevision = Number(remote.revision) || remoteSavedAt;
        const local = readPreviewSave(remoteSlot);
        const localSavedAt = Number(local?.savedAt) || 0;
        const localRevision = Number(local?.revision) || localSavedAt;
        const remoteIsNewer = !local
          || remoteSavedAt > localSavedAt
          || (
            remoteSavedAt === localSavedAt
            && remoteRevision > localRevision
          );
        if (remoteIsNewer) {
          const snapshot = {
            ...remote.snapshot,
            slotIndex: remoteSlot,
            savedAt: remoteSavedAt || Date.now(),
            revision: remoteRevision || remoteSavedAt || Date.now(),
          };
          try {
            window.localStorage.setItem(
              getPreviewSaveKey(remoteSlot),
              JSON.stringify(snapshot),
            );
            window.localStorage.setItem(
              PREVIEW_ACTIVE_SLOT_KEY,
              String(remoteSlot),
            );
          } catch (error) {
            return;
          }
          state.activeSaveSlot = remoteSlot;
          if (!state.adBusy) {
            restorePreviewState(remoteSlot);
            prepareInitialTutorialOffer();
            render();
          }
          return;
        }
        if (local && (localSavedAt > remoteSavedAt || localRevision > remoteRevision)) {
          queuePreviewCloudSave(local);
        }
        if (
          remoteSlot !== previousActiveSlot
          && local
          && !state.adBusy
        ) {
          restorePreviewState(remoteSlot);
          prepareInitialTutorialOffer();
          render();
        }
      }

        } catch (error) {

        const targetSlot = normalizePreviewSlot(slotIndex);

        getPreferredFormat() {
          if (this.format) return this.format;

          const canPlayMp3 = Boolean(probe.canPlayType?.("audio/mpeg"));
          const canPlayOgg = Boolean(probe.canPlayType?.("audio/ogg; codecs=vorbis"));

      const MAX_ENERGY = 50;

      const ENERGY_REGEN_INTERVAL_MS = 86400000 / ENERGY_REGEN_PER_DAY;
      const DAILY_ENERGY_AD_LIMIT = 3;
      const DAILY_ENERGY_AD_REWARD = 20;
      const FORGE_AD_REWARD_COUNT = 3;
      function applyPassiveEnergyRegen(now = Date.now()) {
        const current = Math.max(0, Number(state.energy) || 0);
        if (current >= MAX_ENERGY) {
          state.energyRegenAt = now;
          return false;
        }
        let last = Number(state.energyRegenAt);
        if (!Number.isFinite(last) || last <= 0 || last > now) {
          last = now;
          state.energyRegenAt = now;
          return false;
        }
        const steps = Math.floor((now - last) / ENERGY_REGEN_INTERVAL_MS);
        if (steps <= 0) return false;
        const next = Math.min(MAX_ENERGY, current + steps);
        state.energy = next;
        state.energyRegenAt = next >= MAX_ENERGY
          ? now
          : last + steps * ENERGY_REGEN_INTERVAL_MS;
        return next !== current;
      }

          if (isBrowserPreview) {

            return {
              completed: true,

          AudioService.play("loading");

                : "广告观看完成，奖励已发放",
              "reward",

            return { status: "completed", preview: result.preview === true };
          } catch (error) {

              error.message.trim()

      function persistPreviewState() {
        const slotIndex = normalizePreviewSlot(arguments[0]) ?? state.activeSaveSlot;
        const savedAt = Date.now();
        try {
          const snapshot = {
            ...getPreviewSaveSnapshot(),
            slotIndex,
            savedAt,
            revision: savedAt,
          };
          state.activeSaveSlot = slotIndex;
          state.lastSavedAt = savedAt;
          window.localStorage.setItem(
            getPreviewSaveKey(slotIndex),
            JSON.stringify(snapshot),
          );
          window.localStorage.setItem(
            PREVIEW_ACTIVE_SLOT_KEY,
            String(slotIndex),
          );
          queuePreviewCloudSave(snapshot);
        } catch (error) {
          console.warn("预览存档写入失败", error);
        }
      }

      function schedulePreviewSave() {
        if (previewSaveTimer) return;
        previewSaveTimer = window.setTimeout(() => {
          previewSaveTimer = 0;
          persistPreviewState();
        }, 220);
      }

              existing.affixes = item.affixes;
            }
          });
          state.inventory = [...mergedInventory.values()];
        }
        state.equipment = {
          ...state.equipment,
          ...(saved.equipment && typeof saved.equipment === "object" ? saved.equipment : {}),

        });
        const restoredCombat = state.battleActive

          ? Number.isFinite(saved.battleMana)

      function writePreviewSnapshotToSlot(slotIndex) {
        const targetSlot = normalizePreviewSlot(slotIndex);
        if (targetSlot === null || !isPreviewSlotUnlocked(targetSlot)) return 0;
        const savedAt = Date.now();
        const snapshot = {
          ...getPreviewSaveSnapshot(),
          slotIndex: targetSlot,
          savedAt,
          revision: savedAt,
        };
        try {
          window.localStorage.setItem(
            getPreviewSaveKey(targetSlot),
            JSON.stringify(snapshot),
          );
          if (targetSlot === state.activeSaveSlot) {
            queuePreviewCloudSave(snapshot);
          }
          return savedAt;
        } catch (error) {
          console.warn("预览存档写入失败", error);
          return 0;

        if (PREVIEW_QA_STONES === null) return;

      function requestManualSaveToSlot(slotIndex) {
        const targetSlot = normalizePreviewSlot(slotIndex);
        if (targetSlot === null || !isPreviewSlotUnlocked(targetSlot)) {
          showToast("存档位 3 未解锁，请完整观看广告", "error");
          return;

          requestNewPreviewSave(targetSlot);

        if (targetSlot === null || state.adBusy) return;
        if (!isPreviewSlotUnlocked(targetSlot)) {
          showToast("存档位 3 未解锁，请完整观看广告", "error");
          return;
