      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderHookStrip({ compact = false, root = false } = {}) {
        return `
          <section class="hook-strip ${compact ? "is-compact" : ""} ${root ? "is-root" : ""}" aria-label="本章未解问题">
            <div class="hook-strip-heading">
              <span>${root ? "入山前留一眼" : "本章未解"}</span>
              <strong>${root ? "牌边那行湿墨还没干" : "走近之后，纸面才会留下新东西"}</strong>
            </div>
            <div class="hook-strip-list">
              ${FIRST_CHAPTER_HOOKS.map((hook) => `
                <div class="hook-chip">
                  <span class="hook-chip-index">${escapeHtml(hook.index)}</span>
                  <strong class="hook-chip-title">${escapeHtml(hook.title)}</strong>
                  <span class="hook-chip-copy">${escapeHtml(hook.copy)}</span>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      function renderEquipmentImage(item, className = "", alt = "") {
        const slotFallback = item?.slot ? EQUIPMENT_ART_PATHS[item.slot] || "" : "";
        const fallbackIcon = resolveAssetReference(item?.icon);
        const primary = assetUrl(item?.artPath || slotFallback || fallbackIcon);
        const fallback = assetUrl(slotFallback || fallbackIcon);
        const fallbackHandler = primary && fallback && primary !== fallback
          ? ` onerror="this.onerror=null;this.src='${escapeHtml(fallback)}'"`
          : "";
        const classAttr = className ? ` class="${escapeHtml(className)}"` : "";
        return `<img${classAttr} src="${escapeHtml(primary)}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async"${fallbackHandler}>`;
      }

      function pick(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function rollGrade() {
        const value = Math.random() * 100;
        if (value < 2) return ROOT_POOL[5];
        if (value < 12) return pick(ROOT_POOL.slice(3, 5));
        if (value < 42) return pick(ROOT_POOL.slice(1, 3));
        return ROOT_POOL[0];
      }

      function rollCandidates(guaranteeRare = false) {
        const results = [];
        const seen = new Set();
        while (results.length < 3) {
          const grade = rollGrade();
          const signature = grade.grade + grade.elements;
          if (seen.has(signature)) continue;
          seen.add(signature);
          results.push({
            ...grade,
            id: "root_" + Date.now() + "_" + results.length,
          });
        }
        if (
          guaranteeRare
          && !results.some((candidate) =>
            candidate.grade === "地灵根" || candidate.grade === "天灵根"
          )
        ) {
          const rare = pick(ROOT_POOL.slice(3, 5));
          results[0] = {
            ...rare,
            id: "root_" + Date.now() + "_0",
          };
        }
        return results;
      }

      function getRootRerollState() {
        const rerolls = Math.max(
          0,
          Math.min(4, Math.floor(Number(state.rootRerolls) || 0)),
        );
        return {
          freeRemaining: Math.max(0, 3 - rerolls),
          adRequired: rerolls >= 3 && rerolls < 4,
          canReroll: rerolls < 4,
        };
      }

      function applyRootReroll(guaranteeRare = false) {
        const rerollState = getRootRerollState();
        if (!rerollState.canReroll) {
          showToast("灵根刷新次数已用尽", "error");
          return false;
        }
        if (guaranteeRare !== rerollState.adRequired) {
          return false;
        }
        state.drawn = true;
        state.candidates = rollCandidates(guaranteeRare);
        state.candidate = null;
        state.rootRerolls = Math.min(4, state.rootRerolls + 1);
        persistPreviewState();
        return true;
      }

      function requestRootReroll() {
        if (state.adBusy) {
          showToast("广告正在加载，请稍候", "loading");
          return;
        }
        const rerollState = getRootRerollState();
        if (!rerollState.canReroll) {
          showToast("灵根刷新次数已用尽", "error");
          return;
        }
        if (!rerollState.adRequired) {
          if (applyRootReroll(false)) {
            render();
            showToast("重新抽取完成");
          }
          return;
        }
        void AdService.showRewarded({
          placement: "root_reroll_4th",
          onReward: () => {
            applyRootReroll(true);
          },
        });
      }

      function showToast(message, tone = "tap") {
        toast.textContent = message;
        toast.classList.toggle(
          "forge-decision-clearance",
          Boolean(
            state.forgeOpen
            && state.forgePhase === "settled"
            && state.forgeResult
            && !state.forgeResult.saved,
          ),
        );
        toast.classList.add("visible");
        AudioService.play(tone);
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          toast.classList.remove("visible", "forge-decision-clearance");
        }, 2000);
      }

      function updateBootLoader(progress, copy) {
        const value = Math.max(0, Math.min(100, Math.round(progress)));
        bootLoaderProgress.style.width = `${Math.max(4, value)}%`;
        bootLoaderMeta.textContent = `${value}%`;
        if (copy) bootLoaderCopy.textContent = copy;
      }

      function getBootBundleIds() {
        if (!state.rootLocked) return [];
        if (state.mapView === "world") {
          return ["world_map", "common_items", "character_portraits"];
        }
        const activeRegion = REGION_DATA[state.regionId];
        return [
          "common_items",
          "character_portraits",
          activeRegion?.bundle || "map_outer",
        ];
      }

      async function bootPreview() {
        const bundleIds = [...new Set(getBootBundleIds())];
        const bundleProgress = new Map(
          bundleIds.map((bundleId) => [bundleId, 0]),
        );
        const bundleTotals = new Map(
          bundleIds.map((bundleId) => [
            bundleId,
            Math.max(1, (BUNDLE_MANIFESTS[bundleId] || []).length),
          ]),
        );
        const directAsset = !state.rootLocked ? RELEASE_BACKGROUNDS.outer : "";
        const total = Math.max(
          1,
          [...bundleIds].reduce((sum, bundleId) => sum + bundleTotals.get(bundleId), 0)
            + (directAsset ? 1 : 0),
        );

        const reportProgress = (copy) => {
          const complete = [...bundleIds].reduce(
            (sum, bundleId) => sum + Math.min(bundleProgress.get(bundleId) || 0, bundleTotals.get(bundleId) || 0),
            directAsset ? 0 : 0,
          ) + (directAsset ? (bundleProgress.get("__direct__") || 0) : 0);
          updateBootLoader((complete / total) * 100, copy);
        };

        updateBootLoader(2, "检查运行环境…");
        try {
          const tasks = [];
          if (directAsset) {
            bundleProgress.set("__direct__", 0);
            tasks.push(
              MapBundleManager.loadImage(directAsset).then((result) => {
                bundleProgress.set("__direct__", 1);
                reportProgress(result.ok ? "首屏画面已准备" : "首屏画面稍后补齐");
                return result;
              }),
            );
          }
          bundleIds.forEach((bundleId) => {
            tasks.push(
              MapBundleManager.load(
                bundleId,
                (completed, assetTotal) => {
                  bundleProgress.set(bundleId, Math.min(completed, assetTotal));
                  reportProgress(
                    bundleId === "common_items"
                      ? "整理角色与物品资源…"
                      : "准备当前地图资源…",
                  );
                },
              ),
            );
          });
          const results = await Promise.allSettled(tasks);
          const failed = results.filter((result) => result.status === "rejected");
          if (failed.length > 0) {
            updateBootLoader(100, "部分资源稍后补齐，不影响继续进入");
          } else {
            updateBootLoader(100, "首屏资源已准备");
          }
        } catch (error) {
          console.warn("首屏资源准备失败", error);
          updateBootLoader(100, "部分资源稍后补齐，不影响继续进入");
        }

        render();
        await new Promise((resolve) => window.setTimeout(resolve, 120));
        bootLoader.classList.add("is-ready");
        document.body.classList.remove("is-booting");
        window.setTimeout(() => bootLoader.remove(), 280);
      }

      function preloadCoreBundles() {
        return Promise.allSettled([
          MapBundleManager.load("world_map"),
          MapBundleManager.load("common_items"),
          MapBundleManager.load("character_portraits"),
          MapBundleManager.load("map_outer"),
        ]).then((results) => {
          const failed = results.filter((result) => result.status === "rejected");
          if (failed.length > 0) {
            console.warn("公共资源预加载失败", failed);
          }
          return results;
        });
      }

      async function enterRegion(regionId) {
        const region = REGION_DATA[regionId];
        if (!region) return;
        if (!region.unlocked()) {
          const accessHint = getRegionAccessHint(regionId);
          showToast(
            accessHint
              ? `未满足：${accessHint}`
              : `区域未开放：${region.name}`,
            "warning",
          );
          return;
        }
        if (state.bundleLoading) {
          showToast("正在加载区域资源");
          return;
        }
        if (state.regionId === regionId && state.mapView === "local") {
          showToast("当前区域：" + region.name);
          return;
        }

        const previousBundle = state.activeMapBundle;
        state.bundleLoading = true;
        state.bundleTarget = region.name;
        state.bundleError = "";
        state.bundleRetryBundle = region.bundle;
        render();
        try {
          await MapBundleManager.load(region.bundle);
        } catch (error) {
          state.bundleLoading = false;
          state.bundleError = "区域资源加载失败，可重试或返回区域总览。";
          state.bundleRetryBundle = region.bundle;
          AudioService.play("error");
          render();
          console.warn("区域资源加载失败", region.bundle, error);
          return;
        }
        if (previousBundle && previousBundle !== region.bundle) {
          MapBundleManager.release(previousBundle);
        }
        state.activeMapBundle = region.bundle;
        state.regionId = regionId;
        state.selectedRegionId = regionId;
        state.mapView = "local";
        state.mapPanInitialized = false;
        state.mapPanUserAdjusted = false;
        state.regionLocationId = "";
        state.nearbyRegionLocationId = "";
        state.marketModal = "";
        const regionLocations = REGION_LOCATION_DATA[regionId] || {};
        const regionStart = Object.values(regionLocations)[0];
        if (regionStart) {
          state.regionLocationId = regionStart.id;
          state.nearbyRegionLocationId = regionStart.id;
          state.playerX = regionStart.x;
          state.playerY = regionStart.y;
        }
        if (["library", "market"].includes(regionId)) {
          state.location = regionId;
        } else if (regionId === "outer") {
          state.location = "gate";
        }
        state.bundleLoading = false;
        state.bundleTarget = "";
        state.bundleError = "";
        state.bundleRetryBundle = "";
        render();
        showToast("已进入：" + region.name, "confirm");
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function applyMapPan(stage, x, y) {
        const world = stage?.querySelector(".map-world");
        if (!world) return;
        const maxX = Math.max(0, world.offsetWidth - stage.clientWidth);
        const maxY = Math.max(0, world.offsetHeight - stage.clientHeight);
        state.mapPanX = clamp(x, -maxX, 0);
        state.mapPanY = clamp(y, -maxY, 0);
        world.style.transform = `translate3d(${state.mapPanX}px, ${state.mapPanY}px, 0)`;
      }

      function centerMapOnPlayer(stage, force = false) {
        const world = stage?.querySelector(".map-world");
        if (!world) return;
        if (!force && state.mapPanUserAdjusted) return;
        const centeredX = stage.clientWidth / 2 - world.offsetWidth * state.playerX / 100;
        const centeredY = stage.clientHeight / 2 - world.offsetHeight * state.playerY / 100;
        applyMapPan(stage, centeredX, centeredY);
      }

      function updatePlayerMarker() {
        const marker = content.querySelector(".player-marker");
        if (!marker) return;
        marker.style.left = state.playerX + "%";
        marker.style.top = state.playerY + "%";
      }

      function setPlayerVisual(walking, row, frame, facingRight) {
        const marker = content.querySelector(".player-marker");
        if (!marker) return;
        marker.style.backgroundImage = `url("${ART}${walking ? "player_walk_4dir.png" : "player_idle_4dir.png"}")`;
        marker.style.backgroundPosition = `${(frame / 3) * 100}% ${(row / 3) * 100}%`;
        marker.style.transform = `translate(-50%, -50%) scaleX(${facingRight ? -1 : 1})`;
        marker.classList.toggle("walking", walking);
      }

      function getRegionLocations(regionId = state.regionId) {
        return REGION_LOCATION_DATA[regionId] || {};
      }

      function getRegionUnlockTaskId(regionId) {
        return {
          market: "main_intro",
          library: "main_chapter2",
          rear_mountain: "main_chapter3",
          inner_sect: "main_chapter6",
        }[regionId] || null;
      }

      function getRegionAccessHint(regionId) {
        const taskId = getRegionUnlockTaskId(regionId);
        if (!taskId || isTaskUnlocked(taskId) || isTaskCompleted(taskId)) return "";
        return getTaskMissingRequirementText(taskId);
      }

      function isOuterLocationUnlocked(locationId) {
        if (state.devAllMaps) return true;
        if (locationId === "market") {
          return Boolean(state.unlocked.market || isTaskUnlocked("main_intro") || isTaskCompleted("main_intro"));
        }
        if (locationId === "library") {
          return Boolean(REGION_DATA.library?.unlocked());
        }
        return Boolean(LOCATION_DATA[locationId]?.unlocked);
      }

      function getOuterLocationLockReason(locationId) {
        const regionId = locationId === "market"
          ? "market"
          : locationId === "library"
            ? "library"
            : null;
        const hint = regionId ? getRegionAccessHint(regionId) : "";
        return hint ? `未满足：${hint}` : "未开放";
      }

      function isRegionLocationUnlocked(location) {
        return Boolean(location && (state.devAllMaps || location.unlocked()));
      }

      function getRegionLocationStatus(location) {
        if (!location) return "状态未知";
        if (!isRegionLocationUnlocked(location)) return "未开放";
        return typeof location.status === "function" ? location.status() : "已开放";
      }

      function isNearLocation(locationId, threshold = 5) {
        const location = LOCATION_DATA[locationId];
        if (!location) return false;
        return Math.hypot(location.x - state.playerX, location.y - state.playerY) <= threshold;
      }

      function getNearbyRegionLocation() {
        if (state.regionId === "outer" || !state.nearbyRegionLocationId) return null;
        const location = getRegionLocations()[state.nearbyRegionLocationId];
        return isRegionLocationUnlocked(location) ? location : null;
      }

      function getNearbyOuterLocation() {
        if (state.regionId !== "outer") return null;
        let nearest = null;
        let nearestDistance = Number.POSITIVE_INFINITY;
        Object.entries(LOCATION_DATA).forEach(([id, data]) => {
          if (!isOuterLocationUnlocked(id)) return;
          const distance = Math.hypot(data.x - state.playerX, data.y - state.playerY);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearest = { ...data, id };
          }
        });
        return nearestDistance <= 5 ? nearest : null;
      }

      function restoreNearbyLocationFromPosition() {
        if (state.regionId === "outer") {
          let nearestId = "";
          let nearestDistance = Number.POSITIVE_INFINITY;
          Object.entries(LOCATION_DATA).forEach(([id, data]) => {
            if (!isOuterLocationUnlocked(id)) return;
            const distance = Math.hypot(data.x - state.playerX, data.y - state.playerY);
            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestId = id;
            }
          });
          state.nearbyOuterLocationId = nearestDistance <= 5 ? nearestId : "";
          state.nearbyGarden = state.nearbyOuterLocationId === "garden";
          state.herbGardenOpen = false;
          return;
        }

        let nearestId = "";
        let nearestDistance = Number.POSITIVE_INFINITY;
        Object.entries(getRegionLocations()).forEach(([id, location]) => {
          if (!isRegionLocationUnlocked(location)) return;
          const distance = Math.hypot(location.x - state.playerX, location.y - state.playerY);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestId = id;
          }
        });
        state.nearbyRegionLocationId = nearestDistance <= 5 ? nearestId : "";
        if (nearestDistance <= 5 && nearestId) {
          state.regionLocationId = nearestId;
        }
      }

      function syncNearbyInteractionUi() {
        const gardenSlot = content.querySelector("[data-map-nearby-panel]");
        if (gardenSlot) gardenSlot.innerHTML = renderHerbGardenPanel();
        const nearbySlot = content.querySelector("[data-nearby-location-prompt]");
        if (nearbySlot) nearbySlot.innerHTML = renderNearbyLocationPrompt();
      }

      function enterNearbyStory(locationId) {
        const pendingEvent = state.pendingEvent?.locationId === locationId
          ? state.pendingEvent
          : null;
        const event = pendingEvent || getLocationEvent(locationId);
        if (!event) {
          showToast("当前地点暂无新事件");
          return;
        }
        state.pendingEvent = event;
        enterPendingEvent();
      }

      function renderNearbyLocationPrompt() {
        const location = getNearbyRegionLocation() || getNearbyOuterLocation();
        const challenges = getNearbyPveChallenges();
        if ((!location && !challenges.length) || state.storyActive || state.battleActive || state.marketModal) return "";
        if (
          state.herbGardenOpen
          && state.regionId === "outer"
          && location?.id === "garden"
        ) {
          return "";
        }

        const market = location && state.regionId === "market" ? MARKET_PRODUCTS[location.id] : null;
        const storyLocationId = location?.eventId || location?.id || "";
        const availableEvent = storyLocationId ? getLocationEvent(storyLocationId) : null;
        const pendingEvent = storyLocationId
          && state.pendingEvent?.locationId === storyLocationId
          ? state.pendingEvent
          : null;
        const actionButtons = [];
        if (pendingEvent || availableEvent) {
          actionButtons.push(`<button class="small-button" type="button" data-nearby-story="${escapeHtml(storyLocationId)}">剧情</button>`);
        }
        challenges.forEach((challenge) => {
          actionButtons.push(`<button class="small-button" type="button" data-pve-start="${escapeHtml(challenge.id)}">PVE挑战</button>`);
        });
        if (location?.id === "garden" && state.regionId === "outer") {
          actionButtons.push(`<button class="small-button" type="button" data-nearby-action="garden">交互</button>`);
        }
        if (market) {
          actionButtons.push(`<button class="small-button" type="button" data-market-open="${escapeHtml(location.id)}">摊位</button>`);
        }
        if (location && !actionButtons.length) {
          if (state.regionId === "outer" && ["market", "library"].includes(location.id)) {
            actionButtons.push(`<button class="small-button" type="button" data-region-enter-nearby="${escapeHtml(location.id)}">进入区域</button>`);
          } else if (state.regionId !== "outer" && location.id === "entrance") {
            actionButtons.push(`<button class="small-button" type="button" data-world-map>返回区域</button>`);
          } else {
            actionButtons.push(`<button class="small-button" type="button" data-location-inspect="${escapeHtml(location.id)}">查看</button>`);
          }
        }
        const promptTitle = location?.name || challenges[0]?.title || "附近地点";
        const challengeCosts = [...new Set(challenges.map((challenge) => Number(challenge.cost || 0)))];
        const promptDescription = [
          location?.description,
          challenges.length
            ? `抵达后选择“PVE挑战”进入对战 · 消耗 ${challengeCosts.join(" / ")} 点灵力`
            : "",
        ].filter(Boolean).join(" · ");
        const hasOptions = actionButtons.length > 1;
        const isInteractive = actionButtons.length > 0;
        const kicker = challenges.length
          ? location
            ? "可执行事项 · PVE挑战"
            : "附近PVE挑战"
          : isInteractive
            ? "可执行事项"
            : "附近地点";
        return `
          <section class="nearby-location-prompt ${location?.id === "garden" && state.regionId === "outer" ? "is-garden" : ""} ${isInteractive ? "is-interactive" : ""} ${challenges.length ? "is-challenge" : ""} ${hasOptions ? "has-options" : ""}" aria-live="polite">
            <div class="nearby-location-copy">
              <span class="nearby-location-kicker">${kicker}</span>
              <strong>${escapeHtml(promptTitle)}</strong>
              ${promptDescription ? `<span>${escapeHtml(promptDescription)}</span>` : ""}
            </div>
            ${actionButtons.length ? `<div class="nearby-location-actions">${actionButtons.join("")}</div>` : ""}
          </section>
        `;
      }

      function activateRegionLocation(locationId) {
        const location = getRegionLocations()[locationId];
        if (!location) return;
        if (!isRegionLocationUnlocked(location)) {
          const taskId = getRegionUnlockTaskId(state.regionId);
          showToast(`地点未开放：${location.name}${taskId ? `；未满足：${getTaskMissingRequirementText(taskId)}` : ""}`);
          return;
        }

        state.regionLocationId = locationId;
        state.nearbyRegionLocationId = locationId;
        state.playerX = location.x;
        state.playerY = location.y;
        state.mapPanInitialized = false;
        state.mapPanUserAdjusted = false;

        if (location.eventId) {
          if (queueLocationEvent(location.eventId)) {
            return;
          }
          render();
          showToast(
            location.future
              ? `地点未开放：${location.name}`
              : `已抵达：${location.name}`,
          );
          return;
        }

        if (location.clueId && !state.clues.includes(location.clueId)) {
          state.clues.push(location.clueId);
          state.mapPanInitialized = false;
          render();
          showToast(location.clueText || "调查完成，已获得线索");
          return;
        }

        render();
        showToast("已抵达：" + location.name);
      }

      function updatePlayerMovementVisual(deltaTime, vectorX, vectorY) {
        const marker = content.querySelector(".player-marker");
        if (!marker) return;

        const horizontal = Math.abs(vectorX) >= Math.abs(vectorY);
        if (horizontal) {
          state.playerMoveRow = 1;
          state.playerFacingRight = vectorX > 0;
        } else {
          state.playerMoveRow = vectorY < 0 ? 3 : 0;
          state.playerFacingRight = false;
        }
        state.playerFrameElapsed += deltaTime;
        state.playerFrameIndex = Math.floor(state.playerFrameElapsed / 145) % 4;
        setPlayerVisual(
          true,
          state.playerMoveRow,
          state.playerFrameIndex,
          state.playerFacingRight,
        );
      }

      function updateNearbyLocation() {
        const stage = content.querySelector(".map-stage");
        if (state.regionId !== "outer") {
          const regionLocations = getRegionLocations();
          let nearestId = state.regionLocationId;
          let nearestDistance = Number.POSITIVE_INFINITY;

          Object.entries(regionLocations).forEach(([id, data]) => {
            if (!isRegionLocationUnlocked(data)) return;
            const distance = Math.hypot(data.x - state.playerX, data.y - state.playerY);
            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestId = id;
            }
          });

          const nextNearbyId = nearestDistance <= 5 ? nearestId : "";
          if (nextNearbyId !== state.nearbyRegionLocationId) {
            state.nearbyRegionLocationId = nextNearbyId;
            syncNearbyInteractionUi();
          }
          if (nearestDistance <= 5 && nearestId && nearestId !== state.regionLocationId) {
            state.regionLocationId = nearestId;
            const plate = content.querySelector(".map-nameplate");
            if (plate) {
              plate.textContent = state.regionId === "library"
                ? "藏经楼 · " + regionLocations[nearestId].name
                : REGION_DATA[state.regionId].name + " · " + regionLocations[nearestId].name;
            }
            const nearby = regionLocations[nearestId];
            if (nearby.eventId && state.eventTriggerMode === "auto") {
              queueLocationEvent(nearby.eventId);
              return;
            }
          }
          if (stage) {
            centerMapOnPlayer(stage);
          }
          return;
        }

        let nearestId = state.location;
        let nearestDistance = Number.POSITIVE_INFINITY;

        Object.entries(LOCATION_DATA).forEach(([id, data]) => {
          const locked = id === "market"
            ? !state.unlocked.market
            : id === "library"
              ? !state.unlocked.library
              : !data.unlocked;
          if (locked) return;
          const distance = Math.hypot(data.x - state.playerX, data.y - state.playerY);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestId = id;
          }
        });

        if (nearestDistance <= 5 && nearestId !== state.location) {
          state.location = nearestId;
          updateHeader();
          const plate = content.querySelector(".map-nameplate");
          if (plate) {
            plate.textContent = "岚川院 · " + LOCATION_DATA[nearestId].name;
          }
          if (
            nearestId === "west" &&
            !state.storyStarted &&
            !isTaskCompleted("main_intro")
          ) {
            startMainStory();
            return;
          }
        }
        if (stage) {
          centerMapOnPlayer(stage);
        }
        const nextNearbyLocationId = nearestDistance <= 5 ? nearestId : "";
        const nextNearbyGarden = nextNearbyLocationId === "garden";
        const nearbyLocationChanged = nextNearbyLocationId !== state.nearbyOuterLocationId;
        state.nearbyGarden = nextNearbyGarden;
        if (!nextNearbyGarden) {
          state.herbGardenOpen = false;
        }
        if (nearbyLocationChanged) {
          state.nearbyOuterLocationId = nextNearbyLocationId;
          syncNearbyInteractionUi();
        }
      }

      function movePlayerByJoystick(deltaTime) {
        if (state.joystickPointerId === null || state.tab !== "map" || state.moving) {
          state.joystickAnimationId = 0;
          return;
        }

        // Manual panning is useful while the player is idle, but the next
        // movement should always hand control back to the follow camera.
        const resumeCameraFollow = state.mapPanUserAdjusted;
        state.mapPanUserAdjusted = false;
        const speed = PREVIEW_PLAYER_MOVE_SPEED * deltaTime;
        state.playerX = clamp(state.playerX + state.joystickVectorX * speed, 8, 92);
        state.playerY = clamp(state.playerY + state.joystickVectorY * speed, 10, 90);
        updatePlayerMovementVisual(deltaTime, state.joystickVectorX, state.joystickVectorY);
        updatePlayerMarker();
        if (resumeCameraFollow) {
          const stage = content.querySelector(".map-stage");
          if (stage) {
            centerMapOnPlayer(stage, true);
          }
        }
        updateNearbyLocation();
        schedulePreviewSave();
        state.joystickAnimationId = window.requestAnimationFrame((time) => {
          const previous = state.joystickLastTime || time;
          state.joystickLastTime = time;
          movePlayerByJoystick(Math.min(40, time - previous));
        });
      }

      function setJoystickVector(event, joystick) {
        const rect = joystick.getBoundingClientRect();
        const radius = rect.width / 2;
        const maxDistance = radius - 19;
        const centerX = rect.left + radius;
        const centerY = rect.top + radius;
        const rawX = event.clientX - centerX;
        const rawY = event.clientY - centerY;
        const distance = Math.hypot(rawX, rawY);
        const ratio = distance > maxDistance ? maxDistance / distance : 1;
        const x = rawX * ratio;
        const y = rawY * ratio;
        const normalizedDistance = Math.min(1, distance / maxDistance);
        const deadZone = 0.14;
        const activeDistance = normalizedDistance <= deadZone
          ? 0
          : (normalizedDistance - deadZone) / (1 - deadZone);
        const vectorScale = distance === 0 ? 0 : activeDistance / normalizedDistance;
        state.joystickVectorX = (x / maxDistance) * vectorScale;
        state.joystickVectorY = (y / maxDistance) * vectorScale;
        const thumb = joystick.querySelector(".joystick-thumb");
        if (thumb) {
          thumb.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        }
      }

      function resetJoystick(joystick) {
        state.joystickPointerId = null;
        state.joystickVectorX = 0;
        state.joystickVectorY = 0;
        state.joystickLastTime = 0;
        if (state.joystickAnimationId) {
          window.cancelAnimationFrame(state.joystickAnimationId);
          state.joystickAnimationId = 0;
        }
        joystick?.classList.remove("is-active");
        const thumb = joystick?.querySelector(".joystick-thumb");
        if (thumb) {
          thumb.style.transform = "translate(-50%, -50%)";
        }
        state.playerFrameElapsed = 0;
        state.playerFrameIndex = 0;
        setPlayerVisual(false, state.playerMoveRow, 0, state.playerFacingRight);
      }

      function layoutMapWorld() {
        const stage = content.querySelector(".map-stage");
        const world = content.querySelector(".map-world");
        if (!stage || !world) return;

        const worldWidth = Math.max(Math.round(stage.clientWidth * 1.62), 620);
        const worldHeight = Math.max(Math.round(stage.clientHeight * 1.46), 820);
        world.style.width = worldWidth + "px";
        world.style.height = worldHeight + "px";

        if (!state.mapPanInitialized) {
          const mainLocation = state.regionId === "outer"
            ? null
            : Object.values(getRegionLocations())
              .find((location) => location.kind === "main" && isRegionLocationUnlocked(location));
          const focusX = mainLocation
            ? (state.playerX + mainLocation.x) / 2
            : state.playerX;
          const focusY = mainLocation
            ? (state.playerY + mainLocation.y) / 2
            : state.playerY;
          const centeredX = stage.clientWidth / 2 - worldWidth * focusX / 100;
          const centeredY = stage.clientHeight / 2 - worldHeight * focusY / 100;
          state.mapPanInitialized = true;
          applyMapPan(stage, centeredX, centeredY);
          return;
        }

        applyMapPan(stage, state.mapPanX, state.mapPanY);
      }

      function updateHeader() {
        stoneValue.textContent = state.stones;
        energyValue.textContent = state.energy;
        favorValue.textContent = state.favor;
        if (!state.candidate) return;
        const place = state.regionId === "outer"
          ? LOCATION_DATA[state.location]?.short
          : REGION_DATA[state.regionId]?.short;
        realmLabel.textContent = getPreviewRealmText() + " · " + (place || "修行");
        rootLabel.textContent = state.candidate.grade + " · " + state.candidate.title;
      }

      function updateNav() {
        bottomNav.querySelectorAll("[data-tab]").forEach((button) => {
          button.classList.toggle("active", button.dataset.tab === state.tab);
          button.setAttribute("aria-current", button.dataset.tab === state.tab ? "page" : "false");
        });
      }

      function getCompanionById(companionId) {
        return COMPANION_POOL.find((companion) => companion.id === companionId) || null;
      }

      function getCompanionRecord(companionId) {
        const existing = state.companions[companionId];
        if (existing && typeof existing === "object") {
          return existing;
        }
        const record = {
          recruited: false,
          copies: 0,
          favor: 0,
          active: false,
          memory: 0,
        };
        state.companions[companionId] = record;
        return record;
      }

      function ensureStarterCompanion() {
        if (state.starterCompanionGranted || !isTaskCompleted("main_intro")) {
          return false;
        }
        const starter = getCompanionById("xu_zhao_tang");
        if (!starter) return false;
        const record = getCompanionRecord(starter.id);
        record.recruited = true;
        record.copies = Math.max(1, Number(record.copies) || 0);
        record.favor = Math.max(1, Number(record.favor) || 0);
        record.memory = Math.max(0, Number(record.memory) || 0);
        record.recruitedAt = Number(record.recruitedAt) || Date.now();
        if (getActiveCompanions().length < 3) {
          record.active = true;
        }
        state.starterCompanionGranted = true;
        return true;
      }

      function isCompanionPoolUnlocked(companion) {
        if (!companion) return false;
        if (state.devAllMaps) return true;
        if (companion.id === "ye_chen_xing") {
          return state.qi06SharedLedger || isTaskCompleted("main_chapter6");
        }
        return companion.unlockTask
          ? isTaskCompleted(companion.unlockTask)
          : state.rootLocked;
      }

      function getRecruitableCompanions() {
        return COMPANION_POOL.filter(isCompanionPoolUnlocked);
      }

      function getUnlockedSummonBanners() {
        return SUMMON_BANNERS.filter((banner) => {
          if (state.devAllMaps) return true;
          return banner.unlockTask ? isTaskCompleted(banner.unlockTask) : true;
        });
      }

      function getActiveSummonBanner() {
        const unlocked = getUnlockedSummonBanners();
        const selected = unlocked.find((banner) => banner.id === state.summon.bannerId);
        return selected || unlocked[0] || SUMMON_BANNERS[0];
      }

      function getBannerCompanions(banner = getActiveSummonBanner()) {
        const ids = Array.isArray(banner?.companionIds) ? banner.companionIds : [];
        return ids
          .map((companionId) => getCompanionById(companionId))
          .filter((companion) => companion && isCompanionPoolUnlocked(companion));
      }

      function getActiveCompanions() {
        return COMPANION_POOL.filter((companion) => {
          const record = state.companions[companion.id];
          return record?.recruited === true && record?.active === true;
        }).slice(0, 3);
      }

      const COMPANION_BATTLE_BONUSES = {
        guan_yan_qiu: { insight: 2 },
        cheng_shou_mo: { maxMana: 1, manaRecovery: 1 },
        su_wan_chao: { manaRecovery: 2 },
        xu_zhao_tang: { maxHp: 16, defense: 2 },
        ye_chen_xing: { attack: 3, insight: 1 },
      };

      const COMPANION_FAVOR_BONUSES = {
        guan_yan_qiu: { insight: [1, 1] },
        cheng_shou_mo: { maxMana: [1, 1], manaRecovery: [1, 1] },
        su_wan_chao: { manaRecovery: [1, 1] },
        xu_zhao_tang: { maxHp: [8, 8], defense: [1, 1] },
        ye_chen_xing: { attack: [1, 1], insight: [1, 1] },
      };

      const BATTLE_BONUS_LABELS = {
        maxHp: "气血",
        attack: "攻击",
        defense: "防御",
        insight: "洞察",
        maxMana: "法力上限",
        manaRecovery: "回气",
      };

      function getCompanionFavorTier(companionId) {
        const favor = normalizeCompanionFavor(
          getCompanionRecord(companionId).favor,
        );
        return Math.min(2, Math.floor(getCompanionFavorStageIndex(favor) / 2));
      }

      function getCompanionBattleBonuses(activeCompanions = getActiveCompanions()) {
        return activeCompanions.reduce((bonuses, companion) => {
          const support = COMPANION_BATTLE_BONUSES[companion.id] || {};
          const favorTier = getCompanionFavorTier(companion.id);
          const favorSupport = COMPANION_FAVOR_BONUSES[companion.id] || {};
          Object.keys(bonuses).forEach((key) => {
            bonuses[key] += Number(support[key] || 0);
            if (favorTier > 0) {
              const tierValues = Array.isArray(favorSupport[key])
                ? favorSupport[key]
                : [];
              for (let tierIndex = 0; tierIndex < favorTier; tierIndex += 1) {
                bonuses[key] += Number(tierValues[tierIndex] || 0);
              }
            }
          });
          return bonuses;
        }, {
          maxHp: 0,
          attack: 0,
          defense: 0,
          insight: 0,
          maxMana: 0,
          manaRecovery: 0,
        });
      }

      function getCompanionBattleBonusSummary(companionId) {
        const support = COMPANION_BATTLE_BONUSES[companionId] || {};
        const favorSupport = COMPANION_FAVOR_BONUSES[companionId] || {};
        const tier = getCompanionFavorTier(companionId);
        const total = {};
        Object.keys(BATTLE_BONUS_LABELS).forEach((key) => {
          const value = Number(support[key] || 0);
          const favorValues = Array.isArray(favorSupport[key]) ? favorSupport[key] : [];
          const favorValue = favorValues
            .slice(0, tier)
            .reduce((sum, amount) => sum + Number(amount || 0), 0);
          if (value + favorValue > 0) {
            total[key] = value + favorValue;
          }
        });
        const text = Object.entries(total)
          .map(([key, value]) => `${BATTLE_BONUS_LABELS[key]} +${value}`)
          .join(" · ");
        return text || "暂未形成战斗支援";
      }

      function normalizeCompanionFavor(favor) {
        return Math.max(0, Math.floor(Number(favor) || 0));
      }

      function getCompanionFavorStageIndex(favor) {
        const value = normalizeCompanionFavor(favor);
        return COMPANION_FAVOR_STAGES.reduce(
          (index, stage, currentIndex) => (value >= stage.min ? currentIndex : index),
          0,
        );
      }

      function getCompanionFavorMilestoneText(favor) {
        const value = normalizeCompanionFavor(favor);
        const stage = getCompanionFavorStage(value);
        const nextStage = COMPANION_FAVOR_STAGES.find((entry) => entry.min > value);
        if (!nextStage) {
          return `已进入${stage.label}阶段（${value} 点），好感仍可继续累积`;
        }
        return `${stage.label}阶段 · 再 ${nextStage.min - value} 点进入${nextStage.label}`;
      }

      function getCompanionPersona(companionId) {
        return COMPANION_PERSONAS[companionId] || null;
      }

      function getCompanionFavorStage(favor) {
        return COMPANION_FAVOR_STAGES[getCompanionFavorStageIndex(favor)]
          || COMPANION_FAVOR_STAGES[0];
      }

      function pickCompanionLine(lines, seed = 0) {
        if (!Array.isArray(lines) || !lines.length) return "";
        const normalizedSeed = Math.abs(Math.floor(Number(seed) || 0));
        return lines[normalizedSeed % lines.length];
      }

      function nextCompanionInteractionSeed() {
        state.companionInteractionCounter = (
          Math.max(0, Math.floor(Number(state.companionInteractionCounter) || 0)) + 1
        ) % 100000;
        return state.companionInteractionCounter;
      }

      function getCompanionInteractionLine(companion, record, context = "talk") {
        const persona = getCompanionPersona(companion?.id);
        const stageIndex = getCompanionFavorStageIndex(record?.favor);
        const stageLines = persona?.dialogue?.[stageIndex];
        if (Array.isArray(stageLines) && stageLines.length) {
          const contextOffset = context === "open" ? 0 : context === "gift" ? 1 : 2;
          const seed = (
            Number(state.companionInteractionCounter) || 0
          ) + (Number(record?.copies) || 0) + contextOffset;
          return pickCompanionLine(stageLines, seed);
        }
        const fallbackLines = Array.isArray(companion?.bondLines)
          ? companion.bondLines
          : [];
        return pickCompanionLine(
          fallbackLines,
          (Number(state.companionInteractionCounter) || 0)
            + normalizeCompanionFavor(record?.favor),
        ) || "对方没有急着说话，只把手边的东西往你这边推了推。";
      }

      function getCompanionGiftFit(companionId, gift) {
        const persona = getCompanionPersona(companionId);
        const preferred = gift?.preferredIds?.includes(companionId) === true;
        const disliked = persona?.dislikedGiftIds?.includes(gift?.id) === true;
        return {
          preferred,
          disliked: !preferred && disliked,
          label: preferred ? "偏好礼物" : disliked ? "反应有限" : "普通礼物",
        };
      }

      function getCompanionGiftReaction(companion, record, gift) {
        const persona = getCompanionPersona(companion?.id);
        const fit = getCompanionGiftFit(companion?.id, gift);
        const category = fit.preferred
          ? "preferred"
          : fit.disliked
            ? "disliked"
            : "ordinary";
        const fallback = {
          preferred: [`${companion.name}接过{{gift}}，指尖在包装上停了一下。`],
          ordinary: [`${companion.name}收下{{gift}}，把它放在了自己伸手可及的地方。`],
          disliked: [`${companion.name}看了{{gift}}一眼，还是收下了，但没有多说。`],
        };
        const lines = persona?.giftReplies?.[category] || fallback[category];
        const seed = (
          Number(state.companionInteractionCounter) || 0
        ) + (Number(record?.favor) || 0) + (Number(record?.copies) || 0);
        return pickCompanionLine(lines, seed).replaceAll("{{gift}}", gift?.name || "礼物");
      }

      function giveCompanionGift(companionId, giftId) {
        const companion = getCompanionById(companionId);
        const record = getCompanionRecord(companionId);
        const gift = getCompanionGift(giftId);
        const item = getInventoryItem(giftId);
        if (!companion || !record.recruited || !gift || !item) return;
        if (!removeInventoryItemCount(giftId)) {
          showToast(`库存不足：${gift.name}`);

        const fit = getCompanionGiftFit(companionId, gift);
        const favorGain = fit.preferred
          ? Number(gift.favor || 1) + 1
          : fit.disliked
            ? Math.max(1, Number(gift.favor || 1) - 1)
            : Number(gift.favor || 1);
        const before = Math.max(0, Number(record.favor) || 0);
        record.favor = before + favorGain;
        state.companionCultivationId = companionId;
        nextCompanionInteractionSeed();
        state.companionMessage = getCompanionGiftReaction(companion, record, gift);
        persistPreviewState();
        render();
        showToast(`${companion.name} 好感 +${record.favor - before}`, "reward");

      function pickSummonCompanion(pool, banner, preferNew = false) {
        const source = pool.length ? pool : getRecruitableCompanions();
        if (!source.length) return null;
        const undiscovered = source.filter((companion) => !getCompanionRecord(companion.id).recruited);
        const candidates = preferNew && undiscovered.length ? undiscovered : source;
        const weighted = candidates.map((companion) => ({
          companion,
          weight: Math.max(
            0.001,
            Number(banner?.companionRates?.[companion.id])
              || (banner?.featuredIds?.includes(companion.id) ? 0.03 : 0.01),
          ),
        }));
        const totalWeight = weighted.reduce((sum, entry) => sum + entry.weight, 0);
        let roll = Math.random() * totalWeight;
        for (const entry of weighted) {
          roll -= entry.weight;
          if (roll <= 0) return entry.companion;
        }
        return weighted[weighted.length - 1]?.companion || candidates[0];
      }

      function rollSummonMemory() {
        const reward = SUMMON_MEMORY_REWARDS[
          Math.floor(Math.random() * SUMMON_MEMORY_REWARDS.length)
        ] || SUMMON_MEMORY_REWARDS[0];
        state.summon.memory = Math.max(0, Number(state.summon.memory) || 0) + reward.amount;
        return reward;
      }

      function drawCompanions(count = 1, options = {}) {
        if (summonAnimation.active) {
          return;
        }
        const drawCount = Math.max(1, Math.min(10, Math.floor(Number(count) || 1)));
        const free = options.free === true;
        const useFreeTicket = drawCount === 10
          && options.useFreeTicket === true
          && Math.max(0, Math.floor(Number(state.summon.freeTenDraws) || 0)) > 0;
        const banner = getActiveSummonBanner();
        const cost = free || useFreeTicket
          ? 0
          : drawCount === 10
            ? banner.tenCost
            : banner.singleCost;
        const pool = getBannerCompanions(banner);
        if (!pool.length) {
          showToast("当前招募池未解锁，请完成对应主线");
          return;
        }
        if (!free && !useFreeTicket && state.stones < cost) {
          showToast(`灵石不足，${drawCount === 10 ? "十连" : "单抽"}需要 ${cost} 灵石`);
          return;
        }

        if (useFreeTicket) {
          state.summon.freeTenDraws = Math.max(
            0,
            Math.floor(Number(state.summon.freeTenDraws) || 0) - 1,
          );
        }
        if (cost > 0) {
          state.stones -= cost;
          state.summon.totalSpent += cost;
        }
        const drawStart = Math.max(0, Number(state.summon.totalDraws) || 0);
        state.summon.totalDraws += drawCount;
        const results = [];
        for (let index = 0; index < drawCount; index += 1) {
          const hasUndiscovered = pool.some(
            (companion) => !getCompanionRecord(companion.id).recruited,
          );
          const beginnerGuarantee = drawStart + index < 3 && hasUndiscovered;
          const pityGuarantee = state.summon.pity >= SUMMON_PARTNER_PITY_LIMIT - 1;
          const partnerRate = Math.max(
            0,
            Math.min(1, Number(banner.partnerRate) || 0),
          );
          const isPartnerContract = beginnerGuarantee
            || pityGuarantee
            || Math.random() < partnerRate;
          if (!isPartnerContract) {
            const memory = rollSummonMemory();
            state.summon.pity = Math.min(
              SUMMON_PARTNER_PITY_LIMIT - 1,
              Math.max(0, Number(state.summon.pity) || 0) + 1,
            );
            results.push({ type: "memory", reward: memory });
            continue;
          }

          const companion = pickSummonCompanion(
            pool,
            banner,
            beginnerGuarantee || pityGuarantee,
          );
          const record = getCompanionRecord(companion.id);
          const isNew = !record.recruited;
          record.recruited = true;
          record.copies = Math.max(0, Number(record.copies) || 0) + 1;
          record.recruitedAt = Number(record.recruitedAt) || Date.now();
          if (!isNew) {
            record.favor = Math.max(0, Number(record.favor) || 0) + 1;
            record.memory = Math.max(0, Number(record.memory) || 0) + 1;
            state.summon.shards = Math.max(0, Number(state.summon.shards) || 0) + 1;
          } else if (getActiveCompanions().length < 3) {
            record.active = true;
          }
          state.summon.pity = 0;
          results.push({ type: "companion", companion, isNew });
        }

        const lastCompanion = [...results].reverse().find((result) => result.type === "companion");
        state.summon.lastResultId = lastCompanion?.companion?.id || "";
        state.summon.lastResultCount = drawCount;
        state.summon.lastResultNew = results.some((result) => result.type === "companion" && result.isNew);
        state.summon.lastBannerId = banner.id;
        state.summon.lastResults = results.map((result) => result.type === "companion"
          ? {
            type: result.type,
            id: result.companion.id,
            isNew: result.isNew,
          }
          : {
            type: result.type,
            rewardId: result.reward.id,
            amount: result.reward.amount,
          });
        state.tab = "summon";
        persistPreviewState();
        const newCount = results.filter((result) => result.type === "companion" && result.isNew).length;
        const contractCount = results.filter((result) => result.type === "companion").length;
        const memoryCount = results
          .filter((result) => result.type === "memory")
          .reduce((sum, result) => sum + result.reward.amount, 0);
        const summary = [
          useFreeTicket
            ? "更新奖励十连完成"
            : free
            ? "广告五连完成"
            : `${drawCount === 10 ? "十连" : "单抽"}完成`,
          results.some((result, index) =>
            result.type === "companion" && drawStart + index < 3,
          )
            ? "新手保底已优先回应"
            : "",
          contractCount ? `伙伴契约 ${contractCount} 次` : "",
          newCount ? `新伙伴 ${newCount} 人` : "",
          memoryCount ? `同契记忆 +${memoryCount}` : "",
          results.some((result) => result.type === "companion" && !result.isNew)
            ? `契片 +${results.filter((result) => result.type === "companion" && !result.isNew).length}`
            : "",
        ].filter(Boolean).join(" · ");
        startSummonAnimation({
          drawCount,
          free: free || useFreeTicket,
          summary,
          tone: newCount ? "reward" : "confirm",
        });
      }

        if (!state.clues.includes(clueId)) {

      function combineClues(combinationId) {
        const combination = CLUE_COMBINATIONS.find((item) => item.id === combinationId);
        if (!combination || combination.required.some((clueId) => !state.clues.includes(clueId))) {
          showToast("线索条件不足，暂时无法推演");
          return;
        }
        if (state.clues.includes(combination.result)) {
          showToast("该组线索已形成结论");
          return;
        }
        addClue(combination.result);
        state.stats.insight += 1;
        state.suspicion = Math.max(0, state.suspicion - 1);
        showToast("线索已组合：形成新的调查结论");
        render();
      }

      function getTaskRequirementDetails(taskId) {
        const task = TASKS[taskId];
        if (!task) return [];
        if (taskId === "main_intro") {
          return [{ label: "锁定灵根", complete: state.rootLocked }];
        }
        const details = (TASK_PREREQUISITES[taskId] || []).map((prerequisiteId) => ({
          label: `完成「${TASKS[prerequisiteId]?.title || prerequisiteId}」`,
          complete: isTaskCompleted(prerequisiteId),
        }));
        if (task.requiredRealm) {
          details.push({
            label: `达到炼气${task.requiredRealm}层`,
            complete: getPreviewRealmRank() >= Number(task.requiredRealm),
          });
        }
        if (taskId === "favor_su") {
          details.push({
            label: "与苏晚潮好感达到2",
            complete: state.favor >= 2,
          });
        }
        return details;
      }

      function getTaskMissingRequirementText(taskId) {
        const missing = getTaskRequirementDetails(taskId)
          .filter((item) => !item.complete)
          .map((item) => item.label);
        return missing.length ? missing.join("、") : "所有条件已满足";
      }

      function isTaskUnlocked(taskId) {
        if (!TASKS[taskId]) return false;
        if (taskId === "favor_su" && state.favor < 2) return false;
        if (getPreviewRealmRank() < Number(TASKS[taskId].requiredRealm || 1)) return false;
        return (TASK_PREREQUISITES[taskId] || []).every(isTaskCompleted);
      }

      function isTaskAtTarget(taskId) {
        const task = TASKS[taskId];
        if (!task) return false;
        if (taskId === "main_chapter3") {
          return state.regionId === task.target;
        }
        return state.location === task.target || state.regionId === task.target;
      }

      function getTaskProgress(taskId) {
        const done = isTaskCompleted(taskId);
        const unlocked = isTaskUnlocked(taskId);
        const atTarget = isTaskAtTarget(taskId);
        return {
          done,
          unlocked,
          atTarget,
          status: done
            ? "已完成"
            : !unlocked
              ? "未解锁"
              : atTarget
                ? "已抵达目标"
                : "待抵达",
          actionLabel: done
            ? "已完成"
            : !unlocked

              : atTarget
                ? "进入调查"

          chapter3: "main_chapter3",
          chapter4: "main_chapter4",

          side4: "side_chapter4",

      function getLocationEvent(locationId) {
        let event = EVENT_DEFINITIONS[locationId];
        if (!event) return null;
        if (locationId === "west") {
          if (!state.storyStarted && !isTaskCompleted("main_intro")) {
            event = EVENT_DEFINITIONS.west;
          } else if (isTaskUnlocked("side_chapter4") && !isTaskCompleted("side_chapter4")) {
            event = EVENT_DEFINITIONS.west_side4;
          } else {
            return null;
          }
        }
        if (locationId === "market" && (state.regionId !== "market" || !REGION_DATA.market.unlocked())) return null;
        if (locationId === "garden") {
          if (!isTaskCompleted("side_herb")) {
            event = EVENT_DEFINITIONS.garden;
          } else if (isTaskCompleted("main_chapter4") && !isTaskCompleted("main_chapter5")) {
            event = EVENT_DEFINITIONS.garden_chapter5;
          } else if (isTaskUnlocked("side_chapter3") && !isTaskCompleted("side_chapter3")) {
            event = EVENT_DEFINITIONS.garden_side3;
          } else if (isTaskUnlocked("side_chapter5") && !isTaskCompleted("side_chapter5")) {
            event = EVENT_DEFINITIONS.garden_side5;
          } else {
            return null;
          }
        }
        if (locationId === "library") {
          if (isTaskUnlocked("main_chapter4") && !isTaskCompleted("main_chapter4")) {
            event = EVENT_DEFINITIONS.library_chapter4;
          } else if (isTaskUnlocked("main_chapter2") && !isTaskCompleted("main_chapter2")) {
            event = EVENT_DEFINITIONS.library;
          } else {
            return null;
          }
        }
        if (locationId === "rear_mountain") {
          if (!isTaskUnlocked("main_chapter3") || isTaskCompleted("main_chapter3")) return null;
          event = EVENT_DEFINITIONS.rear_mountain;
        }
        if (
          locationId === "inner_sect_chapter6"
          && (!isTaskUnlocked("main_chapter6") || isTaskCompleted("main_chapter6"))
        ) {
          return null;
        }
        const taskId = getEventTaskId(event);
        if (taskId && (isTaskCompleted(taskId) || !isTaskUnlocked(taskId))) {
          return null;
        }
        return { ...event, locationId };

        if (!state.pendingEvent || state.eventTriggerMode !== "confirm") return "";
        const nearbyLocation = getNearbyRegionLocation() || getNearbyOuterLocation();
        const nearbyChallenges = getNearbyPveChallenges();
        const hasNearbyChoices = nearbyChallenges.length
          || (nearbyLocation?.id === "garden" && state.regionId === "outer");
        if (hasNearbyChoices) return "";
        const event = state.pendingEvent;
        return `
          <div class="event-prompt" role="dialog" aria-label="待处理事件">
            <div class="event-prompt-card">
              <div class="event-prompt-kicker">${escapeHtml(event.kicker)}</div>

            </div>
          </div>
        `;

      function enterPendingEvent() {
        const event = state.pendingEvent;
        if (!event) return;
        if (!startStory(event.kind, event.nodeId)) {
          state.pendingEvent = null;
          render();
        }
      }

      function queueLocationEvent(locationId) {
        const event = getLocationEvent(locationId);
        if (!event) return false;
        const taskId = getEventTaskId(event);
        if (taskId && (isTaskCompleted(taskId) || !isTaskUnlocked(taskId))) {
          state.pendingEvent = null;
          return false;
        }

        if (state.eventTriggerMode === "auto") {
          return startStory(event.kind, event.nodeId);
        }

        state.pendingEvent = event;
        render();
        if (state.eventTriggerMode === "manual") {
          showToast("事件已记录，可在任务栏手动进入");
        }
        return true;
      }

      function startChapterSideStory(kind, taskId) {
        const task = TASKS[taskId];
        if (!task) return;
        if (task.target !== "market" && (state.regionId !== "outer" || state.mapView !== "local")) {
          void enterRegion("outer").then(() => {
            if (state.regionId === "outer" && state.mapView === "local") {
              moveToLocation(task.target);
            }
          });
          return;
        }
        if (task.target === "market") {
          if (state.regionId !== "market" || state.mapView !== "local") {
            if (state.regionId === "outer" && state.unlocked.market) {
              void enterRegion("market").then(() => {
                if (state.regionId === "market" && state.mapView === "local") {
                  activateRegionLocation("square");
                }
              });
            } else {
              state.selectedRegionId = "market";
              state.mapView = "world";
              render();
            }
            return;
          }
          if (!isNearRegionLocation("square")) {
            activateRegionLocation("square");
            return;
          }
        } else if (state.location !== task.target) {
          moveToLocation(task.target);
          return;
        }
        startStory(kind, kind === "side2" ? "s201" : kind === "side3" ? "s301" : kind === "side4" ? "s401" : "s501");
      }

      function openRewardSettlement(
        title,
        summary,
        rewards,
        category = "story",
        returnTab = category === "tower" ? "tower" : "map",
      ) {
        state.lastRewardSettlement = {
          id: `settlement_${category}_${category === "pve" ? state.pveChallengeId : state.storyKind}_${Date.now()}`,
          category,
          title,
          summary,
          rewards: rewards.map((reward) => ({ ...reward })),
          doubleClaimed: false,
          returnTab,
          storyKind: state.storyKind,
        };
        state.rewardSettlementOpen = true;
        state.storyActive = false;
        state.battleActive = false;
        AudioService.play("reward");
      }

      function applySettlementReward(reward, multiplier = 1) {
        const count = Number(reward.count || 0) * multiplier;
        if (!count) return;
        if (reward.kind === "resource") {
          if (reward.key === "cultivation") {
            state.cultivation = Math.min(
              state.cultivationNeed,
              state.cultivation + count,
            );
            return;
          }
          if (reward.key === "energy") {
            state.energy = Math.max(0, state.energy + count);
            applyPassiveEnergyRegen();
            return;
          }
          if (reward.key === "favor") {
            state.favor += count;
            return;
          }
          if (reward.key === "insight") {
            state.stats.insight += count;
            return;
          }
          if (reward.key === "body") {
            state.stats.body += count;
            return;
          }
          if (reward.key === "stones") {
            state.stones += count;
          }
          return;
        }
        addReward({
          ...reward,
          count,
        });
      }

      function claimSettlementDouble() {
        const settlement = state.lastRewardSettlement;
        if (!settlement || !state.rewardSettlementOpen || settlement.doubleClaimed) {
          return;
        }
        const placement = `settlement_${settlement.id}`;
        void AdService.showRewarded({
          placement,
          onReward: () => {
            if (settlement.doubleClaimed) return;
            settlement.rewards.forEach((reward) => applySettlementReward(reward));
            settlement.doubleClaimed = true;
            state.adClaims[settlement.id] = true;
            persistPreviewState();
          },
        });
      }

        if (!state.rewardSettlementOpen) return;
        const settlement = state.lastRewardSettlement;

        state.battleMode = "story";
        state.pveChallengeId = "";

        state.battleGuardRounds = 0;
        state.tab = settlement?.returnTab

            && (settlement.storyKind === "chapter2" || isTaskCompleted("main_chapter2"))
